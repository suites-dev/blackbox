<svg xmlns="http://www.w3.org/2000/svg" width="360" height="706" viewBox="0 0 360 706" role="img" aria-labelledby="title desc"><title id="title">Spec to execution</title><desc id="desc">Markdown or Spec Kit supplies intent. The agent drafts scenarios for review. Validated Features emit a Playwright suite, whose isolated executions produce evidence.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#52525b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f4f4f5}.heading{font-size:22px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#a1a1aa}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;fill:#ef9dab}.box{fill:#17171c;stroke:#2b2b33;stroke-width:1.4}.accent{stroke:#ef9dab}.line{fill:none;stroke:#52525b;stroke-width:1.5;stroke-linejoin:round}</style></defs><rect width="360" height="706" fill="#0f0f12"/><text x="24" y="34" class="heading">Spec to execution</text><path d="M28 65h282l22 22v108H28Z M310 65v22h22" class="box"/><text x="44" y="97" class="mono">requirement.md</text><text x="44" y="129" class="small">Markdown or Spec Kit</text><path d="M180 204V235" class="line" marker-end="url(#a)"/><text x="199" y="224" class="small">draft</text><path d="M28 245h282l22 22v108H28Z M310 245v22h22" class="box"/><text x="44" y="277" class="mono">feature.feature</text><text x="44" y="309" class="small">Review the expected behavior</text><path d="M180 384V415" class="line" marker-end="url(#a)"/><text x="199" y="404" class="small">validate / emit</text><path d="M28 425h282l22 22v108H28Z M310 425v22h22" class="box"/><text x="44" y="457" class="mono">Playwright suite</text><text x="44" y="489" class="small">Native Blackbox fixture</text><path d="M180 564V595" class="line" marker-end="url(#a)"/><text x="199" y="584" class="small">run</text><rect x="28" y="605" width="304" height="76" rx="14" class="box accent" stroke-dasharray="4 5"/><text x="44" y="634" class="label">Isolated run</text><text x="44" y="657" class="small">response / state / observations</text></svg>
