<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="369" viewBox="0 0 1024 369" role="img" aria-labelledby="title desc"><title id="title">Evidence from one run</title><desc id="desc">One test execution provides response evidence, explicit state reads, and supported runtime observations. They are separate sources, not sequential steps or interchangeable proof.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#52525b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f4f4f5}.heading{font-size:22px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#a1a1aa}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;fill:#ef9dab}.box{fill:#17171c;stroke:#2b2b33;stroke-width:1.4}.accent{stroke:#ef9dab}.line{fill:none;stroke:#52525b;stroke-width:1.5;stroke-linejoin:round}</style></defs><rect width="1024" height="369" fill="#0f0f12"/><text x="24" y="34" class="heading">Evidence from one run</text><rect x="372" y="62" width="280" height="74" rx="14" class="box accent"/><text x="388" y="91" class="label">One system test</text><text x="388" y="114" class="small">controlled execution</text><path d="M512 136V161H181V185" class="line" marker-end="url(#a)"/><path d="M512 161V185" class="line" marker-end="url(#a)"/><path d="M512 161H843V185" class="line" marker-end="url(#a)"/><rect x="46" y="194" width="270" height="74" rx="14" class="box"/><text x="62" y="223" class="label">Response</text><text x="62" y="246" class="small">what returned</text><rect x="377" y="194" width="270" height="74" rx="14" class="box"/><text x="393" y="223" class="label">State read</text><text x="393" y="246" class="small">what persisted</text><rect x="708" y="194" width="270" height="74" rx="14" class="box"/><text x="724" y="223" class="label">Observations</text><text x="724" y="246" class="small">what ran</text><path d="M181 268V293H512V316" class="line" marker-end="url(#a)"/><path d="M512 268V293" class="line"/><path d="M843 268V293H512" class="line"/><text x="512" y="341" class="label" text-anchor="middle">Checks against expected behavior</text></svg>
