<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="762" viewBox="0 0 1120 762" role="img" aria-labelledby="f06-title f06-desc" font-family="Inter, Arial, sans-serif"><title id="f06-title">A retry is a new execution&#8212;not an edited result.</title><desc id="f06-desc">Native Playwright runs the tests. Blackbox retains each physical attempt and its evidence.</desc><defs><marker id="f06-a-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#71717A"/></marker><marker id="f06-a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#C54164"/></marker><marker id="f06-a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#52525B"/></marker><style>.s0{fill:#F4F4F5;stroke:#18181B;stroke-opacity:0.13;stroke-width:1.5;}.s1{fill:#52525B;font-size:15;}.s2{fill:#52525B;font-size:14;}.s3{fill:#18181B;font-size:16;}.s4{fill:#18181B;font-family:JetBrains Mono, Consolas, monospace;font-size:16;}.s5{fill:none;stroke:#71717A;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}</style></defs><rect x="0" y="0" width="1120" height="762" rx="0" fill="#FFFFFF"/><text x="44" y="35" font-size="13" font-weight="600" fill="#C54164" letter-spacing="1.4">SUITES / BLACKBOX     06</text><text x="44" y="80" font-size="29" font-weight="600" fill="#18181B">A retry is a new execution&#8212;not an edited result.</text><text x="44" y="111" font-size="16" fill="#52525B">Native Playwright runs the tests. Blackbox retains each physical attempt and its evidence.</text><rect x="44" y="153" width="1032" height="75" rx="18" class="s0"/><svg x="67" y="179" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></svg><text x="106" y="182" font-size="20" font-weight="575" fill="#18181B">Run &#8594; Checkout flow &#8594; Duplicate-checkout scenario</text><text x="106" y="208" class="s1">Project: system &#183; SUT: checkout-system &#183; final outcome: flaky</text><rect x="44" y="257" width="502" height="319" rx="18" class="s0"/><svg x="66" y="279" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A43653" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg><text x="106" y="299" font-size="16" font-weight="575" fill="#A43653">ATTEMPT 0 &#183; FAILED</text><text x="68" y="350" class="s2">Response assertion</text><text x="289" y="350" class="s3">201 &#183; passed</text><text x="68" y="394" class="s2">Observed HTTP</text><text x="289" y="394" class="s4">2 &#215; POST /orders</text><text x="68" y="438" class="s2">Runtime check</text><text x="289" y="438" font-size="14" fill="#A43653">false &#183; exactly one requested</text><text x="68" y="482" class="s2">Effects snapshot</text><text x="289" y="482" class="s3">drifted</text><path d="M68 511 H522" class="s5"/><svg x="68" y="534" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg><text x="101" y="550" class="s1">Own attempt identity + own evidence</text><rect x="574" y="257" width="502" height="319" rx="18" class="s0"/><svg x="596" y="279" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#18181B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 5 5L20 5"/></svg><text x="636" y="299" font-size="16" font-weight="575" fill="#18181B">ATTEMPT 1 &#183; RETRY PASSED</text><text x="598" y="350" class="s2">Response assertion</text><text x="819" y="350" class="s3">201 &#183; passed</text><text x="598" y="394" class="s2">Observed HTTP</text><text x="819" y="394" class="s4">1 &#215; POST /orders</text><text x="598" y="438" class="s2">Runtime check</text><text x="819" y="438" font-size="14" fill="#18181B">true &#183; exactly one requested</text><text x="598" y="482" class="s2">Effects snapshot</text><text x="819" y="482" class="s3">matched</text><path d="M598 511 H1052" class="s5"/><svg x="598" y="534" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg><text x="631" y="550" class="s1">Own attempt identity + own evidence</text><path d="M546 417 H574" stroke-dasharray="5 6" class="s5"/><rect x="44" y="604" width="1032" height="89" rx="18" fill="#EEEEF0" stroke="#18181B" stroke-opacity="0.13" stroke-width="1.5"/><svg x="66" y="628" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v12c0 4 5 4 5 4m-5-8h8c3 0 4-3 4-6"/><circle cx="6" cy="3" r="2"/><circle cx="13" cy="19" r="2"/><circle cx="18" cy="3" r="2"/></svg><text x="106" y="635" font-size="18" font-weight="575" fill="#18181B">ODC &#183; Experimental &#183; evaluated over eligible flow evidence</text><text x="106" y="665" class="s1">Separate from pass/fail. Superseded attempts do not supply missing outcome witnesses.</text><path d="M44 709 H1076" class="s5"/><text x="44" y="736" class="s2">A passing retry preserves the failed attempt. Never combine their counts, spans or checks to create a nicer result.</text></svg>
