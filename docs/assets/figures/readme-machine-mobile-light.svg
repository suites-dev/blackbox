<svg xmlns="http://www.w3.org/2000/svg" width="360" height="579" viewBox="0 0 360 579" role="img" aria-labelledby="title desc"><title id="title">Two execution paths</title><desc id="desc">A coding agent uses the CLI and skills to investigate with a Capsule or run repeatable Playwright tests. Both operate selected system boundaries and retain evidence. They do not share live state.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#71717a"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#18181b}.heading{font-size:22px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#52525b}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;fill:#c54164}.box{fill:#f4f4f5;stroke:#d4d4d8;stroke-width:1.4}.accent{stroke:#c54164}.line{fill:none;stroke:#71717a;stroke-width:1.5;stroke-linejoin:round}</style></defs><rect width="360" height="579" fill="#ffffff"/><text x="24" y="34" class="heading">Two execution paths</text><rect x="28" y="65" width="304" height="76" rx="14" class="box accent"/><text x="44" y="94" class="label">Coding agent</text><text x="44" y="117" class="small">CLI + skills</text><path d="M180 141V169H98V194" class="line" marker-end="url(#a)"/><path d="M180 169H262V194" class="line" marker-end="url(#a)"/><rect x="28" y="202" width="140" height="76" rx="14" class="box"/><text x="44" y="231" class="label">Capsule</text><text x="44" y="254" class="small">investigate</text><rect x="192" y="202" width="140" height="76" rx="14" class="box"/><text x="208" y="231" class="label">Playwright</text><text x="208" y="254" class="small">confirm</text><path d="M98 278V314H180V341" class="line" marker-end="url(#a)"/><path d="M262 278V314H180" class="line"/><rect x="28" y="349" width="304" height="76" rx="14" class="box accent" stroke-dasharray="4 5"/><text x="44" y="378" class="label">Selected system</text><text x="44" y="401" class="small">separate executions</text><path d="M180 425V467" class="line" marker-end="url(#a)"/><rect x="28" y="475" width="304" height="76" rx="14" class="box"/><text x="44" y="504" class="label">Evidence</text><text x="44" y="527" class="small">checks + limits</text></svg>
