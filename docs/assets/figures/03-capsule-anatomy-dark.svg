<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="742" viewBox="0 0 1120 742" role="img" aria-labelledby="f03-title f03-desc" font-family="Inter, Arial, sans-serif"><title id="f03-title">Three kinds of information. One experiment.</title><desc id="f03-desc">Actions, observations and interpretation stay distinct&#8212;even when shown together.</desc><defs><marker id="f03-a-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#8B8B94"/></marker><marker id="f03-a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#E67189"/></marker><marker id="f03-a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker><style>.s0{fill:#17171C;stroke:#FFFFFF;stroke-opacity:0.13;stroke-width:1.5;}.s1{fill:#F4F4F5;font-size:19;font-weight:575;}.s2{fill:#A1A1AA;font-size:15;}.s3{fill:#EF9DAB;font-family:JetBrains Mono, Consolas, monospace;font-size:16;}.s4{fill:#F4F4F5;font-family:JetBrains Mono, Consolas, monospace;font-size:15;}</style></defs><rect x="0" y="0" width="1120" height="742" rx="0" fill="#0F0F12"/><text x="44" y="35" font-size="13" font-weight="600" fill="#EF9DAB" letter-spacing="1.4">SUITES / BLACKBOX     03</text><text x="44" y="80" font-size="29" font-weight="600" fill="#F4F4F5">Three kinds of information. One experiment.</text><text x="44" y="111" font-size="16" fill="#A1A1AA">Actions, observations and interpretation stay distinct&#8212;even when shown together.</text><rect x="44" y="154" width="1032" height="67" rx="18" class="s0"/><svg x="66" y="175" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><path d="M12 6v12"/></svg><text x="104" y="181" class="s1">cap_checkout_01</text><text x="104" y="204" class="s2">checkout-system &#183; &#8220;Does checkout send more than one order request?&#8221;</text><rect x="44" y="251" width="502" height="173" rx="18" class="s0"/><svg x="64" y="271" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 5 6-5 6M13 18h6"/></svg><text x="101" y="290" class="s1">01 / What the agent did</text><text x="68" y="327" class="s3">Activity: exec &#183; role: setup</text><text x="68" y="358" class="s4">node scripts/seed-cart.js cart-42</text><text x="68" y="394" class="s2">Result: exit 0. SQL consequences not observed.</text><rect x="574" y="251" width="502" height="173" rx="18" fill="#17171C" stroke="#DB486F" stroke-opacity="0.42" stroke-width="1.5"/><svg x="594" y="271" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v8h7m-7 0v8h12M11 8v8"/><circle cx="16" cy="12" r="3"/><circle cx="19" cy="20" r="2"/></svg><text x="631" y="290" class="s1">02 / What Blackbox observed</text><text x="598" y="327" class="s3">Activity: POST /checkout</text><text x="598" y="358" class="s4">2 &#215; POST /orders &#183; 1 &#215; INSERT orders</text><text x="598" y="394" class="s2">Only supported, attributable observations.</text><rect x="44" y="452" width="502" height="151" rx="18" class="s0"/><svg x="64" y="472" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v13l-5 5H4V3Zm11 18v-5h5M8 8h8M8 12h5"/></svg><text x="101" y="491" class="s1">03 / What the agent thinks</text><text x="68" y="526" font-size="18" fill="#EF9DAB">&#8220;Inspect checkout retry handling next.&#8221;</text><text x="68" y="568" class="s2">Agent note &#183; not a runtime verdict</text><rect x="574" y="452" width="502" height="151" rx="18" class="s0"/><svg x="594" y="472" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 3v7c0 4-5 8-8 10-3-2-8-6-8-10V5l8-3Z"/><path d="m7 12 3 3 7-7"/></svg><text x="631" y="491" class="s1">Checks, when requested</text><text x="598" y="526" font-size="18" fill="#F4F4F5">Claim &#8594; qualification &#8594; result</text><text x="598" y="559" class="s2">Recorded deterministic results stay separate from the</text><text x="598" y="580" class="s2">agent&#8217;s explanation.</text><rect x="44" y="631" width="1032" height="53" rx="18" fill="#202027" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1.5"/><svg x="66" y="646" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 10 5-10 5L2 8l10-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/></svg><text x="104" y="663" font-size="16" fill="#F4F4F5">HTML and JSON views project retained records; they do not create a second verdict.</text><path d="M44 689 H1076" fill="none" stroke="#8B8B94" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="716" font-size="14" fill="#A1A1AA">An authored setup/diagnostic role is context. It does not manufacture evidence or automatically assign effect origin.</text></svg>
