<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="706" viewBox="0 0 1120 706" role="img" aria-labelledby="f02-title f02-desc" font-family="Inter, Arial, sans-serif"><title id="f02-title">Stop the environment. Keep the experiment.</title><desc id="f02-desc">A Capsule is a bounded interactive experiment&#8212;not just the environment it starts.</desc><defs><marker id="f02-a-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#8B8B94"/></marker><marker id="f02-a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#E67189"/></marker><marker id="f02-a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker><style>.s0{fill:#A1A1AA;font-size:16;}.s1{fill:#17171C;stroke:#FFFFFF;stroke-opacity:0.13;stroke-width:1.5;}.s2{fill:none;stroke:#E67189;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.s3{fill:none;stroke:#8B8B94;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.s4{fill:#F4F4F5;font-size:17;font-weight:575;}.s5{fill:#A1A1AA;font-size:15;}.s6{fill:#F4F4F5;font-size:18;font-weight:575;}.s7{fill:#A1A1AA;font-size:14;}</style></defs><rect x="0" y="0" width="1120" height="706" rx="0" fill="#0F0F12"/><text x="44" y="35" font-size="13" font-weight="600" fill="#EF9DAB" letter-spacing="1.4">SUITES / BLACKBOX     02</text><text x="44" y="80" font-size="29" font-weight="600" fill="#F4F4F5">Stop the environment. Keep the experiment.</text><text x="44" y="111" class="s0">A Capsule is a bounded interactive experiment&#8212;not just the environment it starts.</text><rect x="44" y="156" width="638" height="351" rx="18" class="s1"/><svg x="64" y="176" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><path d="M12 6v12"/></svg><text x="102" y="195" font-size="14" font-weight="575" fill="#EF9DAB" letter-spacing="1">LIVE ENVIRONMENT</text><text x="64" y="223" class="s0">Selected SUT &#183; ephemeral</text><path d="M256 287 H355" marker-end="url(#f02-a-pink)" class="s2"/><path d="M502 309 V340 H568 V363" marker-end="url(#f02-a-neutral)" class="s3"/><path d="M256 306 V340 H159 V363" marker-end="url(#f02-a-neutral)" class="s3"/><path d="M431 309 V363" marker-end="url(#f02-a-neutral)" class="s3"/><rect x="70" y="253" width="204" height="74" rx="18" class="s1"/><svg x="90" y="273" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v9M8 5l9 5"/></svg><text x="127" y="292" class="s4">checkout-api</text><rect x="357" y="253" width="254" height="74" rx="18" class="s1"/><svg x="377" y="273" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v9M8 5l9 5"/></svg><text x="414" y="292" class="s4">orders-api</text><rect x="70" y="369" width="179" height="73" rx="18" class="s1"/><svg x="90" y="389" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 10-13h-7l1-7Z"/></svg><text x="127" y="408" class="s4">Redis</text><rect x="285" y="369" width="179" height="73" rx="18" class="s1"/><svg x="305" y="389" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><text x="342" y="408" font-size="16" font-weight="575" fill="#F4F4F5">PostgreSQL</text><rect x="500" y="369" width="155" height="73" rx="18" class="s1"/><svg x="520" y="389" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="14" height="4" rx="1"/><rect x="3" y="10" width="14" height="4" rx="1"/><rect x="3" y="16" width="14" height="4" rx="1"/><path d="m19 10 3 2-3 2"/></svg><text x="557" y="408" class="s4">Queue</text><text x="64" y="478" class="s5">Supported runtime capture is attached&#8212;not universal.</text><path d="M682 325 H741" marker-end="url(#f02-a-pink)" class="s2"/><rect x="747" y="156" width="329" height="351" rx="18" fill="#17171C" stroke="#DB486F" stroke-opacity="0.42" stroke-width="1.5"/><svg x="769" y="177" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5m-5 4 2 2 5-5"/></svg><text x="806" y="195" font-size="14" font-weight="575" fill="#EF9DAB" letter-spacing="0.9">RETAINED CAPSULE</text><svg x="770" y="235" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 5 6-5 6M13 18h6"/></svg><text x="807" y="252" class="s6">Activities</text><text x="770" y="279" class="s5">invocations + recorded results</text><svg x="770" y="302" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v8h7m-7 0v8h12M11 8v8"/><circle cx="16" cy="12" r="3"/><circle cx="19" cy="20" r="2"/></svg><text x="807" y="319" class="s6">Evidence</text><text x="770" y="346" class="s5">observations + capture limits</text><svg x="770" y="369" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v13l-5 5H4V3Zm11 18v-5h5M8 8h8M8 12h5"/></svg><text x="807" y="386" class="s6">Agent notes</text><text x="770" y="413" class="s5">authored interpretation</text><text x="770" y="478" font-size="16" fill="#EF9DAB">Still readable after stop.</text><rect x="44" y="550" width="174" height="86" rx="18" class="s1"/><svg x="60" y="566" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><path d="M12 6v12"/></svg><text x="90" y="583" class="s4">start</text><text x="60" y="612" class="s7">Ready environment</text><rect x="270" y="550" width="194" height="86" rx="18" class="s1"/><svg x="286" y="566" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 5 6-5 6M13 18h6"/></svg><text x="316" y="583" class="s4">curl / exec</text><text x="286" y="612" class="s7">One Activity</text><rect x="518" y="550" width="254" height="86" rx="18" class="s1"/><svg x="534" y="566" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></svg><text x="564" y="583" class="s4">show / inspect</text><text x="534" y="612" class="s7">Inspect / explain</text><rect x="826" y="550" width="250" height="86" rx="18" class="s1"/><svg x="842" y="566" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg><text x="872" y="583" class="s4">stop &#8594; report</text><text x="842" y="612" class="s7">Retain / render</text><path d="M218 592 H264" marker-end="url(#f02-a-pink)" class="s2"/><path d="M464 592 H512" marker-end="url(#f02-a-pink)" class="s2"/><path d="M772 592 H820" marker-end="url(#f02-a-pink)" class="s2"/><path d="M44 653 H1076" class="s3"/><text x="44" y="680" class="s7">Lifecycle status is not a behavioral verdict. Finalized does not mean the application behaved correctly.</text></svg>
