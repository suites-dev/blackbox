<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="450" viewBox="0 0 1100 450" role="img" aria-labelledby="title desc">
  <title>Capsule exploration and Playwright confirmation</title>
  <desc>A diagram showing Capsule exploration for investigation and Playwright system tests for confirmation, connected by a reviewed expectation.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b8b94"/>
    </marker>
    <style>
      .bg { fill: #0f0f12; }
      .surface { fill: #17171c; stroke: #2c2c35; stroke-width: 1.5; }
      .surface-alt { fill: #1c1c23; stroke: #2c2c35; stroke-width: 1.5; }
      .panel { fill: #202027; stroke: #2c2c35; stroke-width: 1.5; }
      .accent { fill: #38212a; stroke: #e67189; stroke-width: 1.5; }
      .accent-strong { fill: #442531; stroke: #ef9dab; stroke-width: 1.5; }
      .green { fill: #12311f; stroke: #86efac; stroke-width: 1.5; }
      .blue { fill: #16263a; stroke: #93c5fd; stroke-width: 1.5; }
      .amber { fill: #3f2a18; stroke: #fb923c; stroke-width: 1.5; }
      .box { rx: 18; ry: 18; filter: url(#shadow); }
      .noshadow { filter: none; }
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f4f4f5; }
      .subtitle { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #a1a1aa; }
      .label { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f4f4f5; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #f4f4f5; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #a1a1aa; }
      .tiny { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #a1a1aa; letter-spacing: .08em; text-transform: uppercase; }
      .mono { font: 600 14px 'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace; fill: #f4f4f5; }
      .code { font: 600 13px 'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace; fill: #f4f4f5; }
      .accent-text { fill: #ef9dab; }
      .line { stroke: #8b8b94; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-dash { stroke: #8b8b94; stroke-width: 2.2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
      .brace { stroke: #3b3b46; stroke-width: 2; fill: none; }
      .divider { stroke: #2c2c35; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="450" rx="24" ry="24"/>
  
  <text class="title" x="40" y="48">Capsule exploration and Playwright confirmation</text>
  <text class="subtitle" x="40" y="74">Investigate first. Keep accepted behavior as a repeatable test.</text><rect class="accent box" x="60" y="130" width="400" height="220" rx="18" ry="18"/>
<text class="label" x="80" y="158">Capsule</text>
<text class="small" x="80" y="184">Start the smallest useful system</text>
<text class="small" x="80" y="204">Act on the system</text>
<text class="small" x="80" y="224">Inspect evidence</text>
<text class="small" x="80" y="244">Try a repair</text>
<text class="small" x="80" y="264">Rerun the experiment</text><path class="line" d="M 170 265 L 240 265 L 240 200 L 310 200" marker-end="url(#arrow)"/><path class="line" d="M 310 200 L 310 295 L 170 295" marker-end="url(#arrow)"/><text class="tiny" x="260" y="380" text-anchor="middle">reviewed expectation</text><path class="line" d="M 460 240 L 620 240"/><rect class="blue box" x="640" y="130" width="400" height="220" rx="18" ry="18"/>
<text class="label" x="660" y="158">Playwright system test</text>
<text class="small" x="660" y="184">Record the accepted behavior</text>
<text class="small" x="660" y="204">Run in a fresh Sandbox</text>
<text class="small" x="660" y="224">Keep the check repeatable</text>
<text class="small" x="660" y="244">Use local runs and CI</text><rect class="surface-alt box" x="340" y="385" width="420" height="95" rx="18" ry="18"/>
<text class="label" x="360" y="413">Critical rule</text>
<text class="small" x="360" y="439">Observed behavior is not automatically accepted behavior.</text>
<text class="small" x="360" y="459">The requirement decides what should happen.</text>
</svg>