<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="731" viewBox="0 0 1120 731" role="img" aria-labelledby="f08-title f08-desc" font-family="Inter, Arial, sans-serif"><title id="f08-title">Teach the agent to operate&#8212;not to invent the verdict.</title><desc id="f08-desc">Load task-specific skills, use structured interfaces, then explain the retained results.</desc><defs><marker id="f08-a-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#8B8B94"/></marker><marker id="f08-a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#E67189"/></marker><marker id="f08-a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker><style>.s0{fill:none;stroke:#8B8B94;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.s1{fill:#17171C;stroke:#FFFFFF;stroke-opacity:0.13;stroke-width:1.5;}.s2{fill:#17171C;}.s3{fill:#F4F4F5;font-size:18;font-weight:575;}.s4{fill:#A1A1AA;font-size:15;}.s5{fill:#F4F4F5;font-size:14;}</style></defs><rect x="0" y="0" width="1120" height="731" rx="0" fill="#0F0F12"/><text x="44" y="35" font-size="13" font-weight="600" fill="#EF9DAB" letter-spacing="1.4">SUITES / BLACKBOX     08</text><text x="44" y="80" font-size="29" font-weight="600" fill="#F4F4F5">Teach the agent to operate&#8212;not to invent the verdict.</text><text x="44" y="111" font-size="16" fill="#A1A1AA">Load task-specific skills, use structured interfaces, then explain the retained results.</text><rect x="252" y="151" width="616" height="69" rx="18" fill="#17171C" stroke="#DB486F" stroke-opacity="0.42" stroke-width="1.5"/><svg x="272" y="171" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg><text x="309" y="190" font-size="19" font-weight="575" fill="#F4F4F5">&#8220;Use Blackbox to explain this checkout failure.&#8221;</text><path d="M560 220 V255" marker-end="url(#f08-a-neutral)" class="s0"/><rect x="422" y="259" width="276" height="49" rx="18" class="s1"/><svg x="438" y="272" width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="2" class="s2"/><circle cx="16" cy="12" r="2" class="s2"/><circle cx="9" cy="19" r="2" class="s2"/></svg><text x="479" y="290" font-size="17" font-weight="575" fill="#F4F4F5">Select relevant skills</text><path d="M560 308 V330 H202 V352" marker-end="url(#f08-a-neutral)" class="s0"/><path d="M560 330 V352" marker-end="url(#f08-a-neutral)" class="s0"/><path d="M560 330 H918 V352" marker-end="url(#f08-a-neutral)" class="s0"/><rect x="44" y="356" width="316" height="101" rx="18" class="s1"/><svg x="64" y="376" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg><text x="101" y="395" class="s3">Read the report</text><text x="66" y="428" class="s4">Capsule &#183; Playwright</text><rect x="402" y="356" width="316" height="101" rx="18" class="s1"/><svg x="422" y="376" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></svg><text x="459" y="395" class="s3">Query the evidence</text><text x="424" y="428" class="s4">structured results</text><rect x="760" y="356" width="316" height="101" rx="18" class="s1"/><svg x="780" y="376" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 3v7c0 4-5 8-8 10-3-2-8-6-8-10V5l8-3Z"/><path d="m7 12 3 3 7-7"/></svg><text x="817" y="395" class="s3">Explain the limits</text><text x="782" y="428" class="s4">evidence guidance</text><path d="M202 457 V480" class="s0"/><path d="M560 457 V480" class="s0"/><path d="M918 457 V480" class="s0"/><path d="M202 480 H918" class="s0"/><path d="M560 480 V502" marker-end="url(#f08-a-neutral)" class="s0"/><rect x="198" y="506" width="724" height="60" rx="18" fill="#202027" stroke="#FFFFFF" stroke-opacity="0.13" stroke-width="1.5"/><svg x="219" y="523" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 5 6-5 6M13 18h6"/></svg><text x="259" y="543" font-size="16" fill="#F4F4F5">CLI / Playwright / versioned artifacts &#8594; retained evidence and results</text><rect x="44" y="604" width="316" height="65" rx="18" class="s1"/><svg x="60" y="623" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 3v7c0 4-5 8-8 10-3-2-8-6-8-10V5l8-3Z"/><path d="m7 12 3 3 7-7"/></svg><text x="95" y="628" font-size="13" font-weight="575" fill="#93C5FD" letter-spacing="0.7">BLACKBOX CORE</text><text x="95" y="650" class="s5">Executes; records; checks.</text><rect x="402" y="604" width="316" height="65" rx="18" class="s1"/><svg x="418" y="623" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="4"/><path d="M12 3v4M1 12v5m22-5v5M9 16h6"/><circle cx="9" cy="12" r=".7"/><circle cx="15" cy="12" r=".7"/><circle cx="12" cy="2" r="1"/></svg><text x="453" y="628" font-size="13" font-weight="575" fill="#EF9DAB" letter-spacing="0.7">CODING AGENT</text><text x="453" y="650" class="s5">Interprets; proposes; repairs.</text><rect x="760" y="604" width="316" height="65" rx="18" class="s1"/><svg x="776" y="623" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg><text x="811" y="628" font-size="13" font-weight="575" fill="#A1A1AA" letter-spacing="0.7">DEVELOPER</text><text x="811" y="650" class="s5">Controls accepted behavior.</text><path d="M44 678 H1076" class="s0"/><text x="44" y="705" font-size="14" fill="#A1A1AA">Skills guide workflow. They do not grant permissions, replace evidence or authorize changing the accepted target.</text></svg>
