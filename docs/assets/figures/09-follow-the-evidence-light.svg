<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="f09-title f09-desc" font-family="Inter, Arial, sans-serif"><title id="f09-title">Follow a result back to the retained source.</title><desc id="f09-desc">Read enough to answer the question; do not load an entire run into the agent context.</desc><defs><marker id="f09-a-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#71717A"/></marker><marker id="f09-a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#C54164"/></marker><marker id="f09-a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#52525B"/></marker><style>.s0{fill:#F4F4F5;stroke:#18181B;stroke-opacity:0.13;stroke-width:1.5;}.s1{fill:#18181B;font-size:18;font-weight:575;}.s2{fill:#52525B;font-size:15;}.s3{fill:none;stroke:#C54164;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.s4{fill:#52525B;font-size:14;}</style></defs><rect x="0" y="0" width="1120" height="700" rx="0" fill="#FFFFFF"/><text x="44" y="35" font-size="13" font-weight="600" fill="#C54164" letter-spacing="1.4">SUITES / BLACKBOX     09</text><text x="44" y="80" font-size="29" font-weight="600" fill="#18181B">Follow a result back to the retained source.</text><text x="44" y="111" font-size="16" fill="#52525B">Read enough to answer the question; do not load an entire run into the agent context.</text><rect x="44" y="195" width="234" height="130" rx="18" class="s0"/><svg x="64" y="215" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg><text x="101" y="234" class="s1">Finding</text><text x="66" y="267" class="s2">Duplicate request</text><rect x="310" y="195" width="234" height="130" rx="18" class="s0"/><svg x="330" y="215" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 3v7c0 4-5 8-8 10-3-2-8-6-8-10V5l8-3Z"/><path d="m7 12 3 3 7-7"/></svg><text x="367" y="234" class="s1">Runtime check</text><text x="332" y="267" class="s2">exactly one &#8594; false</text><rect x="576" y="195" width="234" height="130" rx="18" class="s0"/><svg x="596" y="215" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v8h7m-7 0v8h12M11 8v8"/><circle cx="16" cy="12" r="3"/><circle cx="19" cy="20" r="2"/></svg><text x="633" y="234" class="s1">Witnesses</text><text x="598" y="267" class="s2">http_17 + http_18</text><rect x="842" y="195" width="234" height="130" rx="18" class="s0"/><svg x="862" y="215" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5m-5 4 2 2 5-5"/></svg><text x="899" y="234" class="s1">Artifact</text><text x="864" y="267" class="s2">attempt + schema</text><path d="M278 258 H304" marker-end="url(#f09-a-pink)" class="s3"/><path d="M544 258 H570" marker-end="url(#f09-a-pink)" class="s3"/><path d="M810 258 H836" marker-end="url(#f09-a-pink)" class="s3"/><rect x="44" y="389" width="398" height="142" rx="18" class="s0"/><svg x="64" y="409" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v13l-5 5H4V3Zm11 18v-5h5M8 8h8M8 12h5"/></svg><text x="101" y="428" font-size="19" font-weight="575" fill="#18181B">Agent note</text><text x="66" y="461" class="s2">&#8220;Inspect dispatch and retry handling.&#8221;</text><text x="66" y="483" class="s2">Authored interpretation, not a finding.</text><path d="M442 460 H693 V330" stroke-dasharray="5 6" marker-end="url(#f09-a-pink)" class="s3"/><text x="478" y="445" font-size="14" fill="#C54164">cites evidence</text><rect x="747" y="389" width="329" height="142" rx="18" class="s0"/><svg x="766" y="409" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg><text x="807" y="428" class="s1">Source inspection</text><text x="769" y="470" font-family="JetBrains Mono, Consolas, monospace" font-size="14" fill="#18181B">run / attempt / effect identity</text><text x="769" y="501" class="s4">digest + JSON pointer, when retained</text><rect x="44" y="568" width="1032" height="70" rx="18" fill="#EEEEF0" stroke="#18181B" stroke-opacity="0.13" stroke-width="1.5"/><svg x="65" y="590" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></svg><text x="105" y="598" font-size="17" fill="#18181B">Resolve identity &#8594; read schema version &#8594; query selected fields &#8594; inspect witnesses</text><text x="106" y="622" class="s4">Reports are projections. Their source records remain the authority.</text><path d="M44 647 H1076" fill="none" stroke="#71717A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="674" class="s4">A query or agent note can reference evidence. Neither silently becomes a canonical verification result.</text></svg>
