<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="345" viewBox="0 0 1024 345" role="img" aria-labelledby="title desc"><title id="title">Select a system boundary</title><desc id="desc">An agent-maintained YAML catalog offers full-system and subsystem boundaries. Select the smallest boundary that retains the behavior and evidence needed by the question.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#52525b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f4f4f5}.heading{font-size:22px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#a1a1aa}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;fill:#ef9dab}.box{fill:#17171c;stroke:#2b2b33;stroke-width:1.4}.accent{stroke:#ef9dab}.line{fill:none;stroke:#52525b;stroke-width:1.5;stroke-linejoin:round}</style></defs><rect width="1024" height="345" fill="#0f0f12"/><text x="24" y="34" class="heading">Select a system boundary</text><rect x="335" y="63" width="354" height="76" rx="14" class="box accent"/><text x="351" y="92" class="label">blackbox.config.yaml</text><text x="351" y="115" class="small">agent-maintained catalog</text><path d="M512 139V166H180V195" class="line" marker-end="url(#a)"/><path d="M512 166V195" class="line" marker-end="url(#a)"/><path d="M512 166H844V195" class="line" marker-end="url(#a)"/><rect x="44" y="204" width="272" height="80" rx="14" class="box"/><text x="60" y="233" class="label">Full system</text><text x="60" y="256" class="small">API / payments / orders / data</text><rect x="376" y="204" width="272" height="80" rx="14" class="box accent" stroke-dasharray="4 5"/><text x="392" y="233" class="label">Payments</text><text x="392" y="256" class="small">payment service / database</text><rect x="708" y="204" width="272" height="80" rx="14" class="box"/><text x="724" y="233" class="label">Orders</text><text x="724" y="256" class="small">order service / queue / data</text><text x="512" y="321" class="small" text-anchor="middle">Choose for the behavioral question.</text></svg>
