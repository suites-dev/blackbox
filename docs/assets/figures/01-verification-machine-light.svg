<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" viewBox="0 0 1120 790" role="img" aria-labelledby="f01-title f01-desc" font-family="Inter, Arial, sans-serif"><title id="f01-title">One verification machine. Two ways in.</title><desc id="f01-desc">Experiments and repeatable tests share configured systems and a runtime evidence model.</desc><defs><marker id="f01-a-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#71717A"/></marker><marker id="f01-a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#C54164"/></marker><marker id="f01-a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#175CD3"/></marker><style>.s0{fill:#F4F4F5;stroke:#DB486F;stroke-opacity:0.42;stroke-width:1.5;}.s1{fill:#18181B;font-size:19;font-weight:575;}.s2{fill:none;stroke:#71717A;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.s3{fill:#52525B;font-size:15;}.s4{fill:#F4F4F5;stroke:#18181B;stroke-opacity:0.13;stroke-width:1.5;}.s5{fill:none;stroke:#C54164;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}.s6{fill:#52525B;font-size:13;text-anchor:middle;}</style></defs><rect x="0" y="0" width="1120" height="790" rx="0" fill="#FFFFFF"/><text x="44" y="35" font-size="13" font-weight="600" fill="#C54164" letter-spacing="1.4">SUITES / BLACKBOX     01</text><text x="44" y="80" font-size="29" font-weight="600" fill="#18181B">One verification machine. Two ways in.</text><text x="44" y="111" font-size="16" fill="#52525B">Experiments and repeatable tests share configured systems and a runtime evidence model.</text><rect x="350" y="137" width="420" height="65" rx="18" class="s0"/><svg x="370" y="157" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C54164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="4"/><path d="M12 3v4M1 12v5m22-5v5M9 16h6"/><circle cx="9" cy="12" r=".7"/><circle cx="15" cy="12" r=".7"/><circle cx="12" cy="2" r="1"/></svg><text x="407" y="176" class="s1">Developer + coding agent</text><path d="M560 202 V219 H284 V242" marker-end="url(#f01-a-neutral)" class="s2"/><path d="M560 219 H836 V242" marker-end="url(#f01-a-neutral)" class="s2"/><rect x="112" y="246" width="344" height="95" rx="18" class="s0"/><svg x="132" y="266" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C54164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="6"/><path d="M12 6v12"/></svg><text x="169" y="285" class="s1">Capsule experiment</text><text x="134" y="318" class="s3">Run Activities. Inspect what happened.</text><rect x="664" y="246" width="344" height="95" rx="18" class="s4"/><svg x="684" y="266" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></svg><text x="721" y="285" class="s1">Native Playwright test</text><text x="686" y="318" class="s3">Run repeatable behavior checks.</text><path d="M284 341 V360 H560 V386" marker-end="url(#f01-a-neutral)" class="s2"/><path d="M836 341 V360 H560" class="s2"/><rect x="400" y="390" width="320" height="88" rx="18" class="s4"/><svg x="420" y="410" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5v9l-9 5-9-5V8l9-5ZM3 8l9 5 9-5M12 13v9M8 5l9 5"/></svg><text x="457" y="429" class="s1">Selected SUT</text><text x="422" y="462" class="s3">Application or subsystem</text><path d="M560 478 V497 H310 V521" marker-end="url(#f01-a-neutral)" class="s2"/><rect x="130" y="525" width="360" height="105" rx="18" class="s4"/><svg x="150" y="545" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v8h7m-7 0v8h12M11 8v8"/><circle cx="16" cy="12" r="3"/><circle cx="19" cy="20" r="2"/></svg><text x="187" y="564" class="s1">Runtime evidence</text><text x="152" y="597" class="s3">Supported observations, normalized</text><text x="152" y="619" class="s3">effects, identity and capture limitations.</text><path d="M490 577 H610" marker-end="url(#f01-a-pink)" class="s5"/><text x="550" y="558" class="s6">when checks</text><text x="550" y="604" class="s6">are requested</text><rect x="614" y="525" width="376" height="105" rx="18" class="s0"/><svg x="634" y="545" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C54164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 3v7c0 4-5 8-8 10-3-2-8-6-8-10V5l8-3Z"/><path d="m7 12 3 3 7-7"/></svg><text x="671" y="564" class="s1">Qualify + evaluate</text><text x="636" y="597" class="s3">Explicit checks &#8594; true / false / unknown.</text><text x="636" y="619" class="s3">No requested check &#8594; observations only.</text><path d="M990 577 H1046 V169 H774" stroke-dasharray="5 6" marker-end="url(#f01-a-pink)" class="s5"/><text x="1030" y="457" font-size="12" text-anchor="end" fill="#C54164" letter-spacing="1.2">RERUN</text><rect x="130" y="661" width="860" height="59" rx="18" class="s4"/><svg x="150" y="681" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h12a4 4 0 0 1 4 4M4 8l4-4M4 8l4 4m12 4H8a4 4 0 0 1-4-4m16 4-4-4m4 4-4 4"/></svg><text x="187" y="700" font-size="18" font-weight="575" fill="#18181B">Agent interprets and repairs &#183; Developer controls acceptance</text><path d="M44 737 H1076" class="s2"/><text x="44" y="764" font-size="14" fill="#52525B">The machine makes bounded claims verifiable. It does not prove whole-application correctness.</text></svg>
