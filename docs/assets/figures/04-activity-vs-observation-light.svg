<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="735" viewBox="0 0 1120 735" role="img" aria-labelledby="f04-title f04-desc" font-family="Inter, Arial, sans-serif"><title id="f04-title">Recorded action &#8800; observed runtime effect</title><desc id="f04-desc">An operation can be fully recorded even when its consequences are not observable.</desc><defs><marker id="f04-a-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#71717A"/></marker><marker id="f04-a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#C54164"/></marker><marker id="f04-a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 8 4-8 4Z" fill="#52525B"/></marker><style>.s0{fill:#52525B;font-size:13;font-weight:575;letter-spacing:0.9;}.s1{fill:#F4F4F5;stroke:#18181B;stroke-opacity:0.13;stroke-width:1.5;}.s2{fill:#C54164;font-size:13;font-weight:575;letter-spacing:0.8;}.s3{fill:#18181B;font-family:JetBrains Mono, Consolas, monospace;font-size:17;}.s4{fill:#18181B;font-size:18;font-weight:575;}.s5{fill:#52525B;font-size:14;}.s6{fill:#18181B;font-size:17;font-weight:575;}</style></defs><rect x="0" y="0" width="1120" height="735" rx="0" fill="#FFFFFF"/><text x="44" y="35" font-size="13" font-weight="600" fill="#C54164" letter-spacing="1.4">SUITES / BLACKBOX     04</text><text x="44" y="80" font-size="29" font-weight="600" fill="#18181B">Recorded action &#8800; observed runtime effect</text><text x="44" y="111" font-size="16" fill="#52525B">An operation can be fully recorded even when its consequences are not observable.</text><text x="60" y="167" class="s0">ACTIVITY / INTENT</text><text x="437" y="167" class="s0">RECORDED RESULT</text><text x="712" y="167" class="s0">RUNTIME OBSERVATION</text><rect x="44" y="187" width="355" height="111" rx="18" class="s1"/><rect x="421" y="187" width="253" height="111" rx="18" class="s1"/><rect x="696" y="187" width="380" height="111" rx="18" class="s1"/><svg x="62" y="207" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C54164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 6 5 6-5 6M13 18h6"/></svg><text x="100" y="218" class="s2">SETUP</text><text x="62" y="259" class="s3">psql &#8230; INSERT carts</text><text x="441" y="247" class="s4">exit 0</text><text x="716" y="221" font-size="18" font-weight="575" fill="#A43653">Unavailable</text><text x="716" y="249" class="s5">No supported SQL observer.</text><text x="716" y="270" class="s5">No INSERT effect is invented.</text><rect x="44" y="319" width="355" height="111" rx="18" class="s1"/><rect x="421" y="319" width="253" height="111" rx="18" class="s1"/><rect x="696" y="319" width="380" height="111" rx="18" class="s1"/><svg x="62" y="339" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C54164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18M5 6h14M5 18h14"/></svg><text x="100" y="350" class="s2">STIMULUS</text><text x="62" y="391" class="s3">POST /checkout</text><text x="441" y="379" class="s4">HTTP 201</text><text x="716" y="353" font-size="18" font-weight="575" fill="#18181B">5 observed effects</text><text x="716" y="381" class="s5">Two order requests; one insert,</text><text x="716" y="402" class="s5">one cache write, one queue send.</text><rect x="44" y="451" width="355" height="111" rx="18" class="s1"/><rect x="421" y="451" width="253" height="111" rx="18" class="s1"/><rect x="696" y="451" width="380" height="111" rx="18" class="s1"/><svg x="62" y="471" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C54164" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></svg><text x="100" y="482" class="s2">DIAGNOSTIC</text><text x="62" y="523" class="s3">node inspect-order.js</text><text x="441" y="511" class="s4">exit 0 + stdout</text><text x="716" y="485" font-size="18" font-weight="575" fill="#71717A">Not requested</text><text x="716" y="513" class="s5">&#8220;order exists&#8221; is command output,</text><text x="716" y="534" class="s5">not an independent state check.</text><rect x="44" y="591" width="502" height="84" rx="18" class="s1"/><svg x="64" y="613" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#52525B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><text x="104" y="619" class="s6">Observed list is empty</text><text x="65" y="651" class="s5">No matching observation in the stated scope.</text><rect x="574" y="591" width="502" height="84" rx="18" class="s1"/><svg x="594" y="613" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A43653" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 3-3 2-3 5m0 3h.01"/></svg><text x="634" y="619" class="s6">Observation is unavailable</text><text x="595" y="651" class="s5">The record cannot answer whether it happened.</text><path d="M44 682 H1076" fill="none" stroke="#71717A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="709" class="s5">Neither command text nor exit status creates effects. Absence claims require qualified observation, not just an empty list.</text></svg>
