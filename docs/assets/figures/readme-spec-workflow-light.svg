<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="344" viewBox="0 0 1024 344" role="img" aria-labelledby="title desc"><title id="title">Spec to execution</title><desc id="desc">Markdown or Spec Kit supplies intent. The agent drafts scenarios for review. Validated Features emit a Playwright suite, whose isolated executions produce evidence.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#71717a"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#18181b}.heading{font-size:22px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#52525b}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;fill:#c54164}.box{fill:#f4f4f5;stroke:#d4d4d8;stroke-width:1.4}.accent{stroke:#c54164}.line{fill:none;stroke:#71717a;stroke-width:1.5;stroke-linejoin:round}</style></defs><rect width="1024" height="344" fill="#ffffff"/><text x="24" y="34" class="heading">Spec to execution</text><path d="M28 76h232l22 22v108H28Z M260 76v22h22" class="box"/><text x="44" y="108" class="mono">requirement.md</text><text x="44" y="140" class="small">Markdown or Spec Kit</text><path d="M385 76h232l22 22v108H385Z M617 76v22h22" class="box"/><text x="401" y="108" class="mono">feature.feature</text><text x="401" y="140" class="small">Review the expected behavior</text><path d="M742 76h232l22 22v108H742Z M974 76v22h22" class="box"/><text x="758" y="108" class="mono">Playwright suite</text><text x="758" y="140" class="small">Native Blackbox fixture</text><path d="M292 141H375" class="line" marker-end="url(#a)"/><text x="333" y="121" class="small" text-anchor="middle">draft</text><path d="M649 141H732" class="line" marker-end="url(#a)"/><text x="690" y="121" class="small" text-anchor="middle">validate / emit</text><path d="M869 217V284H654" class="line" marker-end="url(#a)"/><text x="891" y="251" class="small">run</text><rect x="367" y="246" width="280" height="74" rx="14" class="box accent" stroke-dasharray="4 5"/><text x="383" y="275" class="label">Isolated run</text><text x="383" y="298" class="small">response / state / observations</text></svg>
