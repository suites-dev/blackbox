<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title>Specification workflow</title>
  <desc>A multi-stage workflow from requirement.md to feature.feature to an emitted Playwright suite, then to a test run that produces evidence and an HTML report.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="rgba(16,24,40,0.06)"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8394"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .surface { fill: #ffffff; stroke: #e4e7ec; stroke-width: 1.5; }
      .surface-alt { fill: #f8f8fb; stroke: #e4e7ec; stroke-width: 1.5; }
      .panel { fill: #f5f7fb; stroke: #e4e7ec; stroke-width: 1.5; }
      .accent { fill: #fdf2f6; stroke: #e67189; stroke-width: 1.5; }
      .accent-strong { fill: #fbe6ea; stroke: #db486f; stroke-width: 1.5; }
      .green { fill: #ecfdf3; stroke: #067647; stroke-width: 1.5; }
      .blue { fill: #eff4ff; stroke: #175cd3; stroke-width: 1.5; }
      .amber { fill: #fffaeb; stroke: #b54708; stroke-width: 1.5; }
      .box { rx: 18; ry: 18; filter: url(#shadow); }
      .noshadow { filter: none; }
      .title { font: 700 28px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #14151a; }
      .subtitle { font: 600 15px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #667085; }
      .label { font: 700 16px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #14151a; }
      .body { font: 500 15px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #14151a; }
      .small { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #667085; }
      .tiny { font: 600 12px Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #667085; letter-spacing: .08em; text-transform: uppercase; }
      .mono { font: 600 14px 'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace; fill: #14151a; }
      .code { font: 600 13px 'JetBrains Mono', 'SFMono-Regular', ui-monospace, monospace; fill: #14151a; }
      .accent-text { fill: #db486f; }
      .line { stroke: #7a8394; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .line-dash { stroke: #7a8394; stroke-width: 2.2; stroke-dasharray: 7 7; fill: none; marker-end: url(#arrow); }
      .brace { stroke: #d0d5dd; stroke-width: 2; fill: none; }
      .divider { stroke: #e4e7ec; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1180" height="620" rx="24" ry="24"/>
  
  <text class="title" x="40" y="48">Specification workflow</text>
  <text class="subtitle" x="40" y="74">From a requirement to a generated Playwright suite.</text><rect class="surface box" x="50" y="120" width="300" height="120" rx="18" ry="18"/>
<text class="label" x="70" y="148">1. requirement.md</text>
<text class="small" x="70" y="174">REQ-101: Create a subscription</text>
<text class="small" x="70" y="194">An eligible customer request</text>
<text class="small" x="70" y="214">returns 201 and stores one</text>
<text class="small" x="70" y="234">active subscription.</text><text class="code" x="55" y="285">$ blackbox feature create --spec=requirement.md</text><path class="line" d="M 350 180 L 412 180"/><rect class="accent box" x="420" y="120" width="300" height="180" rx="18" ry="18"/>
<text class="label" x="440" y="148">2. feature.feature</text>
<text class="small" x="440" y="174">@system:subscription-system</text>
<text class="small" x="440" y="194">Feature: Subscriptions</text>
<text class="small" x="440" y="214">Scenario: Alice subscribes</text>
<text class="small" x="440" y="234">When the client sends POST &quot;/subscriptions&quot;</text>
<text class="small" x="440" y="254">Then the response status is 201</text>
<text class="small" x="440" y="274">And one active subscription exists</text><text class="code" x="425" y="345">$ blackbox feature suite emit --file=feature.feature</text><path class="line" d="M 720 210 L 782 210"/><rect class="blue box" x="790" y="120" width="340" height="180" rx="18" ry="18"/>
<text class="label" x="810" y="148">3. emitted Playwright suite</text>
<text class="small" x="810" y="174">test.system('subscription-system', ... )</text>
<text class="small" x="810" y="194">system.sandbox('default', ... )</text>
<text class="small" x="810" y="214">suite.test('Alice subscribes', ... )</text>
<text class="small" x="810" y="234"></text>
<text class="small" x="810" y="254">assert response + state</text><text class="code" x="795" y="345">$ npx playwright test</text><rect class="green box" x="790" y="390" width="340" height="130" rx="18" ry="18"/>
<text class="label" x="810" y="418">4. evidence + report</text>
<text class="small" x="810" y="444">Fresh Sandbox</text>
<text class="small" x="810" y="464">Response and state checks</text>
<text class="small" x="810" y="484">Runtime observations</text>
<text class="small" x="810" y="504">Open the HTML report</text><path class="line" d="M 960 305 L 960 380"/><text class="code" x="795" y="552">$ npx playwright show-report</text>
</svg>