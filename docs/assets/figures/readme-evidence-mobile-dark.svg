<svg xmlns="http://www.w3.org/2000/svg" width="360" height="635" viewBox="0 0 360 635" role="img" aria-labelledby="title desc"><title id="title">Evidence from one run</title><desc id="desc">One test execution provides response evidence, explicit state reads, and supported runtime observations. They are separate sources, not sequential steps or interchangeable proof.</desc><defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#52525b"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#f4f4f5}.heading{font-size:22px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#a1a1aa}.mono{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;fill:#ef9dab}.box{fill:#17171c;stroke:#2b2b33;stroke-width:1.4}.accent{stroke:#ef9dab}.line{fill:none;stroke:#52525b;stroke-width:1.5;stroke-linejoin:round}</style></defs><rect width="360" height="635" fill="#0f0f12"/><text x="24" y="34" class="heading">Evidence from one run</text><rect x="28" y="63" width="304" height="74" rx="14" class="box accent"/><text x="44" y="92" class="label">One system test</text><text x="44" y="115" class="small">controlled execution</text><path d="M180 137V159H17V429" class="line"/><path d="M17 217H42" class="line" marker-end="url(#a)"/><rect x="50" y="183" width="256" height="74" rx="14" class="box"/><text x="66" y="212" class="label">Response</text><text x="66" y="235" class="small">what returned</text><path d="M306 217H343" class="line"/><path d="M17 323H42" class="line" marker-end="url(#a)"/><rect x="50" y="289" width="256" height="74" rx="14" class="box"/><text x="66" y="318" class="label">State read</text><text x="66" y="341" class="small">what persisted</text><path d="M306 323H343" class="line"/><path d="M17 429H42" class="line" marker-end="url(#a)"/><rect x="50" y="395" width="256" height="74" rx="14" class="box"/><text x="66" y="424" class="label">Observations</text><text x="66" y="447" class="small">what ran</text><path d="M306 429H343" class="line"/><path d="M343 217V502H180V525" class="line" marker-end="url(#a)"/><rect x="28" y="533" width="304" height="74" rx="14" class="box accent"/><text x="44" y="562" class="label">Behavioral check</text><text x="44" y="585" class="small">against the accepted expectation</text></svg>
