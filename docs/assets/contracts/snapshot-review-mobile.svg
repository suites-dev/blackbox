<svg xmlns="http://www.w3.org/2000/svg" width="420" height="733" viewBox="0 0 420 733" role="img" aria-labelledby="title desc">
<title id="title">Review captured effects before accepting them</title><desc id="desc">Effects snapshot review lifecycle: observations become a candidate, then a reviewer assesses it against accepted intent. An accepted baseline is compared with observations from a fresh execution. A verification result does not automatically update the baseline.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#858591" stroke-width="1.2"/></marker></defs>
<style>
:root{--bg:#0f0f12;--panel:#17171c;--ink:#f4f4f5;--muted:#b4b4c0;--line:#52525e;--accent:#ef9dab;--soft:#32232c}
@media(prefers-color-scheme:light){:root{--bg:#fff;--panel:#fafafa;--ink:#202027;--muted:#52525e;--line:#b4b4c0;--accent:#ad3659;--soft:#fff0f5}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}.outline{fill:none;stroke:var(--line);stroke-width:1.2}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.rose{fill:var(--accent)}.mono{font-family:Consolas,monospace}
.link{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.accent{fill:var(--soft);stroke:var(--accent);stroke-width:1.2}
</style><rect width="420" height="733" class="bg"/>
<text x="22" y="34" font-size="23" class="" font-weight="600">Capture is not acceptance.</text><text x="22" y="61" font-size="12" class="rose">SNAPSHOT REVIEW</text><rect x="22" y="88" width="376" height="82" rx="10" class="panel"/><text x="40" y="118" font-size="19" class="" font-weight="600">Capture</text><text x="40" y="144" font-size="15" class="muted">Observed interactions</text><path d="M210 178 V195" class="link"/><rect x="22" y="205" width="376" height="82" rx="10" class="panel"/><text x="40" y="235" font-size="19" class="" font-weight="600">Candidate</text><text x="40" y="261" font-size="15" class="muted">Proposed snapshot</text><path d="M210 295 V312" class="link"/><rect x="22" y="322" width="376" height="82" rx="10" class="panel"/><text x="40" y="352" font-size="19" class="" font-weight="600">Review</text><text x="40" y="378" font-size="15" class="muted">Against accepted intent</text><path d="M210 412 V429" class="link"/><rect x="22" y="439" width="376" height="82" rx="10" class="accent"/><text x="40" y="469" font-size="19" class="" font-weight="600">Baseline</text><text x="40" y="495" font-size="15" class="muted">Accepted expectation</text><path d="M210 529 V546" class="link"/><rect x="22" y="556" width="376" height="82" rx="10" class="panel"/><text x="40" y="586" font-size="19" class="" font-weight="600">Fresh run → compare</text><text x="40" y="612" font-size="15" class="muted">Differences are not approvals</text><text x="22" y="708" font-size="15" class="muted">Normal verification never accepts by itself.</text>
</svg>
