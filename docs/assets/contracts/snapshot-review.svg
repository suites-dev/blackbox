<svg xmlns="http://www.w3.org/2000/svg" width="960" height="325" viewBox="0 0 960 325" role="img" aria-labelledby="title desc">
<title id="title">Review captured effects before accepting them</title><desc id="desc">Effects snapshot review lifecycle: observations become a candidate, then a reviewer assesses it against accepted intent. An accepted baseline is compared with observations from a fresh execution. A verification result does not automatically update the baseline.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#858591" stroke-width="1.2"/></marker></defs>
<style>
:root{--bg:#0f0f12;--panel:#17171c;--ink:#f4f4f5;--muted:#b4b4c0;--line:#52525e;--accent:#ef9dab;--soft:#32232c}
@media(prefers-color-scheme:light){:root{--bg:#fff;--panel:#fafafa;--ink:#202027;--muted:#52525e;--line:#b4b4c0;--accent:#ad3659;--soft:#fff0f5}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}.outline{fill:none;stroke:var(--line);stroke-width:1.2}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.rose{fill:var(--accent)}.mono{font-family:Consolas,monospace}
.link{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.accent{fill:var(--soft);stroke:var(--accent);stroke-width:1.2}
</style><rect width="960" height="325" class="bg"/>
<text x="30" y="36" font-size="24" class="" font-weight="600">Capture is not acceptance.</text><text x="930" y="36" font-size="12" class="rose" text-anchor="end">SNAPSHOT REVIEW</text><rect x="30" y="78" width="193" height="80" rx="10" class="panel"/><text x="48" y="108" font-size="19" class="" font-weight="600">Capture</text><text x="48" y="134" font-size="15" class="muted">Observed interactions</text><path d="M231 117 H254" class="link"/><rect x="267" y="78" width="193" height="80" rx="10" class="panel"/><text x="285" y="108" font-size="19" class="" font-weight="600">Candidate</text><text x="285" y="134" font-size="15" class="muted">Proposed snapshot</text><path d="M468 117 H491" class="link"/><rect x="504" y="78" width="193" height="80" rx="10" class="panel"/><text x="522" y="108" font-size="19" class="" font-weight="600">Review</text><text x="522" y="134" font-size="15" class="muted">Against accepted intent</text><path d="M705 117 H728" class="link"/><rect x="741" y="78" width="189" height="80" rx="10" class="accent"/><text x="759" y="108" font-size="19" class="" font-weight="600">Baseline</text><text x="759" y="134" font-size="15" class="muted">Accepted expectation</text><path d="M835 166 V201" class="link"/><rect x="30" y="214" width="320" height="80" rx="10" class="panel"/><text x="48" y="244" font-size="19" class="" font-weight="600">Fresh execution</text><text x="48" y="270" font-size="15" class="muted">New observations; same scope</text><path d="M358 254 H728" class="link"/><text x="542" y="244" font-size="12" class="muted" text-anchor="middle">COMPARE, NOT UPDATE</text><rect x="741" y="214" width="189" height="80" rx="10" class="panel"/><text x="759" y="244" font-size="19" class="" font-weight="600">Result</text><text x="759" y="270" font-size="15" class="muted">Inspect differences</text>
</svg>
