<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
<title id="title">A durable behavioral contract</title><desc id="desc">An accepted specification informs reviewed scenarios and executable output and state checks. A planned accepted effects snapshot preserves selected runtime expectations, not every raw span. Fresh system execution through I/O supplies observations to compare; automatic capture does not imply automatic acceptance.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#858591" stroke-width="1.2"/></marker></defs>
<style>
:root{--bg:#0f0f12;--panel:#17171c;--ink:#f4f4f5;--muted:#b4b4c0;--line:#52525e;--accent:#ef9dab;--soft:#32232c}
@media(prefers-color-scheme:light){:root{--bg:#fff;--panel:#fafafa;--ink:#202027;--muted:#52525e;--line:#b4b4c0;--accent:#ad3659;--soft:#fff0f5}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}.outline{fill:none;stroke:var(--line);stroke-width:1.2}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.rose{fill:var(--accent)}.mono{font-family:Consolas,monospace}
.link{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.accent{fill:var(--soft);stroke:var(--accent);stroke-width:1.2}
</style><rect width="960" height="450" class="bg"/>
<text x="30" y="37" font-size="24" class="" font-weight="600">Keep the behavior, not the code shape.</text><text x="930" y="36" font-size="12" class="rose" text-anchor="end">EFFECTS BASELINE · PLANNED</text><rect x="30" y="76" width="238" height="80" rx="10" class="panel"/><text x="48" y="106" font-size="19" class="" font-weight="600">Accepted specification</text><text x="48" y="132" font-size="15" class="muted">Owned by you or SDD</text><path d="M278 116 H324" class="link"/><rect x="338" y="64" width="592" height="224" rx="10" class="outline"/><text x="358" y="91" font-size="12" class="muted" font-weight="600">ONE REVIEWED CONTRACT</text><rect x="358" y="112" width="256" height="80" rx="10" class="panel"/><text x="376" y="142" font-size="19" class="" font-weight="600">Scenarios</text><text x="376" y="168" font-size="15" class="muted">Feature · optional</text><rect x="634" y="112" width="276" height="80" rx="10" class="panel"/><text x="652" y="142" font-size="19" class="" font-weight="600">Executable checks</text><text x="652" y="168" font-size="15" class="muted">TypeScript · output + state</text><rect x="358" y="211" width="552" height="56" rx="10" class="accent"/><text x="376" y="245" font-size="18" class="" font-weight="600">Accepted effects snapshot</text><text x="890" y="245" font-size="14" class="muted" text-anchor="end">not raw spans</text><text x="30" y="204" font-size="17" class="">The same expectations</text><text x="30" y="230" font-size="17" class="muted">can check a different</text><text x="30" y="256" font-size="17" class="muted">implementation.</text><rect x="30" y="333" width="332" height="86" rx="10" class="panel"/><text x="48" y="363" font-size="19" class="" font-weight="600">Fresh system execution</text><text x="48" y="389" font-size="15" class="muted">Enter through I/O · real participants</text><path d="M370 376 H431" class="link"/><rect x="444" y="333" width="254" height="86" rx="10" class="panel"/><text x="462" y="363" font-size="19" class="" font-weight="600">Observed results</text><text x="462" y="389" font-size="15" class="muted">Output · state · effects</text><path d="M706 376 H746" class="link"/><rect x="759" y="333" width="171" height="86" rx="10" class="panel"/><text x="777" y="363" font-size="19" class="" font-weight="600">Compare</text><text x="777" y="389" font-size="15" class="muted">Report differences</text><path d="M844 296 V324" class="link"/>
</svg>
