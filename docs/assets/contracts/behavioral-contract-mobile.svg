<svg xmlns="http://www.w3.org/2000/svg" width="420" height="792" viewBox="0 0 420 792" role="img" aria-labelledby="title desc">
<title id="title">A durable behavioral contract</title><desc id="desc">An accepted specification informs reviewed scenarios and executable output and state checks. An accepted effects snapshot preserves selected runtime expectations, not every raw span. Fresh system execution through I/O supplies observations to compare; automatic capture does not imply automatic acceptance.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#858591" stroke-width="1.2"/></marker></defs>
<style>
:root{--bg:#0f0f12;--panel:#17171c;--ink:#f4f4f5;--muted:#b4b4c0;--line:#52525e;--accent:#ef9dab;--soft:#32232c}
@media(prefers-color-scheme:light){:root{--bg:#fff;--panel:#fafafa;--ink:#202027;--muted:#52525e;--line:#b4b4c0;--accent:#ad3659;--soft:#fff0f5}}
.bg{fill:var(--bg)}.panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}.outline{fill:none;stroke:var(--line);stroke-width:1.2}
text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}.muted{fill:var(--muted)}.rose{fill:var(--accent)}.mono{font-family:Consolas,monospace}
.link{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
.accent{fill:var(--soft);stroke:var(--accent);stroke-width:1.2}
</style><rect width="420" height="792" class="bg"/>
<text x="22" y="35" font-size="24" class="" font-weight="600">Keep the behavior.</text><text x="22" y="61" font-size="12" class="rose">EFFECTS BASELINE</text><rect x="22" y="87" width="376" height="80" rx="10" class="panel"/><text x="40" y="117" font-size="19" class="" font-weight="600">Accepted specification</text><text x="40" y="143" font-size="15" class="muted">Owned by you or SDD</text><path d="M210 176 V199" class="link"/><rect x="22" y="211" width="376" height="260" rx="10" class="outline"/><text x="40" y="239" font-size="12" class="muted" font-weight="600">ONE REVIEWED CONTRACT</text><text x="40" y="277" font-size="19" class="" font-weight="600">Scenarios</text><text x="40" y="302" font-size="15" class="muted">Feature · optional</text><text x="40" y="342" font-size="19" class="" font-weight="600">Executable checks</text><text x="40" y="367" font-size="15" class="muted">TypeScript · output + state</text><rect x="40" y="395" width="340" height="58" rx="10" class="accent"/><text x="56" y="420" font-size="17" class="" font-weight="600">Accepted effects snapshot</text><text x="56" y="442" font-size="14" class="muted">Not raw spans</text><path d="M210 479 V501" class="link"/><rect x="22" y="513" width="376" height="80" rx="10" class="panel"/><text x="40" y="543" font-size="19" class="" font-weight="600">Fresh system execution</text><text x="40" y="569" font-size="15" class="muted">Enter through I/O · real participants</text><path d="M210 601 V623" class="link"/><rect x="22" y="635" width="376" height="80" rx="10" class="panel"/><text x="40" y="665" font-size="19" class="" font-weight="600">Observe and compare</text><text x="40" y="691" font-size="15" class="muted">Output · state · effects</text><text x="22" y="752" font-size="16" class="muted">Same expectations. New implementation.</text>
</svg>
