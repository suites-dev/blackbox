<svg xmlns="http://www.w3.org/2000/svg" width="960" height="504" viewBox="0 0 960 504" role="img" aria-labelledby="title desc">
<title id="title">Agent onboarding</title><desc id="desc">The agent inspects a repository, discovers services and dependencies, derives system boundaries, then creates and validates Blackbox configuration.</desc>
