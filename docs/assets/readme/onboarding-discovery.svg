<svg xmlns="http://www.w3.org/2000/svg" width="960" height="414" viewBox="0 0 960 414" role="img" aria-labelledby="title desc">
<title id="title">Agent onboarding</title><desc id="desc">The agent starts with the accepted create-product.md specification and the repository. Blackbox skills guide discovery of the services and dependencies needed for the behavior. The agent selects product-service, PostgreSQL, and Redis as the real verification boundary, then prepares blackbox.config.yaml, native client definitions, and Playwright configuration. The Blackbox CLI validates the resulting catalog.</desc>
