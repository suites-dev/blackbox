<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="860" viewBox="0 0 1120 860" role="img" aria-labelledby="triangle-title triangle-desc">
  <title id="triangle-title">The specification governs reviewed scenarios and executable checks</title>
  <desc id="triangle-desc">At the top, product-cache.md holds the accepted intent: cached product details are served from cache, with a 200 response. Review preserves that intent in the optional product-cache.feature at the lower left. Its Product details Feature contains the rule Cached product details are served from cache and the scenario Return product details from cache, with Given, When, Then, and And steps. Generation preserves the hierarchy and step alignment in the native Playwright suite product-cache.spec.ts at the lower right. Given maps to Arrange with a cache-only product fixture, When maps to Act with a product-details request, and Then and And map to Assert with the response, returned product, and cache-read evidence. Execution checks behavior: evidence from the same run is evaluated against the specified claims. This evaluation does not revise the specification or automatically accept observed behavior. Native tests can also be authored directly; the Feature route is optional. The slowly moving dashed connectors stop when reduced motion is requested.</desc>
  <defs>
    <marker id="triangle-arrow-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#E67189"/></marker>
    <marker id="triangle-arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker>
  </defs>
  <style>
    text { font-family: Geist, Inter, Arial, sans-serif; }
    .panel { fill: #17171C; stroke: #FFFFFF; stroke-opacity: .13; stroke-width: 1.5; }
    .panel.accepted { stroke: #DB486F; stroke-opacity: .42; }
    .heading { fill: #F4F4F5; font-size: 22px; font-weight: 575; }
    .body { fill: #A1A1AA; font-size: 18px; }
    .filename { fill: #EF9DAB; font-family: Geist Mono, Consolas, monospace; font-size: 18px; }
    .preview { fill: #D4D4D8; font-size: 18px; }
    .step { fill: #A1A1AA; font-size: 17px; }
    .keyword { fill: #EF9DAB; font-weight: 575; }
    .annotation { fill: #A1A1AA; font-size: 16px; }
    .badge { fill: #EF9DAB; font-size: 13px; font-weight: 600; letter-spacing: .8px; }
    .relationship { fill: #F4F4F5; font-size: 19px; font-weight: 575; }
    .divider { stroke: #FFFFFF; stroke-opacity: .09; stroke-width: 1; }
    .flow, .arrow { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke-dasharray: 6 10; animation: triangle-flow 16s linear infinite; }
    @keyframes triangle-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect width="1120" height="860" fill="#0F0F12"/>

  <g id="accepted-specification">
    <rect x="344" y="24" width="432" height="248" rx="18" class="panel accepted"/>
    <svg x="364" y="44" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg>
    <text x="401" y="64" class="heading">Specification</text>
    <text x="752" y="62" class="badge" text-anchor="end">ACCEPTED INTENT</text>
    <text x="368" y="106" class="filename">product-cache.md</text>
    <text x="368" y="145" class="preview" style="font-weight:575"># Product details</text>
    <text x="368" y="177" class="body">Cached product details are served</text>
    <text x="368" y="202" class="body">from cache.</text>
    <text x="368" y="242" class="step" style="fill:#D4D4D8">200 response · product returned from cache</text>
  </g>

  <g id="review-preserves-intent">
    <path d="M422 280 L245 422" class="flow" stroke="#E67189"/>
    <path d="M245 422 L237 428" class="arrow" stroke="#E67189" marker-end="url(#triangle-arrow-pink)"/>
    <text x="192" y="332" class="relationship" text-anchor="middle" style="fill:#EF9DAB">Review</text>
    <text x="192" y="358" class="body" text-anchor="middle">preserves intent</text>
  </g>

  <g id="execution-checks-behavior">
    <path d="M883 428 L706 286" class="flow" stroke="#93C5FD"/>
    <path d="M706 286 L698 280" class="arrow" stroke="#93C5FD" marker-end="url(#triangle-arrow-blue)"/>
    <text x="928" y="320" class="relationship" text-anchor="middle" style="fill:#93C5FD">Execution</text>
    <text x="928" y="346" class="body" text-anchor="middle">checks behavior</text>
    <text x="928" y="378" class="annotation" text-anchor="middle">Evidence against claims</text>
  </g>

  <g id="optional-feature">
    <rect x="32" y="436" width="420" height="400" rx="18" class="panel"/>
    <svg x="52" y="456" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v13l-5 5H4V3Zm11 18v-5h5M8 8h8M8 12h5"/></svg>
    <text x="89" y="476" class="heading">Feature file</text>
    <text x="428" y="474" class="badge" text-anchor="end" style="fill:#A1A1AA">OPTIONAL</text>
    <text x="56" y="516" class="filename">product-cache.feature</text>
    <path d="M56 536 H428" class="divider"/>

    <text x="56" y="566" class="preview"><tspan class="keyword">Feature:</tspan> Product details</text>
    <path d="M59 578 V590 H65 M73 624 V636 H79" fill="none" stroke="#EF9DAB" stroke-opacity=".26" stroke-width="1.3" stroke-linecap="round"/>
    <text x="70" y="598" class="preview"><tspan class="keyword">Rule:</tspan> Cached product details</text>
    <text x="115" y="622" class="preview">are served from cache</text>
    <text x="84" y="654" class="preview"><tspan class="keyword">Scenario:</tspan> Return product details</text>
    <text x="168" y="678" class="preview">from cache</text>

    <path d="M71 701 V799" fill="none" stroke="#EF9DAB" stroke-opacity=".2" stroke-width="1.3"/>
    <text x="84" y="714" class="step"><tspan class="keyword">Given</tspan> the product is already cached</text>
    <text x="84" y="740" class="step"><tspan class="keyword">When</tspan> the client requests product details</text>
    <text x="84" y="766" class="step"><tspan class="keyword">Then</tspan> the response status is 200</text>
    <text x="84" y="792" class="step"><tspan class="keyword">And</tspan> the product is returned from cache</text>
  </g>

  <g id="generation-preserves-alignment">
    <text x="560" y="610" class="relationship" text-anchor="middle" style="fill:#EF9DAB">Generation</text>
    <text x="560" y="636" class="body" text-anchor="middle">preserves alignment</text>
    <path d="M460 665 H650" class="flow" stroke="#E67189"/>
    <path d="M650 665 H659" class="arrow" stroke="#E67189" marker-end="url(#triangle-arrow-pink)"/>
    <text x="560" y="696" class="annotation" text-anchor="middle">Same hierarchy + steps</text>
  </g>

  <g id="native-playwright-suite">
    <rect x="668" y="436" width="420" height="400" rx="18" class="panel"/>
    <svg x="688" y="456" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></svg>
    <text x="725" y="476" class="heading">Native Playwright suite</text>
    <text x="692" y="516" class="filename" style="fill:#93C5FD">product-cache.spec.ts</text>
    <path d="M692 536 H1064" class="divider"/>
    <text x="692" y="566" class="preview">Feature → Rule → Scenario</text>

    <text x="692" y="601" class="preview" style="fill:#93C5FD;font-weight:575">Given → Arrange</text>
    <text x="692" y="626" class="body">Seed a cache-only product</text>
    <text x="692" y="666" class="preview" style="fill:#93C5FD;font-weight:575">When → Act</text>
    <text x="692" y="691" class="body">Request product details</text>
    <text x="692" y="731" class="preview" style="fill:#93C5FD;font-weight:575">Then / And → Assert</text>
    <text x="692" y="756" class="step">200 · returned product · cache-read evidence</text>

    <path d="M692 775 H1064" class="divider"/>
    <svg x="692" y="794" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h3M8 16h3m2-2 2 2 4-4"/></svg>
    <text x="726" y="810" class="step">Evidence retained for this run</text>
  </g>
</svg>
