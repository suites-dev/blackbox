<title id="title">A specification, its Feature, and its executable suite</title><desc id="desc">The accepted create-product.md specification requires a product to be persisted in PostgreSQL and populated in Redis, then retrieved from its valid cache entry without a PostgreSQL read. Review preserves this intent in the optional product-cache.feature. Generation preserves Feature, Rule, Scenario and Arrange, Act, Assert in product-cache.generated.spec.ts. Arrange creates the product and checks its stored row and cached value. Act retrieves it. Assert checks the response plus Redis GET one and application-role PostgreSQL SELECT zero during that isolated retrieval. These are sample-owned Redis commandstats and PostgreSQL pg_stat_statements counters, not the default Blackbox effects evaluator. The Feature text is a semantic outline; runnable files use the supported HTTP vocabulary.</desc>
