<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1010" width="1040" height="1010" role="img" aria-labelledby="workflow-title workflow-desc">
<title id="workflow-title">Blackbox: from accepted specification to repeated system verification</title>
<desc id="workflow-desc">Three stages. Define: developer supplies the specification, coding agent drafts a reviewed Feature, developer accepts the expectations. Prepare and rehearse: agent chooses the smallest sufficient system boundary, reuses or configures its Catalog, and performs Capsule experiments whose HTML report describes what was observed. Verify: either compile supported Feature sentences deterministically to a generated Playwright suite that must not be hand edited, or use a proposed editable Playwright scaffold for project-specific SDK operations. Both routes lead to a fresh Playwright Sandbox, its test report, and implementation repair against unchanged accepted expectations. The scaffold and automatic Feature drafting are planned rather than shipped.</desc>
<defs><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#858595" stroke-width="1.6"/></marker></defs>
