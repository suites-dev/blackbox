<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1180" viewBox="0 0 1100 1180" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">From accepted specification to repeatable system verification</title><desc id="figure-desc">Three connected stages. Define: developer supplies a specification, an agent drafts behavioral examples, and the developer approves the expectations. Prepare: discover and configure the relevant real system, then optionally investigate unknown actions and observations in a Capsule with its own HTML report. A direct route skips investigation when the system and checks are known. Verify: compile supported Feature steps into unedited generated Playwright, or author native Playwright using project clients and assertions. A separate scaffold generator is planned. Both paths run through a fresh Sandbox, exercising I/O and checking outputs, state, and required operations. The Playwright HTML report guides implementation repair and rerunning the same expectations. This is the target workflow; availability is documented in the accompanying guide. Connectors move slowly; reduced motion keeps the complete diagram static.</desc>
<defs>
