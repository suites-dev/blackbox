<text x="40" y="48" font-family="Geist, Inter, Arial, sans-serif" font-size="27" font-weight="650" fill="#F4F4F5" text-anchor="start">One specification. One journey. Two ways to author tests.</text>
<text x="40" y="76" font-family="Geist, Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#A1A1AA" text-anchor="start">Human-approved behavior → agent investigation → repeatable system checks</text>
