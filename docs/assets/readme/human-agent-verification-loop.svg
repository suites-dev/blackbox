<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="584" viewBox="0 0 1120 584" role="img" aria-labelledby="loop-title loop-description">
  <title id="loop-title">Human-agent behavioral verification loop</title>
  <desc id="loop-description">A person approves the specification, expected outcomes, and verification policy. The coding agent implements or repairs the application and prepares its system or E2E suite. Playwright runs assertions and Blackbox retains runtime evidence and diagnostics tied to that attempt. Results guide investigation and repair. Proposed changes to human intent or policy return to the person, who decides. The two slowly moving dashed return paths stop when reduced motion is requested.</desc>
  <defs>
    <marker id="loop-arrow-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#8B8B94"/></marker>
    <marker id="loop-arrow-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#E67189"/></marker>
    <marker id="loop-arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker>
  </defs>
  <style>
    text { font-family: Geist, Inter, Arial, sans-serif; }
    .panel { fill: #17171C; stroke: #FFFFFF; stroke-opacity: .13; stroke-width: 1.5; }
    .panel.approved { stroke: #DB486F; stroke-opacity: .42; }
    .heading { fill: #F4F4F5; font-size: 20px; font-weight: 575; }
    .body { fill: #A1A1AA; font-size: 17px; }
    .role { fill: #8B8B94; font-size: 13px; font-weight: 600; letter-spacing: 1.1px; }
    .annotation { fill: #A1A1AA; font-size: 16px; }
    .flow-label { font-size: 18px; font-weight: 575; }
    .arrow, .flow { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke-dasharray: 6 10; animation: loop-flow 16s linear infinite; }
    @keyframes loop-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect width="1120" height="584" fill="#0F0F12"/>

  <g id="loop-human-intent">
    <rect x="44" y="28" width="336" height="196" rx="18" class="panel approved"/>
    <svg x="64" y="48" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>
    <text x="101" y="67" class="heading" data-max-width="255">Human intent</text>
    <text x="68" y="109" class="role" style="fill:#EF9DAB" data-max-width="288">PERSON APPROVED</text>
    <text x="68" y="151" class="body" data-max-width="288">Accepted specification + claims</text>
    <text x="68" y="178" class="body" data-max-width="288">+ analysis policy</text>
  </g>

  <g id="loop-coding-agent">
    <rect x="740" y="28" width="336" height="196" rx="18" class="panel"/>
    <svg x="760" y="48" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="7" width="16" height="14" rx="4"/><path d="M12 3v4M1 12v5m22-5v5M9 16h6"/><circle cx="9" cy="12" r=".7"/><circle cx="15" cy="12" r=".7"/><circle cx="12" cy="2" r="1"/></svg>
    <text x="797" y="67" class="heading" data-max-width="255">Coding agent</text>
    <text x="764" y="109" class="role" data-max-width="288">IMPLEMENT + TEST</text>
    <text x="764" y="151" class="body" data-max-width="288">implements or repairs</text>
  </g>

  <g id="loop-feedforward">
    <text x="560" y="71" class="flow-label" fill="#EF9DAB" text-anchor="middle" data-max-width="304">Accepted expectations</text>
    <path d="M384 92 H732" class="arrow" stroke="#E67189" marker-end="url(#loop-arrow-pink)"/>
  </g>

  <g id="loop-intent-change">
    <text x="560" y="148" class="annotation" text-anchor="middle" style="fill:#EF9DAB" data-max-width="320">Proposed intent or policy change</text>
    <path d="M736 170 H394" class="flow" stroke="#E67189"/>
    <path d="M394 170 H388" class="arrow" stroke="#E67189" marker-end="url(#loop-arrow-pink)"/>
    <text x="560" y="198" class="annotation" text-anchor="middle" data-max-width="320">the person decides</text>
  </g>

  <g id="loop-execution">
    <rect x="740" y="344" width="336" height="212" rx="18" class="panel"/>
    <svg x="760" y="364" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></svg>
    <text x="797" y="383" class="heading" data-max-width="255">System or E2E suite</text>
    <text x="764" y="425" class="role" style="fill:#93C5FD" data-max-width="288">EXECUTION</text>
    <text x="764" y="467" class="body" data-max-width="288">runs the application</text>
    <text x="764" y="494" class="body" data-max-width="288">and native assertions</text>
  </g>
  <path d="M908 228 V336" class="arrow" stroke="#8B8B94" marker-end="url(#loop-arrow-neutral)"/>

  <g id="loop-blackbox">
    <rect x="44" y="344" width="336" height="212" rx="18" class="panel"/>
    <svg x="64" y="364" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4v8h7m-7 0v8h12M11 8v8"/><circle cx="16" cy="12" r="3"/><circle cx="19" cy="20" r="2"/></svg>
    <text x="101" y="383" class="heading" data-max-width="255">Blackbox</text>
    <text x="68" y="425" class="heading" style="font-size:18px" data-max-width="288">Runtime retains evidence</text>
    <path d="M68 447 H356" class="arrow" stroke="#FFFFFF" stroke-opacity=".13"/>
    <text x="68" y="480" class="heading" style="font-size:18px" data-max-width="288">Assertions report results</text>
    <text x="68" y="515" class="annotation" data-max-width="288">results tied to this attempt</text>
  </g>
  <g id="loop-capture">
    <text x="560" y="425" class="annotation" text-anchor="middle" data-max-width="304">Fresh runtime evidence</text>
    <path d="M736 448 H388" class="arrow" stroke="#93C5FD" marker-end="url(#loop-arrow-blue)"/>
  </g>

  <g id="loop-feedback">
    <path d="M212 340 V292 Q212 276 228 276 H780 Q796 276 796 260 V238" class="flow" stroke="#93C5FD"/>
    <path d="M796 238 V232" class="arrow" stroke="#93C5FD" marker-end="url(#loop-arrow-blue)"/>
    <text x="504" y="254" class="flow-label" fill="#93C5FD" text-anchor="middle" data-max-width="420">Results + runtime evidence</text>
    <text x="504" y="305" class="annotation" text-anchor="middle" data-max-width="420">failure guides the next repair</text>
  </g>
</svg>
