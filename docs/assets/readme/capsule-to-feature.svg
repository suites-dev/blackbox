<svg x="212" y="306" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v13l-5 5H4V3Zm11 18v-5h5M8 8h8M8 12h5"/></svg>
<text x="250" y="314" fill="#F4F4F5" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="600">Candidate expectation</text>
<text x="250" y="337" fill="#A1A1AA" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="400">Hypothesis from observed behavior</text>
<path d="M480 352 V375" fill="none" stroke="#8B8B94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="192" y="377" width="576" height="64" rx="18" fill="#17171C" stroke="#E67189" stroke-opacity="0.42" stroke-width="1.5"/>
<svg x="212" y="395" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>
<text x="250" y="403" fill="#EF9DAB" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="600">Review and accept</text>
<text x="250" y="426" fill="#A1A1AA" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="400">Developer-controlled specification change</text>
<path d="M480 441 V464" fill="none" stroke="#E67189" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="192" y="466" width="576" height="64" rx="18" fill="#17171C" stroke="#8B8B94" stroke-opacity="0.44" stroke-width="1.5"/>
<svg x="212" y="484" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 3v7c0 4-5 8-8 10-3-2-8-6-8-10V5l8-3Z"/><path d="m7 12 3 3 7-7"/></svg>
<text x="250" y="492" fill="#F4F4F5" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="600">Accepted Feature</text>
<text x="250" y="515" fill="#A1A1AA" font-family="Geist, Inter, Arial, sans-serif" font-size="14" font-weight="400">Contract for repeatable verification</text>
<path d="M480 530 V547" fill="none" stroke="#8B8B94" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<svg x="347" y="562" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></svg>
<text x="385" y="581" fill="#86EFAC" font-family="Geist, Inter, Arial, sans-serif" font-size="18" font-weight="600">Playwright verification</text>
</svg>
