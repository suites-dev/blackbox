<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="912" viewBox="0 0 1120 912" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">From specification files to an execution report</title>
  <desc id="pipeline-desc">The agent drafts new-product.feature from create-new-product.md. The Feature contains Given, When, and Then steps. The developer reviews and accepts the Feature after static validation. The accepted Feature generates new-product.spec.ts. Playwright executes the product subsystem configured in product-subsystem.yaml: product-service connected to PostgreSQL and Redis. Blackbox evaluates the completed execution and its retained evidence. The illustrative successful Execution Report checks that required scenarios executed, runtime claims are supported, and evidence is linked to the run. Source document content is represented by blurred placeholder lines. CLI commands are shown without flags. The slowly moving dashed connectors stop when reduced motion is requested.</desc>
  <defs>
    <marker id="pipeline-arrow-neutral" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#8B8B94"/></marker>
    <marker id="pipeline-arrow-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#E67189"/></marker>
    <marker id="pipeline-arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker>
    <filter id="document-soften" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.3"/></filter>
  </defs>
  <style>
    text { font-family: Geist, Inter, Arial, sans-serif; }
    .panel { fill: #17171C; stroke: #FFFFFF; stroke-opacity: .13; stroke-width: 1.5; }
    .panel.accepted { stroke: #DB486F; stroke-opacity: .42; }
    .heading { fill: #F4F4F5; font-size: 20px; font-weight: 575; }
    .body { fill: #A1A1AA; font-size: 16px; }
    .filename { fill: #EF9DAB; font-family: Geist Mono, Consolas, monospace; font-size: 17px; }
    .command { fill: #F4F4F5; font-family: Geist Mono, Consolas, monospace; font-size: 16px; }
    .feature-step { fill: #A1A1AA; font-family: Geist Mono, Consolas, monospace; font-size: 17px; }
    .annotation { fill: #A1A1AA; font-size: 15px; }
    .number { fill: #8B8B94; font-size: 13px; font-weight: 600; letter-spacing: 1px; }
    .document-lines { fill: #8B8B94; opacity: .29; }
    .flow, .arrow { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke-dasharray: 6 10; animation: pipeline-flow 16s linear infinite; }
    .topology-node { fill: #202027; stroke: #8B8B94; stroke-opacity: .3; stroke-width: 1.3; }
    .topology-label { fill: #F4F4F5; font-size: 16px; font-weight: 575; }
    .report-line { fill: #F4F4F5; font-size: 17px; }
    @keyframes pipeline-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect width="1120" height="912" fill="#0F0F12"/>

  <g id="stage-specification" data-stage="1">
    <rect x="44" y="28" width="336" height="160" rx="18" class="panel"/>
    <svg x="64" y="48" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h8M8 16h8"/></svg>
    <text x="101" y="67" class="heading">create-new-product.md</text>
    <text x="354" y="68" class="number" text-anchor="end">01</text>
    <g class="document-lines" filter="url(#document-soften)" aria-hidden="true">
      <rect x="68" y="102" width="250" height="5" rx="2.5"/>
      <rect x="68" y="121" width="204" height="5" rx="2.5"/>
      <rect x="68" y="140" width="230" height="5" rx="2.5"/>
      <rect x="68" y="159" width="160" height="5" rx="2.5"/>
    </g>
  </g>
  <g id="handoff-draft" data-command="blackbox spec feature draft">
    <text x="560" y="94" class="command" text-anchor="middle">$ blackbox spec feature draft</text>
    <path d="M384 120 H726" class="flow" stroke="#8B8B94"/>
    <path d="M726 120 H732" class="arrow" stroke="#8B8B94" marker-end="url(#pipeline-arrow-neutral)"/>
    <text x="560" y="149" class="annotation" text-anchor="middle">Draft candidate expectations</text>
  </g>
  <g id="stage-draft" data-stage="2">
    <rect x="740" y="28" width="336" height="160" rx="18" class="panel"/>
    <svg x="760" y="48" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 3h16v13l-5 5H4V3Zm11 18v-5h5M8 8h8M8 12h5"/></svg>
    <text x="797" y="67" class="heading">new-product.feature</text>
    <text x="1050" y="68" class="number" text-anchor="end">02</text>
    <text x="764" y="111" class="feature-step">Given ..</text>
    <text x="764" y="137" class="feature-step">When ..</text>
    <text x="764" y="163" class="feature-step">Then ..</text>
  </g>
  <g id="handoff-review" data-command="blackbox feature validate">
    <path d="M908 192 V262" class="flow" stroke="#8B8B94"/>
    <path d="M908 298 V317" class="flow" stroke="#E67189"/>
    <path d="M908 317 V321" class="arrow" stroke="#E67189" marker-end="url(#pipeline-arrow-pink)"/>
    <text x="873" y="212" class="annotation" text-anchor="end">Static validation</text>
    <text x="873" y="237" class="command" text-anchor="end">$ blackbox feature validate</text>
    <svg x="896" y="270" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 22v-3a8 8 0 0 1 16 0v3"/></svg>
    <text x="873" y="290" class="body" text-anchor="end" style="fill:#EF9DAB;font-weight:575">Developer reviews and accepts</text>
  </g>
  <g id="stage-accepted" data-stage="3">
    <rect x="740" y="328" width="336" height="160" rx="18" class="panel accepted"/>
    <svg x="760" y="348" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 8 3v7c0 4-5 8-8 10-3-2-8-6-8-10V5l8-3Z"/><path d="m7 12 3 3 7-7"/></svg>
    <text x="797" y="367" class="heading">Accepted Feature</text>
    <text x="1050" y="368" class="number" text-anchor="end">03</text>
    <text x="764" y="411" class="filename">new-product.feature</text>
    <text x="764" y="453" class="body">Reviewed executable expectations</text>
  </g>
  <g id="handoff-compile" data-command="blackbox feature suite emit">
    <text x="560" y="394" class="command" text-anchor="middle">$ blackbox feature suite emit</text>
    <path d="M736 420 H394" class="flow" stroke="#E67189"/>
    <path d="M394 420 H388" class="arrow" stroke="#E67189" marker-end="url(#pipeline-arrow-pink)"/>
    <text x="560" y="449" class="annotation" text-anchor="middle">Compile the accepted Feature</text>
  </g>
  <g id="stage-suite" data-stage="4">
    <rect x="44" y="328" width="336" height="160" rx="18" class="panel"/>
    <svg x="64" y="348" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></svg>
    <text x="101" y="367" class="heading">Playwright suite</text>
    <text x="354" y="368" class="number" text-anchor="end">04</text>
    <text x="68" y="422" class="filename" style="fill:#93C5FD">new-product.spec.ts</text>
  </g>
  <g id="handoff-execute" data-command="npx playwright test">
    <path d="M212 492 V615" class="flow" stroke="#8B8B94"/>
    <path d="M212 615 V621" class="arrow" stroke="#8B8B94" marker-end="url(#pipeline-arrow-neutral)"/>
    <text x="248" y="545" class="command" text-anchor="start">$ npx playwright test</text>
    <text x="248" y="574" class="annotation">Execute each test attempt</text>
  </g>
  <g id="stage-execution-evidence" data-stage="5">
    <rect x="44" y="628" width="336" height="256" rx="18" class="panel"/>
    <svg x="64" y="648" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="2" width="8" height="6" rx="1"/><rect x="2" y="16" width="7" height="6" rx="1"/><rect x="15" y="16" width="7" height="6" rx="1"/><path d="M12 8v4H5.5v4M12 12h6.5v4"/></svg>
    <text x="101" y="667" class="heading">System topology</text>
    <text x="354" y="668" class="number" text-anchor="end">05</text>
    <text x="68" y="706" class="filename" style="fill:#93C5FD">product-subsystem.yaml</text>
    <g id="product-topology" aria-label="product-service connects to PostgreSQL and Redis">
      <rect x="128" y="730" width="168" height="44" rx="9" class="topology-node"/>
      <text x="212" y="758" text-anchor="middle" class="topology-label">product-service</text>
      <path d="M212 774 V790 H139 V800" class="arrow" stroke="#8B8B94" marker-end="url(#pipeline-arrow-neutral)"/>
      <path d="M212 790 H290 V800" class="arrow" stroke="#8B8B94" marker-end="url(#pipeline-arrow-neutral)"/>
      <rect x="78" y="806" width="122" height="52" rx="10" class="topology-node"/>
      <rect x="224" y="806" width="132" height="52" rx="10" class="topology-node"/>
      <svg x="96" y="820" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg>
      <text x="132" y="839" class="topology-label">PG</text>
      <svg x="238" y="820" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 17l9 4 9-4"/></svg>
      <text x="272" y="839" class="topology-label">Redis</text>
    </g>
  </g>
  <g id="handoff-verify" data-command="blackbox feature verify">
    <text x="560" y="747" class="command" text-anchor="middle">$ blackbox feature verify</text>
    <text x="560" y="776" class="annotation" text-anchor="middle">Evaluate completed run + evidence</text>
    <path d="M384 803 H726" class="flow" stroke="#93C5FD"/>
    <path d="M726 803 H732" class="arrow" stroke="#93C5FD" marker-end="url(#pipeline-arrow-blue)"/>
  </g>
  <g id="stage-execution-report" data-stage="6">
    <rect x="740" y="628" width="336" height="256" rx="18" class="panel"/>
    <svg x="760" y="648" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7l-5-5ZM14 2v6h5M8 12h3M8 16h3m2-2 2 2 4-4"/></svg>
    <text x="797" y="667" class="heading">Execution Report</text>
    <text x="1050" y="668" class="number" text-anchor="end">06</text>
    <circle cx="779" cy="714" r="11" fill="#86EFAC" fill-opacity=".08" stroke="#86EFAC" stroke-opacity=".4"/>
    <path d="m774 714 3.5 3.5 6.5-7" fill="none" stroke="#86EFAC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="801" y="720" class="report-line">Required scenarios executed</text>
    <circle cx="779" cy="770" r="11" fill="#86EFAC" fill-opacity=".08" stroke="#86EFAC" stroke-opacity=".4"/>
    <path d="m774 770 3.5 3.5 6.5-7" fill="none" stroke="#86EFAC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="801" y="776" class="report-line">Runtime claims supported</text>
    <circle cx="779" cy="826" r="11" fill="#86EFAC" fill-opacity=".08" stroke="#86EFAC" stroke-opacity=".4"/>
    <path d="m774 826 3.5 3.5 6.5-7" fill="none" stroke="#86EFAC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="801" y="832" class="report-line">Evidence linked to this run</text>
  </g>
</svg>
