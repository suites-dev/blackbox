ue"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></svg><text x="613" y="122" font-size="16" fill="#F4F4F5" font-weight="575" text-anchor="start">product-service</text><path d="M665 139 V160 H507 V179" class="line" stroke="#93C5FD" marker-end="url(#a-blue)"/><path d="M665 160 H823 V179" class="line" stroke="#EF9DAB" marker-end="url(#a-pink)"/><rect x="422" y="186" width="170" height="44" rx="10" fill="#202027" stroke="#3F3F46" stroke-width="1.3"/><svg x="436" y="196" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><text x="470" y="214" font-size="16" fill="#F4F4F5" font-weight="575" text-anchor="start">PostgreSQL</text><rect x="738" y="186" width="170" height="44" rx="10" fill="#202027" stroke="#3F3F46" stroke-width="1.3"/><svg x="752" y="196" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 17l9 4 9-4"/></svg><text x="786" y="214" font-size="16" fill="#F4F4F5" font-weight="575" text-anchor="start">Redis</text><text x="380" y="250" font-size="15" fill="#A1A1AA" font-weight="400" text-anchor="start" class="mono">blackbox.config.yaml</text><path d="M665 272 V304 H243 V328" class="flow" stroke="#8B8B94" marker-end="url(#a-soft)"/><text x="428" y="293" font-size="16" fill="#A1A1AA" font-weight="400" text-anchor="middle">Draft + review against accepted behavior</text><rect x="28" y="338" width="430" height="238" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/><svg x="48" y="357" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejo