<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Two authoring paths from an accepted specification</title><desc id="desc">Review connects accepted intent to either a Gherkin Feature or handwritten native tests. The Feature compiler emits native Playwright suites, and byte-level validation detects generated-file drift. Both paths use the same Sandbox, clients and reports.</desc>
