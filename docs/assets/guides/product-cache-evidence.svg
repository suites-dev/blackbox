<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="756" viewBox="0 0 1100 756" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">Verify the product rule through the running system’s interfaces</title><desc id="figure-desc">The Playwright test sends HTTP requests to product-service in an isolated Sandbox containing real PostgreSQL and Redis. The test process is outside that system boundary. Creation is checked by inspecting a committed row and cached value. For a prepared and calibrated cache-hit retrieval, both implementations return the same product. The expected implementation reads Redis and issues no PostgreSQL statements; a cache bypass reads Redis and PostgreSQL and fails the accepted rule. Counts are illustrative expected measurements within the sample’s isolated observation window, not a completed execution report.</desc>
<defs>
