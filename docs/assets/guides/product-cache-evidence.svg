<use href="#icon-terminal" x="438" y="146" width="26" height="26" style="color:#93C5FD" aria-hidden="true"/>
<text x="476" y="168" class="heading" >product-service</text>
<text x="438" y="209" class="body" >Runs application code</text>
</g>
<path d="M670 166 H718 V132 H754" class="flow" stroke="#93C5FD" marker-end="url(#arrow-blue)" />
<path d="M670 198 H718 V246 H754" class="flow" stroke="#EF9DAB" marker-end="url(#arrow-pink)" />
<g data-panel="postgres">
