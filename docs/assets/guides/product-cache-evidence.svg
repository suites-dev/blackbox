e-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 5 5L20 5"/></svg><text x="715" y="94" font-size="17" fill="#A1A1AA" font-weight="400" text-anchor="start">Stored row matches</text><svg x="681" y="150" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 5 5L20 5"/></svg><text x="715" y="169" font-size="17" fill="#A1A1AA" font-weight="400" text-anchor="start">Cached value matches</text><path d="M28 214 H972" stroke="#3F3F46" stroke-width="1"/><text x="28" y="249" font-size="14" fill="#A1A1AA" font-weight="575" text-anchor="start">2  RETRIEVE WHILE THE CACHE IS VALID</text><rect x="28" y="271" width="212" height="80" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/><text x="48" y="303" font-size="16" fill="#93C5FD" font-weight="575" text-anchor="start">GET /products/:id</text><text x="48" y="333" font-size="15" fill="#A1A1AA" font-weight="400" text-anchor="start">Retrieve the product</text><path d="M248 311 H274" class="flow" stroke="#93C5FD" marker-end="url(#a-blue)"/><rect x="282" y="271" width="194" height="80" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/><svg x="298" y="286" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></svg><text x="334" y="305" font-size="16" fill="#F4F4F5" font-weight="575" text-anchor="start">Product service</text><text x="301" y="333" font-size="15" fill="#A1A1AA" font-weight="400" text-anchor="start">Read the cache</text><path d="M484 311 H510" class="flow" stroke="#EF9DAB" marker-end="url(#a-pink)"/><rect x="518" y="271" width="200" height="80" rx="16" fill="#17171C" stroke="#EF9DAB" stroke-width="1.3"/><svg x="536" y="286" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 17l9 4 9-4"/></svg><text x="572" y="305" font-size="18" fill="#F4F4F5" font-weight="575" text-anchor="start">Redis</text><text x="538" y="333" font-size="16" fill="#86EFAC" font-weight="400" text-anchor="start">GET · 1 cache hit</text><path d="M726 311 H752" class="flow" stroke="#86EFAC" marker-end="url(#a-green)"/><rect x="760" y="271" width="212" height="80" rx="16" fill="#17171C" stroke="#86EFAC" stroke-width="1.3"/><svg x="779" y="284" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 5 5L20 5"/></svg><text x="815" y="304" font-size="18" fill="#F4F4F5" font-weight="575" text-anchor="start">HTTP 200</text><text x="780" y="333" font-size="16" fill="#A1A1AA" font-weight="400" text-anchor="start">Correct product JSON</text><path d="M379 359 V375" class="line" stroke="#8B8B94"/><rect x="282" y="383" width="436" height="46" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/><svg x="298" y="394" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><text x="334" y="413" font-size="17" fill="#86EFAC" font-weight="575" text-anchor="start">PostgreSQL SELECT · 0</text><svg x="678" y="394" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 5 5L20 5"/></svg><rect x="28" y="468" width="944" height="116" rx="16" fill="#17171C" stroke="#FF6B6B" stroke-width="1.3"/><text x="48" y="497" font-size="14" fill="#FF6B6B" font-weight="575" text-anchor="start">CACHE BYPASS</text><text x="951" y="497" font-size="17" fill="#FF6B6B" font-weight="575" text-anchor="end">Runtime assertion fails</text><text x="50" y="530" font-size="16" fill="#F4F4F5" font-weight="575" text-anchor="start">GET /products/:id</text><text x="50" y="558" font-size="15" fill="#A1A1AA" font-weight="400" text-anchor="start">Redis GET · 1</text><path d="M259 532 H312" class="flow" stroke="#FF6B6B" marker-end="url(#a-red)"/><svg x="334" y="518" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></svg><text x="370" y="537" font-size="17" fill="#F4F4F5" font-weight="575" text-anchor="start">PostgreSQL SELECT · 1</text><path d="M634 532 H687" class="flow" stroke="#FF6B6B" marker-end="url(#a-red)"/><text x="715" y="537" font-size="18" fill="#F4F4F5" font-weight="575" text-anchor="start">200 · same JSON</text><text x="28" y="619" font-size="15" fill="#A1A1AA" font-weight="400" text-anchor="start">Isolated retrieval counters: Redis GET and application-role PostgreSQL SELECT.</text>
</svg>
