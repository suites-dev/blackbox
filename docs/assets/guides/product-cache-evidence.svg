<text x="784" y="157" class="small" >Real database</text>
</g>
<g data-panel="redis">
<rect x="764" y="204" width="276" height="88" rx="14" class="panel" />
<use href="#icon-redis" x="784" y="223" width="26" height="26" style="color:#EF9DAB" aria-hidden="true"/>
<text x="824" y="245" class="heading" >Redis</text>
<text x="784" y="273" class="small" >Real cache</text>
</g>
<text x="396" y="292" class="small" >Actions and observations cross I/O interfaces.</text>
<text x="36" y="361" class="label" >01  CREATE · CHECK THE RESULTING STATE</text>
<g data-panel="creation">
<rect x="36" y="382" width="1028" height="88" rx="14" class="panel" />
<use href="#icon-browser" x="56" y="407" width="26" height="26" style="color:#86EFAC" aria-hidden="true"/>
<text x="96" y="421" class="body" >201 · product JSON</text>
<use href="#icon-pg" x="394" y="407" width="26" height="26" style="color:#86EFAC" aria-hidden="true"/>
<text x="434" y="421" class="body" >Committed row matches</text>
<use href="#icon-redis" x="734" y="407" width="26" height="26" style="color:#86EFAC" aria-hidden="true"/>
<text x="774" y="421" class="body" >Cached value matches</text>
</g>
<text x="36" y="514" class="label" >02  RETRIEVE · CHECK THE RESPONSE AND OPERATIONS</text>
<g data-panel="accepted">
<rect x="36" y="536" width="498" height="158" rx="14" class="panel" />
<use href="#icon-browser" x="56" y="556" width="26" height="26" style="color:#86EFAC" aria-hidden="true"/>
<text x="96" y="578" class="heading" >Valid cache hit</text>
<text x="56" y="614" class="body" >200 · expected product JSON</text>
<text x="56" y="650" class="body green" >Redis GET: 1</text>
<text x="290" y="650" class="body green" >PostgreSQL: 0</text>
<text x="56" y="676" class="small" >Rule holds in this observed retrieval</text>
</g>
<g data-panel="bypass">
<rect x="558" y="536" width="506" height="158" rx="14" class="panel" />
<use href="#icon-browser" x="578" y="556" width="26" height="26" style="color:#FF8F9B" aria-hidden="true"/>
<text x="618" y="578" class="heading" >Cache bypass</text>
<text x="578" y="614" class="body" >200 · same product JSON</text>
<text x="578" y="650" class="body" >Redis GET: 1</text>
<text x="806" y="650" class="body red" >PostgreSQL: 1</text>
<text x="578" y="676" class="small red" >Database read violates the rule</text>
</g>
<text x="36" y="730" class="small" >Illustrative counts · calibrated observer · one isolated retrieval · application PostgreSQL statements</text>
</svg>
