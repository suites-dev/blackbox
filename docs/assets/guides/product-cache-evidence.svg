<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="648" viewBox="0 0 1000 648" role="img" aria-labelledby="product-cache-evidence-title product-cache-evidence-desc">
  <title id="product-cache-evidence-title">A correct product response can still hide a cache bypass</title>
  <desc id="product-cache-evidence-desc">POST /products writes the product to PostgreSQL and populates Redis. The test checks the stored row and cached value. On the next GET, the valid implementation reads Redis once and returns HTTP 200 with the correct product JSON, while the application performs zero PostgreSQL SELECT calls during the observed retrieval. The faulty cache-bypass implementation returns the same status and JSON but consults Redis but ignores its cached value, making one Redis GET call and one PostgreSQL SELECT call, so the runtime assertion fails. Counts are measured in the isolated sample using Redis commandstats and PostgreSQL pg_stat_statements for the application role around the single retrieval. Test inspection reads and setup lie outside this boundary. These are explicit sample-owned counters, not a default Blackbox normalized-effects evaluator or proof from missing spans. Dashed connectors respect reduced motion.</desc>
  <defs><marker id="a-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#8B8B94"/></marker><marker id="a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#EF9DAB"/></marker><marker id="a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker><marker id="a-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#86EFAC"/></marker><marker id="a-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#FF6B6B"/></marker></defs>
  <style>
    text { font-family: Geist, Inter, Arial, sans-serif; }
    .mono { font-family: Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .line, .flow { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke-dasharray: 6 10; animation: flow 16s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect width="1000" height="648" fill="#0F0F12"/>
