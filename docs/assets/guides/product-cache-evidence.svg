<rect width="1100" height="756" fill="#0F0F12"/>
<rect x="372" y="30" width="692" height="286" rx="14" class="panel" style="fill:#121216;stroke:#5B6577;stroke-dasharray:6 7"/>
<text x="396" y="61" class="label blue" >REAL SYSTEM · ISOLATED SANDBOX</text>
<g data-panel="test">
<rect x="36" y="108" width="234" height="148" rx="14" class="panel" />
<use href="#icon-code" x="56" y="128" width="26" height="26" style="color:#93C5FD" aria-hidden="true"/>
<text x="94" y="150" class="heading" >Playwright test</text>
<text x="56" y="190" class="mono" >POST /products</text>
<text x="56" y="221" class="mono" >GET /products/:id</text>
</g>
<path d="M278 182 H408" class="flow" stroke="#93C5FD" marker-end="url(#arrow-blue)" />
<text x="340" y="158" class="label blue" text-anchor="middle">HTTP</text>
