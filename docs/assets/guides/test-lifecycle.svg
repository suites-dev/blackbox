<rect x="352" y="24" width="256" height="122" rx="16" class="panel"/><svg x="372" y="44" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6m8-12 6 6-6 6M14 3l-4 18"/></svg><text x="408" y="63" font-size="19" fill="#F4F4F5" font-weight="575">2  Ready clients</text><text x="374" y="98" font-size="17" fill="#93C5FD" font-weight="400">Create, then check readiness</text>
<rect x="672" y="24" width="256" height="122" rx="16" class="panel"/><svg x="692" y="44" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 5 5L20 6"/></svg><text x="728" y="63" font-size="19" fill="#F4F4F5" font-weight="575">3  Run the test</text><text x="694" y="98" font-size="17" fill="#93C5FD" font-weight="400">Per-test hooks</text><text x="694" y="124" font-size="17" fill="#A1A1AA" font-weight="400">and the test body</text>
<path d="M296 85 H344" class="flow" stroke="#EF9DAB" marker-end="url(#arrow-EF9DAB)"/>
<path d="M616 85 H664" class="flow" stroke="#EF9DAB" marker-end="url(#arrow-EF9DAB)"/>
<path d="M800 154 V199 H648 V230" class="flow" stroke="#EF9DAB" marker-end="url(#arrow-EF9DAB)"/>
<path d="M512 288 H440" class="flow" stroke="#EF9DAB" marker-end="url(#arrow-EF9DAB)"/>
<rect x="520" y="238" width="408" height="92" rx="16" class="panel"/><svg x="540" y="258" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7a9 9 0 0 0-15-2L2 8m0-6v6h6m-4 9a9 9 0 0 0 15 2l3-3m0 6v-6h-6"/></svg><text x="576" y="277" font-size="19" fill="#F4F4F5" font-weight="575">4  Dispose clients</text><text x="542" y="312" font-size="17" fill="#EF9DAB" font-weight="400">Reverse order · bounded cleanup</text>
<rect x="32" y="238" width="400" height="92" rx="16" class="panel"/><svg x="52" y="258" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4v10l-9 4-9-4V7Zm0 0 9 5 9-5M12 12v9"/></svg><text x="88" y="277" font-size="19" fill="#F4F4F5" font-weight="575">5  Release Sandbox</text><text x="54" y="312" font-size="17" fill="#93C5FD" font-weight="400">Finalize diagnostics · retain if enabled</text>
<text x="32" y="190" font-size="18" fill="#F4F4F5" font-weight="400">Every retry starts a fresh attempt.</text>
<text x="32" y="215" font-size="16" fill="#A1A1AA" font-weight="400">Failures still trigger cleanup; cleanup errors remain errors.</text>
</svg>
