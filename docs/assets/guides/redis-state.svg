<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="268" viewBox="0 0 1000 268" role="img" aria-labelledby="title desc">
<title id="title">Verify the cache miss transition</title>
<desc id="desc">The fixture resets Dora and the test verifies her tier key is absent. The API subscribes Dora. The test checks a pro response, a pro cache value, and a positive remaining expiry no greater than five minutes.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker></defs>
<style>
text { font-family: Geist, Inter, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.flow { fill: none; stroke: #93C5FD; stroke-width: 1.5; stroke-dasharray: 6 10; animation: flow 16s linear infinite; }
@keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
@media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
<rect width="1000" height="268" fill="#0F0F12"/>
<rect x="24" y="24" width="296" height="220" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/>
<svg x="44" y="44" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4ZM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
<text x="80" y="61" font-size="15" font-weight="550" fill="#F4F4F5">Given · Redis client</text>
<path d="M44 86H300" stroke="#303038"/>
<text x="44" y="118" font-size="17" fill="#EF9DAB" font-weight="550">Tier key is absent</text>
<text x="44" y="151" font-size="14" fill="#D4D4D8" class="mono">user:dora:tier</text>
<text x="44" y="178" font-size="14" fill="#D4D4D8" class="mono">GET → null</text>
<text x="44" y="205" font-size="14" fill="#D4D4D8" class="mono">Fresh subscription fixture</text>
<rect x="352" y="24" width="296" height="220" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/>
<svg x="372" y="44" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F4F4F5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></svg>
<text x="408" y="61" font-size="15" font-weight="550" fill="#F4F4F5">When · public-api</text>
<path d="M372 86H628" stroke="#303038"/>
<text x="372" y="118" font-size="17" fill="#F4F4F5" font-weight="550">POST /subscriptions</text>
<text x="372" y="151" font-size="14" fill="#D4D4D8" class="mono">userId = dora</text>
<text x="372" y="178" font-size="14" fill="#D4D4D8" class="mono">HTTP 201</text>
<text x="372" y="205" font-size="14" fill="#D4D4D8" class="mono">response.tier = pro</text>
<rect x="680" y="24" width="296" height="220" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/>
<svg x="700" y="44" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4ZM3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
<text x="736" y="61" font-size="15" font-weight="550" fill="#F4F4F5">Then · Redis client</text>
<path d="M700 86H956" stroke="#303038"/>
<text x="700" y="118" font-size="17" fill="#93C5FD" font-weight="550">Tier key has an expiry</text>
<text x="700" y="151" font-size="14" fill="#D4D4D8" class="mono">GET → pro</text>
<text x="700" y="178" font-size="14" fill="#D4D4D8" class="mono">0 &lt; PTTL ≤ 300000 ms</text>
<text x="700" y="205" font-size="14" fill="#D4D4D8" class="mono">Same key, after the request</text>
<path d="M325 134H347" class="flow" marker-end="url(#arrow)"/>
<path d="M653 134H675" class="flow" marker-end="url(#arrow)"/>
</svg>
