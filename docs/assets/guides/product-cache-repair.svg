<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="588" viewBox="0 0 1000 588" role="img" aria-labelledby="product-cache-repair-title product-cache-repair-desc">
  <title id="product-cache-repair-title">Repair cache behavior while keeping accepted expectations fixed</title>
  <desc id="product-cache-repair-desc">The developer accepts create-product.md. The coding agent runs the reviewed scenario in an isolated Blackbox Sandbox. The cache-bypass attempt returns the correct HTTP 200 response and product JSON but its sample-owned runtime counters show Redis GET one and application-role PostgreSQL SELECT one: the service consults Redis but ignores the cached value, failing the accepted cache-hit requirement. The agent repairs the implementation to restore the cache-hit path and reruns the same accepted assertions in a new attempt. The repaired attempt returns the correct response with Redis GET one and PostgreSQL SELECT zero. The requirement and assertions stay unchanged. Counters are explicit Redis commandstats and PostgreSQL pg_stat_statements measurements around one isolated retrieval, not automatic normalized effects. Failed and repaired evidence belong to separate attempts. Dashed connectors stop for reduced motion.</desc>
  <defs><marker id="a-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#8B8B94"/></marker><marker id="a-pink" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#EF9DAB"/></marker><marker id="a-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#93C5FD"/></marker><marker id="a-green" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#86EFAC"/></marker><marker id="a-red" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="m0 0 8 4-8 4Z" fill="#FF6B6B"/></marker></defs>
  <style>
    text { font-family: Geist, Inter, Arial, sans-serif; }
    .mono { font-family: Geist Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .line, .flow { fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .flow { stroke-dasharray: 6 10; animation: flow 16s linear infinite; }
    @keyframes flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -128; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; stroke-dashoffset: 0; } }
  </style>
  <rect width="1000" height="588" fill="#0F0F12"/>
