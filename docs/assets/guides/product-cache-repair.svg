x="16" fill="#17171C" stroke="#FF6B6B" stroke-width="1.3"/><svg x="704" y="48" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6B6B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg><text x="740" y="67" font-size="17" fill="#F4F4F5" font-weight="575" text-anchor="start">Failed runtime check</text><text x="706" y="109" font-size="17" fill="#F4F4F5" font-weight="400" text-anchor="start" class="mono">Redis GET           1</text><text x="706" y="141" font-size="17" fill="#F4F4F5" font-weight="400" text-anchor="start" class="mono">PostgreSQL SELECT   1</text><text x="706" y="178" font-size="15" fill="#A1A1AA" font-weight="400" text-anchor="start">200 + correct JSON still pass</text><path d="M828 210 V326" class="flow" stroke="#FF6B6B" marker-end="url(#a-red)"/><text x="803" y="268" font-size="16" fill="#FF6B6B" font-weight="400" text-anchor="end">Investigate</text><rect x="28" y="238" width="608" height="62" rx="12" fill="#202027" stroke="#3F3F46" stroke-width="1.3"/><svg x="48" y="257" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="12" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4M12 15v3"/></svg><text x="84" y="277" font-size="17" fill="#EF9DAB" font-weight="575" text-anchor="start">Accepted specification + assertions stay unchanged</text><rect x="684" y="334" width="288" height="162" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/><svg x="704" y="354" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EF9DAB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 5 5 5m-9 0-7 7a3 3 0 0 0 4 4l7-7M14 3a7 7 0 0 0-4 7l4 4a7 7 0 0 0 7-4l-5 1-3-3 1-5Z"/></svg><text x="740" y="373" font-size="17" fill="#F4F4F5" font-weight="575" text-anchor="start">Agent repairs the code</text><text x="706" y="415" font-size="16" fill="#F4F4F5" font-weight="400" text-anchor="start">Return the cached product.</text><text x="706" y="452" font-size="16" fill="#A1A1AA" font-weight="400" text-anchor="start">Run the updated application.</text><text x="706" y="478" font-size="15" fill="#A1A1AA" font-weight="400" text-anchor="start">Keep the accepted expectations.</text><path d="M676 413 H644" class="flow" stroke="#93C5FD" marker-end="url(#a-blue)"/><rect x="356" y="334" width="280" height="162" rx="16" fill="#17171C" stroke="#3F3F46" stroke-width="1.3"/><svg x="376" y="354" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#93C5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7a9 9 0 1 0 1 9M20 2v6h-6"/></svg><text x="412" y="373" font-size="17" fill="#F4F4F5" font-weight="575" text-anchor="start">Rerun the same test</text><text x="378" y="415" font-size="16" fill="#F4F4F5" font-weight="400" text-anchor="start">New isolated attempt</text><text x="378" y="452" font-size="16" fill="#A1A1AA" font-weight="400" text-anchor="start">Same product requirement</text><text x="378" y="478" font-size="16" fill="#A1A1AA" font-weight="400" text-anchor="start">Same assertions</text><path d="M348 413 H316" class="flow" stroke="#86EFAC" marker-end="url(#a-green)"/><rect x="28" y="334" width="280" height="162" rx="16" fill="#17171C" stroke="#86EFAC" stroke-width="1.3"/><svg x="48" y="354" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#86EFAC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 5 5L20 5"/></svg><text x="84" y="373" font-size="17" fill="#F4F4F5" font-weight="575" text-anchor="start">Required behavior passes</text><text x="50" y="415" font-size="17" fill="#F4F4F5" font-weight="400" text-anchor="start" class="mono">Redis GET           1</text><text x="50" y="447" font-size="17" fill="#F4F4F5" font-weight="400" text-anchor="start" class="mo