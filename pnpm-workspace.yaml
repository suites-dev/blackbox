packages:
  - 'packages/*'
  - '!packages/*/dist'

catalog:
  # TypeScript
  typescript: ~5.7.3

  # Node types
  '@types/node': ^22.13.0

  # ESLint (Flat Config)
  eslint: ^9.19.0
  '@eslint/js': ^9.19.0
  typescript-eslint: ^8.22.0
  eslint-config-prettier: ^10.0.1
  eslint-plugin-import-x: ^4.6.1
  eslint-plugin-unicorn: ^57.0.0
  globals: ^15.14.0

  # Code quality
  prettier: ^3.4.2
  rimraf: ^6.0.1

  # Repository hooks
  husky: ^9.1.7
  lint-staged: ^15.5.2
  '@commitlint/cli': ^19.8.1
  '@commitlint/config-conventional': ^21.2.3

  # Unit testing
  vitest: 5.0.1

  # Sandbox runtime
  testcontainers: 12.0.4
