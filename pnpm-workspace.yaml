  typescript: ~5.7.3

  # Node types
  '@types/node': ^22.13.0

  # ESLint (Flat Config)
  eslint: ^10.11.0
  '@eslint/js': ^9.19.0
  typescript-eslint: ^8.70.1
  eslint-config-prettier: ^10.0.1
  eslint-plugin-import-x: ^4.17.1
  eslint-plugin-unicorn: ^76.0.0
  globals: ^15.14.0

  # Code quality
  prettier: ^3.4.2

  # Repository hooks
  husky: ^9.1.7
  lint-staged: ^15.5.2
  '@commitlint/cli': ^19.8.1
  '@commitlint/config-conventional': ^19.8.1

  # Unit testing
  vitest: 3.2.6

  # Sandbox runtime
  testcontainers: ^10.18.0
