schemaVersion: 1
catalog:
  default: api
  entries:
    api:
      kind: system
      acquisition: { adapter: docker-compose@1, files: [.blackbox/compose/api.yml] }
      isolation: per-test
      entrypoint:
        participant: api
        protocol: http
        containerPort: 8080
        readiness: { path: /health, timeoutMs: 30000 }
      participants:
        api: { service: api, role: entrypoint, runtime: node, activation: node-runtime }
      drivers: {}
      observation: &shared-observation
        policyId: shared-v1
        boundaries: [{ id: effects.http, kind: http, authoritativeFor: [HTTP effects] }]
        requiredBoundaries: [effects.http]
        terminalObservationWindowMs: 500
        redaction:
          requestBodies: not-captured
          headers: [authorization]
          dynamicIdentifiers: normalized
    worker:
      kind: subsystem
      acquisition: { adapter: docker-compose@1, files: [.blackbox/compose/worker.yml] }
      isolation: per-test
      entrypoint:
        participant: worker
        protocol: http
        containerPort: 8081
        readiness: { path: /health, timeoutMs: 30000 }
      participants:
        worker: { service: worker, role: entrypoint, runtime: node, activation: node-runtime }
      drivers: {}
      observation: *shared-observation
activations:
  node-runtime:
    ref: .blackbox/instrumentation/bootstrap.mjs
    adapter: node-factory
    version: 1
