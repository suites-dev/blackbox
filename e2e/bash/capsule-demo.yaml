# Screen-recording storyboard for the Phase 1 Capsule journey.
# Commands are intentionally the public CLI surface. The player pauses before
# each step so the presenter can explain what the audience is seeing.
# CI runs the same storyboard (capsule-player.sh --no-pause --no-browser) so it
# stays in step with the CLI.
title: Blackbox Capsule discovery demo
steps:
  - id: driver-install
    explanation: Prepare the project-owned Node driver directory; protocol clients remain user-owned.
    kind: cli
    command: driver install --runtime node --json
  - id: instrumentation-install
    explanation: Install the standalone Node instrumentation bundle and dependencies.
    kind: cli
    command: inst install --runtime node
  - id: instrumentation-repeat
    explanation: Repeat the same install; an existing installation stays unchanged.
    kind: cli
    command: inst install --runtime node
  - id: catalog-validate
    explanation: Ask Blackbox to validate the catalog and every referenced file.
    kind: cli
    command: catalog validate --json
  - id: systems
    explanation: List the systems that can be started.
    kind: cli
    command: systems
  - id: serve
    explanation: Open flight control before startup; leave it visible while the remaining commands run.
    kind: serve
    command: open
  - id: start
    explanation: Start one Capsule. It becomes the current capsule, so later commands need no ID.
    kind: cli
    command: up subscription-system --title "Recorded Capsule demo" --description "Explore subscription activation" --env FIXTURE_CONTROL_TOKEN=${FIXTURE_CONTROL_TOKEN} --json
  - id: list
    explanation: List running capsules; the star marks the current one.
    kind: cli
    command: ls
  - id: health
    explanation: Run user-owned curl directly on the host, in the current capsule, and record it as inspection.
    kind: cli
    command: run --name "Check readiness" --purpose inspection -- curl --fail --silent --show-error ${ENTRYPOINT_URL}/health
  - id: fixture-reset
    explanation: Establish the known initial fixture state before the stimulus.
    kind: cli
    command: >-
      run
      --name "Reset fixture state"
      --purpose setup
      -- curl --fail --silent --show-error
      --request POST
      --header "Authorization: Bearer ${FIXTURE_CONTROL_TOKEN}"
      --header "Content-Type: application/json"
      --data '{"profile":"fresh"}'
      ${ENTRYPOINT_URL}/fixture/reset
  - id: http-driver
    explanation: Pass a normal curl command through the HTTP driver, which adds endpoint and W3C context.
    kind: cli
    command: >-
      run
      --name "Create Alice subscription"
      --via public-api
      --purpose stimulus
      --json
      -- curl --fail --silent --show-error
      --request POST
      --header "Content-Type: application/json"
      --data '{"userId":"alice","paymentMethodId":"pm_capsule_alice"}'
      /subscriptions
  - id: show-capsule
    explanation: Show the capsule, its activities and the traces retained so far.
    kind: cli
    command: show ${SESSION_ID}
  - id: observations-activity
    explanation: Show the traced HTTP driver activity and the trace it owns.
    kind: cli
    command: show ${DRIVER_ACTIVITY_ID} --capsule ${SESSION_ID} --json
  - id: show-trace
    explanation: Show one exact W3C trace from the Capsule collector.
    kind: cli
    command: show ${TRACE_ID} --capsule ${SESSION_ID}
  - id: postgres-driver
    explanation: Run the unchanged psql command where the catalog says the client is available.
    kind: cli
    command: >-
      run
      --name "Inspect Alice subscription"
      --via postgres
      --purpose inspection
      -- psql --username fixture --dbname subscriptions
      --tuples-only --no-align
      --command "SELECT user_id || '|' || status FROM subscriptions WHERE user_id = 'alice';"
  - id: report-json
    explanation: Export the running experiment to JSON on stdout; flight control remains open.
    kind: cli
    command: report ${SESSION_ID} --format json --output -
  - id: report-running
    explanation: Write the HTML and JSON reports to their automatic paths while the Capsule is running.
    kind: cli
    command: report ${SESSION_ID}
  - id: stop
    explanation: Release the Capsule's resources; its history stays visible in flight control.
    kind: cli
    command: down ${SESSION_ID}
  - id: report-stopped-json
    explanation: Export the stopped Capsule to stdout and inspect the actual cleanup result.
    kind: cli
    command: report ${SESSION_ID} --format json --output -
  - id: report-html
    explanation: Generate the final portable HTML after teardown.
    kind: cli
    command: report ${SESSION_ID} --format html
  - id: serve-exact
    explanation: Reopen flight control directly on this exact retained experiment; no containers are started.
    kind: serve
    command: open ${SESSION_ID}
