# Screen-recording storyboard for the Phase 1 Capsule journey.
# Commands are intentionally the public CLI surface. The player pauses before
# each step so the presenter can explain what the audience is seeing.
title: Blackbox Capsule discovery demo
steps:
  - id: driver-install
    explanation: Prepare the project-owned Node driver directory; protocol clients remain user-owned.
    kind: cli
    command: driver install --runtime node --json
  - id: instrumentation-install
    explanation: Install the standalone Node instrumentation bundle and dependencies.
    kind: cli
    command: inst install --runtime node
  - id: instrumentation-repeat
    explanation: Repeat the same install; an existing installation stays unchanged.
    kind: cli
    command: inst install --runtime node
  - id: catalog-validate
    explanation: Ask Blackbox to validate the catalog and every referenced file.
    kind: cli
    command: catalog validate --json
  - id: catalog-list
    explanation: List the systems that can be acquired, in machine-readable form.
    kind: cli
    command: catalog list --json
  - id: serve
    explanation: Open flight control before startup; leave it visible while the remaining commands run.
    kind: serve
    command: capsule report serve --open
  - id: start
    explanation: Acquire one named Capsule and retain its exact session identity.
    kind: cli
    command: capsule start --system subscription-system --title "Recorded Capsule demo" --description "Explore subscription activation" --env FIXTURE_CONTROL_TOKEN=capsule-e2e-token --json
  - id: health
    explanation: Run user-owned curl directly on the host and record it as inspection.
    kind: cli
    command: capsule exec --session ${SESSION_ID} --purpose inspection -- curl --fail --silent --show-error ${ENTRYPOINT_URL}/health
  - id: fixture-reset
    explanation: Establish the known initial fixture state before the stimulus.
    kind: cli
    command: >-
      capsule exec
      --session ${SESSION_ID}
      --purpose setup
      -- curl --fail --silent --show-error
      --request POST
      --header "Authorization: Bearer capsule-e2e-token"
      --header "Content-Type: application/json"
      --data '{"profile":"fresh"}'
      ${ENTRYPOINT_URL}/fixture/reset
  - id: http-driver
    explanation: Pass a normal curl command through the HTTP driver, which adds endpoint and W3C context.
    kind: cli
    command: >-
      capsule exec
      --session ${SESSION_ID}
      --driver public-api
      --purpose stimulus
      --json
      -- curl --fail --silent --show-error
      --request POST
      --header "Content-Type: application/json"
      --data '{"userId":"alice","paymentMethodId":"pm_capsule_alice"}'
      /subscriptions
  - id: observations-session
    explanation: Read the retained telemetry summary for this exact Capsule execution.
    kind: cli
    command: observations --session ${SESSION_ID} --json
  - id: observations-activity
    explanation: Pull only the spans correlated to the traced HTTP driver activity.
    kind: cli
    command: observations --session ${SESSION_ID} --activity ${DRIVER_ACTIVITY_ID} --json
  - id: observations-trace
    explanation: Pull one exact W3C trace from the Capsule collector.
    kind: cli
    command: observations --session ${SESSION_ID} --trace ${TRACE_ID} --json
  - id: postgres-driver
    explanation: Run the unchanged psql command where the catalog says the client is available.
    kind: cli
    command: >-
      capsule exec
      --session ${SESSION_ID}
      --driver postgres
      --purpose inspection
      -- psql --username fixture --dbname subscriptions
      --tuples-only --no-align
      --command "SELECT user_id || '|' || status FROM subscriptions WHERE user_id = 'alice';"
  - id: report-json
    explanation: Export the running experiment to JSON on stdout; flight control remains open.
    kind: cli
    command: >-
      capsule report export
      --session ${SESSION_ID}
      --format json
      --output -
  - id: report-json-file
    explanation: Export JSON to its automatic report path; the CLI prints the generated filename.
    kind: cli
    command: >-
      capsule report export
      --session ${SESSION_ID}
      --format json
  - id: report-running-html
    explanation: Save a portable HTML snapshot at a custom path while the Capsule is running.
    kind: cli
    command: >-
      capsule report export
      --session ${SESSION_ID}
      --format html
      --output ${REPORT_ROOT}/running.html
  - id: stop
    explanation: Release the exact Capsule's resources; its history stays visible in flight control.
    kind: cli
    command: capsule stop --session ${SESSION_ID} --json
  - id: report-stopped-json
    explanation: Export the stopped session to stdout and inspect the actual cleanup result.
    kind: cli
    command: >-
      capsule report export
      --session ${SESSION_ID}
      --format json
      --output -
  - id: report-html
    explanation: Generate the final portable HTML at its automatic path, after teardown.
    kind: cli
    command: >-
      capsule report export
      --session ${SESSION_ID}
      --format html
  - id: serve-exact
    explanation: Reopen flight control directly on this exact retained experiment; no containers are started.
    kind: serve
    command: >-
      capsule report serve
      --session ${SESSION_ID}
      --open
