comment:
  layout: 'reach, diff, flags, components, files'
  behavior: default
  require_changes: true

coverage:
  status:
    # Alpha reports coverage for visibility. It does not yet define a coverage
    # threshold or publish Codecov status checks as release gates.
    project: false
    patch: false

# The Alpha gate covers the packages/* projects listed in vitest.config.ts,
# so per-package granularity comes from
# path attribution (components), not from separate uploads (flags). Components
# remain useful for informational attribution without creating status checks.
component_management:
  individual_components:
    - component_id: blackbox
      name: blackbox
      paths:
        - packages/blackbox/**
    - component_id: capsule
      name: capsule
      paths:
        - packages/capsule/**
    - component_id: catalog
      name: catalog
      paths:
        - packages/catalog/**
    - component_id: cli
      name: cli
      paths:
        - packages/cli/**
    - component_id: cli-contract
      name: cli-contract
      paths:
        - packages/cli-contract/**
    - component_id: discovery
      name: discovery
      paths:
        - packages/discovery/**
    - component_id: driver
      name: driver
      paths:
        - packages/driver/**
    - component_id: instrumentation
      name: instrumentation
      paths:
        - packages/instrumentation/**
    - component_id: instrumentation-runtime-node
      name: instrumentation-runtime-node
      paths:
        - packages/instrumentation-runtime-node/**
    - component_id: otel-collector
      name: otel-collector
      paths:
        - packages/otel-collector/**
    - component_id: playwright
      name: playwright
      paths:
        - packages/playwright/**
    - component_id: report-server
      name: report-server
      paths:
        - packages/report-server/**
    - component_id: sandbox
      name: sandbox
      paths:
        - packages/sandbox/**
    - component_id: skills
      name: skills
      paths:
        - packages/skills/**
    - component_id: telemetry
      name: telemetry
      paths:
        - packages/telemetry/**

ignore:
  - '**/types.ts' # Type definition files
  - '**/*.d.ts' # TypeScript declaration files
  - '**/index.ts' # Barrel exports
  - '**/*.md' # Documentation files
  # Repo-specific: everything the root tsconfig already treats as non-harness
  # code, plus the test sources themselves.
  - '**/*.test.ts'
  - '**/*.fixture.ts'
  - 'packages/*/node-agent/**' # separate npm project, mounted into containers
  # The broader-test tree after the src/ + tests/ split. Unit tests sit beside
  # their source as packages/*/src/*.test.ts and are covered by '**/*.test.ts'
  # above; everything under tests/ is fixture corpora and integration material.
  # Excluding the directory rather than each fixture spelling means a new
  # fixture shape cannot silently start counting as source.
  - 'packages/*/tests/**'
  # One pre-move directory that test runs still write into.
  - 'packages/*/test-fixtures/**'
  - 'e2e/**' # demo system under test, exercised by a different runner
  - 'examples/**'
  - 'scripts/**'
