storage: /verdaccio/storage

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@suites/*':
    access: $all
    publish: $all
    proxy: npmjs

  '**':
    access: $all
    publish: $all
    proxy: npmjs

# Anonymous publish is allowed (CI-only simulation registry); any auth token
# is accepted. Do not use this config for a real registry.
auth:
  htpasswd:
    file: ./htpasswd
    max_users: -1

logs:
  - { type: stdout, format: pretty, level: http }
