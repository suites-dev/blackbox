storage: /verdaccio/storage

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

packages:
  '@suites/*':
    access: $all
    publish: $all

  '**':
    access: $all
    publish: $all
    proxy: npmjs

auth:
  htpasswd:
    file: /verdaccio/storage/htpasswd

log:
  type: stdout
  format: pretty
  level: warn
