version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      testcontainers:
        patterns:
          - 'testcontainers'
          - '@testcontainers/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@typescript-eslint/*'
          - 'typescript-eslint'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # This standalone Docker build context is not part of the pnpm workspace.
  - package-ecosystem: npm
    directory: '/e2e/sut'
    schedule:
      interval: daily
    commit-message:
      prefix: chore
