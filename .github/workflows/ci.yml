name: Continuous Integration

# The workspace gate: every package builds, typechecks, lints and tests from
# source. Docker-backed Capsule e2e lives in e2e.yml so this lane stays fast.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'agent/**'

# Least privilege: nothing in this workflow writes to the repository.
permissions:
  contents: read

# A new commit on the same pull request supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One source of truth for the toolchain. NODE_VERSION tracks the root
# package.json `engines.node` (>=22.15); PNPM_VERSION tracks `packageManager`.
env:
  CI: true
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22.x

jobs:
  build:
    name: Build and Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build every workspace package
        timeout-minutes: 20
        run: pnpm run build

      # The root tsconfig resolves packages through the blackbox-source
      # condition, so this checks sources rather than emitted declarations.
      - name: Typecheck the workspace
        timeout-minutes: 10
        run: pnpm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Named separately from `pnpm run lint`, which also runs it, so a manifest
      # failure is diagnosable without reading the lint output. It reads only
      # package.json files and takes well under a second.
      - name: Check workspace manifests
        timeout-minutes: 5
        run: pnpm run check:packages

      - name: Check source layout and lint packages
        timeout-minutes: 15
        run: pnpm run lint

      - name: Check E2E lint rules
        run: pnpm --dir e2e run test:lint

      - name: Lint E2E consumer journeys
        run: pnpm --dir e2e run lint

  # Package boundaries from .dependency-cruiser.cjs (layering, cycles, exports,
  # declared dependencies, fan-in) plus the fan-out check in scripts/. It reads
  # sources only, so it needs no build.
  deps:
    name: Dependency boundaries (dependency-cruiser)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Check dependency boundaries
        timeout-minutes: 5
        run: pnpm run check:deps

      # Report only: coupling (Ca, Ce, instability) and size per production
      # module and folder, for choosing metric thresholds. Nothing gates on it.
      - name: Report coupling metrics
        timeout-minutes: 5
        run: pnpm run report:deps-metrics

  test:
    name: Package Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # `pnpm test` builds first: the CLI suite runs the compiled binary.
      - name: Run every package test suite
        timeout-minutes: 25
        run: pnpm run test

      # After the package build: demo/support/postgres-driver.test.mjs loads
      # the built @suites/blackbox-driver.
      - name: Run repository boundary tests
        timeout-minutes: 10
        run: |
          npm ci --prefix e2e/sut --ignore-scripts
          pnpm run test:sut
          pnpm run test:repo

  # Package `test:integration` suites (`*.integration.test.ts`), which the
  # default package configs exclude. They need no Docker: they spawn Node
  # child processes, write temporary directories, bind loopback ports, and
  # run `npm install` against the public registry to build the Node runtime
  # instrumentation dependency tree. Its own job so Package Tests stays fast.
  integration:
    name: Package Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Builds first: the suites import sibling packages through their
      # compiled dist entry points.
      - name: Run every package integration suite
        timeout-minutes: 25
        run: pnpm run test:integration

  # Hard rule 2 of the Gherkin input design: a pull request changes specs
  # (features, the step library, their project files) or code, never both.
  # The check runs the base branch's copy of the checker when the base has
  # one, so a pull request cannot loosen the check that judges it. Node only.
  separation:
    name: Spec/code separation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pull request merge commit and its first parent, the base tip.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test the separation check
        timeout-minutes: 5
        run: node --test scripts/check-spec-separation.test.mjs

      - name: Check spec/code separation
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: |
          git rev-parse --verify --quiet 'HEAD^2' > /dev/null || {
            echo 'error spec-separation: HEAD is not the pull request merge commit' >&2
            exit 1
          }
          checker=scripts/check-spec-separation.mjs
          if git cat-file -e "HEAD^1:$checker" 2> /dev/null; then
            echo "Using the base branch's $checker"
            git show "HEAD^1:$checker" > "$RUNNER_TEMP/check-spec-separation.mjs"
            checker="$RUNNER_TEMP/check-spec-separation.mjs"
          fi
          node "$checker" --base 'HEAD^1'

  # One stable aggregate over the required lanes. Each lane keeps its own
  # diagnosable result; this job only folds them into a single verdict.
  gate:
    name: CI Gate
    needs: [build, lint, deps, test, integration, separation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate required lanes
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          DEPS_RESULT: ${{ needs.deps.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SEPARATION_RESULT: ${{ needs.separation.result }}
        run: |
          status=0
          for lane in \
            "build=$BUILD_RESULT" \
            "lint=$LINT_RESULT" \
            "deps=$DEPS_RESULT" \
            "test=$TEST_RESULT" \
            "integration=$INTEGRATION_RESULT" \
            "separation=$SEPARATION_RESULT"; do
            printf '%s\n' "$lane"
            [[ "${lane#*=}" == success ]] || status=1
          done
          exit "$status"
