name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag to publish or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  CI: true
  NODE_VERSION: 24.x
  PNPM_VERSION: 9.15.4
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  verify:
    name: Verify immutable release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      distribution-tag: ${{ steps.source.outputs.distribution-tag }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify the immutable release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG^{tag}")"
          verified="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')"
          test "$verified" = true

          version="${RELEASE_TAG#v}"
          head="$(git rev-parse HEAD)"
          test "$(git rev-list --max-count=1 "refs/tags/$RELEASE_TAG")" = "$head"
          git merge-base --is-ancestor "$head" refs/remotes/origin/main
          test -z "$(git status --porcelain)"

          if [[ "$version" == *-* ]]; then
            distribution_tag=next
            prerelease=true
          else
            distribution_tag=latest
            prerelease=false
          fi

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$version"
            echo "distribution-tag=$distribution_tag"
            echo "prerelease=$prerelease"
            echo "commit=$head"
          } >>"$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node without a release cache
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the fixed Lerna package set
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          test -z "$(git status --porcelain)"
          test "$(jq -r '.version' lerna.json)" = "$VERSION"
          packages="$(pnpm exec lerna list --all --json)"
          jq -e --arg version "$VERSION" '
            length > 0 and
            all(.[];
              .private == false and
              .version == $version and
              (.name | startswith("@suites/blackbox-")) and
              ((.name | endswith("-internal")) | not)
            )
          ' <<<"$packages" >/dev/null

      - name: Validate source
        run: |
          pnpm run lint
          pnpm run check:deps
          pnpm run typecheck
          pnpm run test

  publish:
    name: Publish with npm provenance
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}

      - name: Confirm the release tag still names the verified commit
        env:
          EXPECTED_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: test "$(git rev-list --max-count=1 "refs/tags/$RELEASE_TAG")" = "$EXPECTED_COMMIT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build every workspace package
        run: pnpm run build

      - name: Publish every package through Lerna
        env:
          DIST_TAG: ${{ needs.verify.outputs.distribution-tag }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          mkdir -p .blackbox/tmp
          pnpm exec lerna publish from-package \
            --yes \
            --dist-tag "$DIST_TAG" \
            --registry https://registry.npmjs.org/ \
            --no-git-reset \
            --summary-file .blackbox/tmp/lerna-publish-summary.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists"
            exit 0
          fi
          arguments=("$TAG" --verify-tag --generate-notes)
          if [[ "$PRERELEASE" == true ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"
