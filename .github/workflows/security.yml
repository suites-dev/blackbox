name: Security

on:
  pull_request:
  push:
    branches: [main, 'release/**']
  schedule:
    - cron: '19 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
      - name: Audit workspace dependencies, including development tools
        run: pnpm audit --audit-level=low
      - name: Audit the standalone test application
        if: ${{ !cancelled() }}
        run: npm audit --prefix e2e/sut --audit-level=low

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: low
          comment-summary-in-pr: never

  semgrep:
    name: Security Boundary Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned scanner
        run: python -m pip install 'semgrep==1.178.0'
      - name: Verify positive and negative rule fixtures
        run: semgrep --test --config .semgrep/blackbox.yml .semgrep/tests/blackbox.ts
      - name: Reject unsafe boundary patterns
        run: semgrep scan --config .semgrep/blackbox.yml --error --strict --disable-nosem --metrics=off packages

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' gitleaks.tar.gz | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan all reachable history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all" .'

  gate:
    name: Security Gate
    if: always()
    needs: [dependencies, dependency-review, semgrep, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every applicable scanner to succeed
        env:
          AUDIT: ${{ needs.dependencies.result }}
          REVIEW: ${{ needs.dependency-review.result }}
          SAST: ${{ needs.semgrep.result }}
          SECRETS: ${{ needs.secrets.result }}
          EVENT: ${{ github.event_name }}
        run: |
          [[ "$AUDIT" == success && "$SAST" == success && "$SECRETS" == success ]] || exit 1
          if [[ "$EVENT" == pull_request ]]; then
            [[ "$REVIEW" == success ]] || exit 1
          else
            [[ "$REVIEW" == skipped ]] || exit 1
          fi
