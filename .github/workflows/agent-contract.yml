name: Agent contract template validation

on:
  pull_request:
    paths:
      - AGENTS.md
      - .github/ISSUE_TEMPLATE/*.yml
      - .github/pull_request_template.md
      - .github/scripts/validate-agent-contract.mjs
      - .github/workflows/agent-contract.yml
      - pnpm-lock.yaml
  push:
    paths:
      - AGENTS.md
      - .github/ISSUE_TEMPLATE/*.yml
      - .github/pull_request_template.md
      - .github/scripts/validate-agent-contract.mjs
      - .github/workflows/agent-contract.yml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  templates:
    name: Validate committed templates
    runs-on: [self-hosted, linux, arm64, blackbox]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
        timeout-minutes: 5
      - run: node .github/scripts/validate-agent-contract.mjs --self-test
