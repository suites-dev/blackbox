name: E2E

# Docker-backed and slow, so it is a workflow of its own: the fast package gate
# in ci.yml never waits on it.
#
# The workspace is built once. Every lane then downloads that build, serves it
# from a disposable registry, and installs from there, so nothing a lane runs
# can resolve back into packages/*/src.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'agent/**'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run from'
        required: true
        type: string
        default: 'release/v0.0.1-alpha'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# One top-level env block only. A second one replaces the first in YAML, which
# is how CI: true stopped reaching the jobs here once before.
env:
  CI: true
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22.x
  BUILD_ARTIFACT: blackbox-dist
  BLACKBOX_TEST_REGISTRY: http://127.0.0.1:4874/

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build every workspace package
        timeout-minutes: 15
        run: pnpm build

      - name: Typecheck source and tests
        timeout-minutes: 10
        run: pnpm typecheck

      - name: Read the fixed version
        id: version
        run: echo "version=$(jq -er '.version' lerna.json)" >>"$GITHUB_OUTPUT"

      - name: Upload the build
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 3

  demo:
    name: Demo
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NO_COLOR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the build
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: packages

      - name: Serve the build from a disposable registry
        uses: ./.github/actions/registry

      - name: Install the published packages into a consumer
        timeout-minutes: 10
        run: pnpm run prepare:consumer

      - name: Run the acceptance journey
        id: acceptance
        timeout-minutes: 20
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane demo --project capsule
          --evidence-dir ci-evidence/demo/capsule -- pnpm run test:demo

      # Preserve hidden files and original colon-containing filenames inside tar.
      - name: Archive exact harness output
        id: archive
        if: always()
        env:
          E2E_TEST_OUTCOME: ${{ steps.acceptance.outcome }}
          E2E_PROJECT: capsule
        run: node .github/scripts/e2e-evidence.mjs

      - name: Retain acceptance evidence
        id: evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: demo
          project: capsule
          evidence-dir: ci-evidence/demo/capsule
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.acceptance.outcome }}
          command: pnpm run test:demo
          expected: |
            log=ci-evidence/demo/capsule/logs/command.log
            archive=.blackbox/tmp/ci-e2e-transport/evidence.tar
            transport=.blackbox/tmp/ci-e2e-transport/transport-receipt.json
            log?=.blackbox/tmp/ci-e2e-transport/archive.log
            logs?=.blackbox/tmp/ci-e2e-commands

      # The acceptance journey removes the consumer on exit, so the storyboard
      # prepares its own.
      - name: Install the published packages again
        if: always() && steps.acceptance.outcome != 'skipped'
        timeout-minutes: 10
        run: pnpm run prepare:consumer

      - name: Play the storyboard
        id: storyboard
        if: always() && steps.acceptance.outcome != 'skipped'
        timeout-minutes: 20
        run: pnpm run test:demo:storyboard

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }} ${{ steps.acceptance.outcome }}
            ${{ steps.archive.outcome }} ${{ steps.evidence.outcome }}
            ${{ steps.storyboard.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  e2e:
    name: E2E
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Validate evidence transport
        id: transport_tests
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane e2e --project journeys
          --evidence-dir .blackbox/tmp/ci-e2e-commands/transport-tests
          -- node --test .github/scripts/e2e-evidence.test.mjs
          .github/scripts/capsule-evidence.test.mjs

      - name: Download the build
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: packages

      - name: Serve the build from a disposable registry
        uses: ./.github/actions/registry

      - name: Install the published packages into a consumer
        timeout-minutes: 10
        run: pnpm run prepare:consumer

      - name: Run the CLI journeys
        id: journeys
        timeout-minutes: 25
        # The runner stages journey artifacts in .blackbox/tmp/ci-e2e-journeys,
        # outside the evidence output tree; the collector copies them in.
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane e2e --project journeys
          --evidence-dir ci-evidence/e2e/journeys -- pnpm run test:e2e:journeys

      - name: Retain journey evidence
        id: journey_evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: e2e
          project: journeys
          evidence-dir: ci-evidence/e2e/journeys
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.journeys.outcome }}
          command: pnpm run test:e2e:journeys
          expected: |
            log=ci-evidence/e2e/journeys/logs/command.log
            logs?=.blackbox/tmp/ci-e2e-journeys

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.transport_tests.outcome }} ${{ steps.setup.outcome }}
            ${{ steps.journeys.outcome }} ${{ steps.journey_evidence.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  rehearsal:
    name: Release rehearsal
    needs: build
    # Only release traffic pays for the rehearsal: a change on its way to main
    # or to a release branch is the one that has to install cleanly for a user.
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main' || startsWith(github.base_ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the build
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: packages

      - name: Serve the build from a disposable registry
        uses: ./.github/actions/registry

      # A consumer with no relationship to this checkout: it installs every
      # package by name and version, imports each public root, and runs the
      # shipped executables. This is what a user gets, and nothing else here
      # proves it.
      - name: Verify a clean registry consumer
        id: consumer
        run: |
          consumer="$(mktemp -d)"
          jq -n --arg version "$VERSION" '{
            name: "blackbox-release-consumer",
            private: true,
            type: "module",
            dependencies: ($ARGS.positional | map({key: ., value: $version}) | from_entries)
          }' --args $(jq -r -s 'map(.name) | .[]' packages/*/package.json) \
            >"$consumer/package.json"

          npm install \
            --prefix "$consumer" \
            --registry "$BLACKBOX_TEST_REGISTRY" \
            --cache "$consumer/.npm-cache" \
            --ignore-scripts \
            --no-audit \
            --no-fund

          while IFS= read -r package; do
            (cd "$consumer" && node --input-type=module --eval 'await import(process.argv[1])' "$package")
          done < <(jq -r -s 'map(.name) | .[]' packages/*/package.json)

          test -x "$consumer/node_modules/.bin/blackbox"
          test -x "$consumer/node_modules/.bin/blackbox-otel-collector"
          "$consumer/node_modules/.bin/blackbox" --help >/dev/null
          (
            cd "$consumer"
            NPM_CONFIG_REGISTRY="$BLACKBOX_TEST_REGISTRY" \
              NPM_CONFIG_CACHE="$consumer/.npm-cache" \
              "$consumer/node_modules/.bin/blackbox" \
              driver install --runtime node --json >/dev/null
          )
          jq -e --arg version "$VERSION" \
            '.dependencies["@suites/blackbox-driver"] == $version' \
            "$consumer/.blackbox/drivers/package.json" >/dev/null
          rm -rf "$consumer"

      # A change entering main is a release candidate, so the version it would
      # publish is stated on the pull request. Release branches carry the same
      # version across many merges, so they get no comment.
      - name: Report the version on the pull request
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          MARKER: '<!-- blackbox-release-version -->'
        run: |
          body="$MARKER
          **Release rehearsal passed for \`$VERSION\`.**

          Every package published to a disposable registry at this version,
          installed into a clean consumer, imported, and ran its executables."
          comment="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq "map(select(.body | startswith(\"$MARKER\"))) | .[0].id // empty")"
          if [[ -n "$comment" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" \
              --field body="$body" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
              --field body="$body" >/dev/null
          fi

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

  gate:
    name: E2E gate
    if: always()
    needs: [build, demo, e2e, rehearsal]
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce lane results
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEMO_RESULT: ${{ needs.demo.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          REHEARSAL_RESULT: ${{ needs.rehearsal.result }}
        run: |
          failed=0
          for lane in "build=$BUILD_RESULT" "demo=$DEMO_RESULT" "e2e=$E2E_RESULT" \
            "rehearsal=$REHEARSAL_RESULT"; do
            name="${lane%%=*}"
            result="${lane#*=}"
            # A skipped rehearsal is the documented outcome off release traffic.
            if [[ "$result" == success || "$result" == skipped ]]; then
              continue
            fi
            echo "lane $name: $result" >&2
            failed=1
          done
          exit "$failed"
