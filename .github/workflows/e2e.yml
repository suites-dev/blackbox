name: E2E

# Docker-backed and slow, so it is a workflow of its own: the fast package gate
# in ci.yml never waits on it.
#
# The workspace is built once and published once, into a disposable registry
# whose storage travels between jobs as the build artifact. Every lane serves
# that same storage and installs from it, so nothing a lane runs can resolve
# back into packages/*/src, and no lane can publish something different from
# what the others got.
#
# Lanes run on separate runners so the slowest one sets the wall clock: each
# golden journey gets its own leg, and lanes that need no registry start with
# the build. The gate below is the one required check over all of them.
on:
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'agent/**'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to run from'
        required: true
        type: string
        default: 'release/v0.0.1-alpha'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

# One top-level env block only. A second one replaces the first in YAML, which
# is how CI: true stopped reaching the jobs here once before.
env:
  CI: true
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22.x
  BUILD_ARTIFACT: blackbox-registry
  BLACKBOX_TEST_REGISTRY: http://127.0.0.1:4874/

jobs:
  build:
    name: Build and publish packages to test registry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      journeys: ${{ steps.journeys.outputs.journeys }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build every workspace package
        timeout-minutes: 15
        run: pnpm build

      - name: Typecheck source and tests
        timeout-minutes: 10
        run: pnpm typecheck

      # An empty list would give the journeys matrix nothing to run, so it fails
      # here instead of passing with no journeys.
      - name: List the golden journeys
        id: journeys
        run: |
          journeys="$(find e2e/journeys -maxdepth 1 -type f -name '*.golden' -printf '%f\n' \
            | sed 's/\.golden$//' | sort | jq -Rnc '[inputs]')"
          jq -e 'length > 0' <<<"$journeys" >/dev/null
          echo "journeys=$journeys" >>"$GITHUB_OUTPUT"

      - name: Serve an empty test registry
        uses: ./.github/actions/registry
        with:
          storage: ${{ runner.temp }}/registry-storage

      # pnpm packs each package so the workspace protocol is rewritten to the
      # exact published version; npm then publishes those tarballs. The token
      # is a formality the registry accepts under its $all publish policy, and
      # npm refuses to publish at all without one. --provenance=false is the
      # only way to override publishConfig.provenance, which the real release
      # keeps: a local registry issues no npm provenance.
      - name: Publish every package to the test registry
        run: |
          tarballs="$RUNNER_TEMP/tarballs"
          rm -rf "$tarballs"
          mkdir -p "$tarballs"
          pnpm --recursive --filter './packages/*' exec pnpm pack --pack-destination "$tarballs"
          for tarball in "$tarballs"/*.tgz; do
            env "npm_config_//127.0.0.1:4874/:_authToken=blackbox-e2e" \
              npm publish "$tarball" \
                --registry "$BLACKBOX_TEST_REGISTRY" \
                --tag e2e \
                --provenance=false
          done

      # Stopped before upload so Verdaccio cannot be mid-write when the storage
      # is read.
      - name: Stop the registry
        run: docker rm --force blackbox-test-registry

      - name: Upload the test registry storage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/registry-storage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  # Needs only the toolchain, so it starts with the build instead of after it.
  transport:
    name: Evidence transport self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run the evidence transport self-tests
        id: transport_tests
        timeout-minutes: 10
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane transport --project self-tests
          --evidence-dir ci-evidence/transport/self-tests
          -- pnpm test:evidence

      - name: Retain transport evidence
        id: transport_evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: transport
          project: self-tests
          evidence-dir: ci-evidence/transport/self-tests
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.transport_tests.outcome }}
          command: pnpm test:evidence
          expected: |
            log=ci-evidence/transport/self-tests/logs/command.log

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }} ${{ steps.transport_tests.outcome }}
            ${{ steps.transport_evidence.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  demo:
    name: Capsule demo / acceptance journey
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NO_COLOR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the test registry storage
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/registry-storage

      - name: Serve the test registry
        uses: ./.github/actions/registry
        with:
          storage: ${{ runner.temp }}/registry-storage

      - name: Install the published packages into a consumer project
        timeout-minutes: 10
        run: pnpm run prepare:consumer

      - name: Run the acceptance journey
        id: acceptance
        timeout-minutes: 20
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane demo --project capsule
          --evidence-dir ci-evidence/demo/capsule -- pnpm test:demo

      # Preserve hidden files and original colon-containing filenames inside tar.
      - name: Archive exact harness output
        id: archive
        if: always()
        env:
          E2E_TEST_OUTCOME: ${{ steps.acceptance.outcome }}
          E2E_PROJECT: capsule
        run: node .github/scripts/e2e-evidence.mjs

      - name: Retain acceptance evidence
        id: evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: demo
          project: capsule
          evidence-dir: ci-evidence/demo/capsule
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.acceptance.outcome }}
          command: pnpm test:demo
          expected: |
            log=ci-evidence/demo/capsule/logs/command.log
            archive=.blackbox/tmp/ci-e2e-transport/evidence.tar
            transport=.blackbox/tmp/ci-e2e-transport/transport-receipt.json
            log?=.blackbox/tmp/ci-e2e-transport/archive.log
            logs?=.blackbox/tmp/ci-e2e-commands

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }} ${{ steps.acceptance.outcome }}
            ${{ steps.archive.outcome }} ${{ steps.evidence.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  # The storyboard reads nothing the acceptance journey leaves behind; it only
  # needs a prepared consumer, so it runs on its own runner.
  storyboard:
    name: Capsule demo / storyboard playback
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      NO_COLOR: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the test registry storage
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/registry-storage

      - name: Serve the test registry
        uses: ./.github/actions/registry
        with:
          storage: ${{ runner.temp }}/registry-storage

      - name: Install the published packages into a consumer project
        timeout-minutes: 10
        run: pnpm run prepare:consumer

      - name: Play the storyboard without pauses
        id: storyboard
        timeout-minutes: 20
        run: pnpm run test:demo:storyboard

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: ${{ steps.setup.outcome }} ${{ steps.storyboard.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  # One runner per golden journey. The list comes from the checkout, so a new
  # golden cannot be left out of the matrix, and each leg keeps --repeat 2.
  journeys:
    name: CLI journey / ${{ matrix.journey }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        journey: ${{ fromJSON(needs.build.outputs.journeys) }}
    env:
      JOURNEY: ${{ matrix.journey }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the test registry storage
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/registry-storage

      - name: Serve the test registry
        uses: ./.github/actions/registry
        with:
          storage: ${{ runner.temp }}/registry-storage

      - name: Install the published packages into a consumer project
        timeout-minutes: 10
        run: pnpm run prepare:consumer

      - name: Run the CLI journey twice
        id: journeys
        timeout-minutes: 15
        # The runner stages journey artifacts in .blackbox/tmp/ci-e2e-journeys,
        # outside the evidence output tree; the collector copies them in.
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane journeys --project "$JOURNEY"
          --evidence-dir "ci-evidence/journeys/$JOURNEY" -- pnpm test:e2e:journeys "$JOURNEY"

      - name: Retain journey evidence
        id: journey_evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: journeys
          project: ${{ matrix.journey }}
          evidence-dir: ci-evidence/journeys/${{ matrix.journey }}
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.journeys.outcome }}
          command: pnpm test:e2e:journeys ${{ matrix.journey }}
          expected: |
            log=ci-evidence/journeys/${{ matrix.journey }}/logs/command.log
            logs?=.blackbox/tmp/ci-e2e-journeys

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }} ${{ steps.journeys.outcome }}
            ${{ steps.journey_evidence.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  feature-contract:
    name: Feature CLI contract checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Qualify journey evidence checks
        run: node --test 'e2e/feature-cli/*.test.mjs'

  feature-cli:
    name: Feature CLI generated skeleton journey
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the test registry storage
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/registry-storage

      - name: Serve the test registry
        uses: ./.github/actions/registry
        with:
          storage: ${{ runner.temp }}/registry-storage

      - name: Run Feature CLI journey pass 1
        id: feature_first
        timeout-minutes: 30
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane feature-cli --project skeleton-pass-1
          --evidence-dir ci-evidence/feature-cli/skeleton-pass-1
          -- node e2e/feature-cli/run.mjs --repeat 1

      - name: Retain Feature CLI pass 1 evidence
        id: evidence_first
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: feature-cli
          project: skeleton-pass-1
          evidence-dir: ci-evidence/feature-cli/skeleton-pass-1
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.feature_first.outcome }}
          command: node e2e/feature-cli/run.mjs --repeat 1
          expected: |
            log=ci-evidence/feature-cli/skeleton-pass-1/logs/command.log
            logs?=.blackbox/tmp/ci-feature-cli

      - name: Run Feature CLI journey pass 2
        id: feature_second
        if: ${{ steps.feature_first.outcome == 'success' && steps.evidence_first.outcome == 'success' }}
        timeout-minutes: 30
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane feature-cli --project skeleton-pass-2
          --evidence-dir ci-evidence/feature-cli/skeleton-pass-2
          -- node e2e/feature-cli/run.mjs --repeat 1

      - name: Retain Feature CLI pass 2 evidence
        id: evidence_second
        if: ${{ always() && steps.feature_second.outcome != 'skipped' }}
        uses: ./.github/actions/ci-evidence
        with:
          lane: feature-cli
          project: skeleton-pass-2
          evidence-dir: ci-evidence/feature-cli/skeleton-pass-2
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.feature_second.outcome }}
          command: node e2e/feature-cli/run.mjs --repeat 1
          expected: |
            log=ci-evidence/feature-cli/skeleton-pass-2/logs/command.log
            logs?=.blackbox/tmp/ci-feature-cli

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }}
            ${{ steps.feature_first.outcome }} ${{ steps.evidence_first.outcome }}
            ${{ steps.feature_second.outcome }} ${{ steps.evidence_second.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  playwright:
    name: Playwright system tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download the test registry storage
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/registry-storage

      - name: Serve the test registry
        uses: ./.github/actions/registry
        with:
          storage: ${{ runner.temp }}/registry-storage

      # The script prepares its own registry-installed consumer, then
      # materializes this project in it.
      - name: Run the Playwright system tests
        id: playwright_tests
        timeout-minutes: 30
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane playwright --project system-tests
          --evidence-dir ci-evidence/playwright/system-tests -- pnpm test:e2e:playwright

      - name: Archive exact Playwright harness output
        id: playwright_archive
        if: always()
        env:
          E2E_TEST_OUTCOME: ${{ steps.playwright_tests.outcome }}
        run: node .github/scripts/playwright-e2e-evidence.mjs

      - name: Retain Playwright evidence
        id: playwright_evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: playwright
          project: system-tests
          evidence-dir: ci-evidence/playwright/system-tests
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.playwright_tests.outcome }}
          command: pnpm test:e2e:playwright
          expected: |
            log=ci-evidence/playwright/system-tests/logs/command.log
            archive=.blackbox/tmp/ci-playwright-e2e-transport/evidence.tar
            transport=.blackbox/tmp/ci-playwright-e2e-transport/transport-receipt.json
            log?=.blackbox/tmp/ci-playwright-e2e-transport/archive.log

      - name: Stop the registry
        if: always()
        run: docker rm --force blackbox-test-registry

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }} ${{ steps.playwright_tests.outcome }}
            ${{ steps.playwright_archive.outcome }} ${{ steps.playwright_evidence.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  # Packs the main package and its core dependencies, then installs the main
  # package and CLI directly. No Docker, registry, or prepared consumer is needed.
  skills:
    name: Skills plugin packed install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run the packed Skills install check
        id: skills
        timeout-minutes: 10
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane skills --project packed-install
          --evidence-dir ci-evidence/skills/packed-install -- pnpm test:e2e:skills

      - name: Retain Skills evidence
        id: skills_evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: skills
          project: packed-install
          evidence-dir: ci-evidence/skills/packed-install
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.skills.outcome }}
          command: pnpm test:e2e:skills
          expected: |
            log=ci-evidence/skills/packed-install/logs/command.log

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }} ${{ steps.skills.outcome }}
            ${{ steps.skills_evidence.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  # The sandbox Docker tests import packages/sandbox/src only, so this lane needs
  # neither the build nor the test registry and starts alongside them. They skip
  # themselves without BLACKBOX_SANDBOX_DOCKER_TEST=1 so `pnpm test` passes on a
  # machine without Docker; test:sandbox:docker sets it and runs every
  # *.docker.test.ts file.
  sandbox:
    name: Sandbox Docker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_branch || github.ref }}

      - name: Setup toolchain
        id: setup
        uses: ./.github/actions/setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run the sandbox Docker tests
        id: sandbox_tests
        timeout-minutes: 15
        run: >-
          node .github/scripts/ci-evidence.mjs run --lane sandbox --project docker
          --evidence-dir ci-evidence/sandbox/docker -- pnpm test:sandbox:docker

      - name: Retain sandbox Docker evidence
        id: sandbox_evidence
        if: always()
        uses: ./.github/actions/ci-evidence
        with:
          lane: sandbox
          project: docker
          evidence-dir: ci-evidence/sandbox/docker
          setup-result: ${{ steps.setup.outcome }}
          result: ${{ steps.sandbox_tests.outcome }}
          command: pnpm test:sandbox:docker
          expected: |
            log=ci-evidence/sandbox/docker/logs/command.log

      - name: Enforce lane outcomes
        if: always()
        env:
          OUTCOMES: >-
            ${{ steps.setup.outcome }} ${{ steps.sandbox_tests.outcome }}
            ${{ steps.sandbox_evidence.outcome }}
        run: |
          for outcome in $OUTCOMES; do
            [[ "$outcome" == success ]] || exit 1
          done

  # This display name is the required status check in branch protection
  # (maintainers/docs/security.md). Renaming it without first updating the live
  # ruleset blocks every merge.
  gate:
    name: E2E Gate
    if: always()
    needs:
      [
        build,
        transport,
        demo,
        storyboard,
        journeys,
        playwright,
        feature-contract,
        feature-cli,
        skills,
        sandbox,
      ]
    runs-on: ubuntu-24.04
    steps:
      # Every lane always runs, so anything but success fails the gate. A matrix
      # lane reports one result for all of its legs, so one failed, cancelled or
      # skipped journey fails it too.
      - name: Require every lane to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          TRANSPORT_RESULT: ${{ needs.transport.result }}
          DEMO_RESULT: ${{ needs.demo.result }}
          STORYBOARD_RESULT: ${{ needs.storyboard.result }}
          JOURNEYS_RESULT: ${{ needs.journeys.result }}
          FEATURE_CONTRACT_RESULT: ${{ needs.feature-contract.result }}
          FEATURE_CLI_RESULT: ${{ needs.feature-cli.result }}
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
          SKILLS_RESULT: ${{ needs.skills.result }}
          SANDBOX_RESULT: ${{ needs.sandbox.result }}
        run: |
          failed=0
          for lane in "build=$BUILD_RESULT" "transport=$TRANSPORT_RESULT" "demo=$DEMO_RESULT" \
            "storyboard=$STORYBOARD_RESULT" "journeys=$JOURNEYS_RESULT" \
            "feature-contract=$FEATURE_CONTRACT_RESULT" "feature-cli=$FEATURE_CLI_RESULT" "playwright=$PLAYWRIGHT_RESULT" "skills=$SKILLS_RESULT" "sandbox=$SANDBOX_RESULT"; do
            name="${lane%%=*}"
            result="${lane#*=}"
            if [[ "$result" != success ]]; then
              echo "lane $name: $result" >&2
              failed=1
            fi
          done
          exit "$failed"
