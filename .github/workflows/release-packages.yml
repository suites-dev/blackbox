name: Prepare Release

# Manual only. Versions and tags the packages; it never publishes to npm.
# Publishing stays a separate, separately triggered workflow.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        type: choice
        options:
          - 'prerelease'
          - 'graduate'
          - 'stable'
        required: true
        default: 'prerelease'
      target_branch:
        description: 'Target Branch'
        type: choice
        options:
          - 'release/v0.0.1-alpha'
          - 'main'
        required: true
        default: 'release/v0.0.1-alpha'
      preid:
        description: 'Prerelease ID (prerelease type only)'
        type: choice
        options:
          - 'alpha'
          - 'beta'
          - 'rc'
          - 'next'
        required: true
        default: 'alpha'
      force:
        description: 'Force-version all packages (use for first release / bootstrap)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

env:
  CI: true
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 22.x

jobs:
  release-e2e:
    name: Release E2E Gate
    uses: ./.github/workflows/e2e-release.yml
    permissions:
      contents: read
    with:
      target_branch: ${{ github.event.inputs.target_branch }}

  tag-version:
    name: Version & Tag
    needs: [release-e2e]
    runs-on: [self-hosted, linux, arm64, blackbox]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        timeout-minutes: 15
        run: pnpm install --frozen-lockfile

      - name: Build
        timeout-minutes: 15
        run: pnpm build

      - name: Config Git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Prerelease Version
        if: ${{ github.event.inputs.release_type == 'prerelease' }}
        timeout-minutes: 10
        run: |
          npx lerna version --yes \
            --conventional-commits \
            --conventional-prerelease ${{ github.event.inputs.force == 'true' && '"*"' || '' }} \
            --preid ${{ github.event.inputs.preid }} \
            --allow-branch ${{ github.event.inputs.target_branch }} \
            ${{ github.event.inputs.force == 'true' && '--force-publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Graduate Version
        if: ${{ github.event.inputs.release_type == 'graduate' }}
        timeout-minutes: 10
        run: |
          npx lerna version --yes \
            --conventional-graduate ${{ github.event.inputs.force == 'true' && '"*"' || '' }} \
            --allow-branch ${{ github.event.inputs.target_branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stable Version
        if: ${{ github.event.inputs.release_type == 'stable' }}
        timeout-minutes: 10
        run: |
          npx lerna version --yes \
            --conventional-commits \
            --allow-branch ${{ github.event.inputs.target_branch }} \
            ${{ github.event.inputs.force == 'true' && '--force-publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Prepared" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.event.inputs.target_branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Type:** \`${{ github.event.inputs.release_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Preid:** \`${{ github.event.inputs.preid }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tagged" >> $GITHUB_STEP_SUMMARY
          git tag --sort=-creatordate | head -10 | while read tag; do
            echo "- \`$tag\`" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next: run the **Publish Packages** workflow." >> $GITHUB_STEP_SUMMARY
