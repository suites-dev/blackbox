name: Full product demo — Playwright checks

# Scoped to the requested demo PR branch. Not a production pipeline.
on:
  push:
    branches: [demo/full-final-product]
    paths:
      - 'full-final-product/**'
      - '!full-final-product/runs/**'
      - '!full-final-product/validation/**'
      - '.github/workflows/full-final-product.yml'

permissions:
  contents: read

jobs:
  validate-demo:
    if: github.repository == 'suites-dev/blackbox' && github.ref == 'refs/heads/demo/full-final-product'
    runs-on: [self-hosted, linux, arm64, blackbox]
    timeout-minutes: 10
    permissions:
      contents: write # Only publishes generated fixture files to this demo branch, never the base.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare isolated Alpha 1 fixture test project
        run: |
          cp -R full-final-product "$RUNNER_TEMP/full-final-product"
          cd "$RUNNER_TEMP/full-final-product"
          npm install --ignore-scripts --no-audit --no-fund
          node tools/build-fixtures.mjs
          node tools/build-fixtures.mjs --check
          node tools/validate-fixtures.mjs
          npx playwright install --with-deps chromium
      - name: Run actual Playwright tests of fixture data and report UI
        shell: bash
        run: |
          set -o pipefail
          cd "$RUNNER_TEMP/full-final-product"
          mkdir -p artifacts
          {
            echo "Scope: synthetic Alpha 1 artifact consistency + report UI; NOT the omitted checkout SUT."
            echo "Source commit: $GITHUB_SHA"
            echo '$ npx playwright test --config=demo.playwright.config.ts'
            npx playwright test --config=demo.playwright.config.ts
          } 2>&1 | tee artifacts/playwright-console.txt
      - name: Retain generated artifacts and actual test receipt
        run: |
          cp -R "$RUNNER_TEMP/full-final-product/runs/." full-final-product/runs/
          mkdir -p full-final-product/validation
          cp "$RUNNER_TEMP/full-final-product/artifacts/playwright-console.txt" full-final-product/validation/
          cp "$RUNNER_TEMP/full-final-product/artifacts/playwright-results.json" full-final-product/validation/
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          const results=JSON.parse(readFileSync('full-final-product/validation/playwright-results.json','utf8'));
          writeFileSync('full-final-product/validation/execution.json',JSON.stringify({
            scope:'synthetic Alpha 1 artifact consistency and report UI, not checkout system execution',
            command:'npx playwright test --config=demo.playwright.config.ts',
            sourceCommit:process.env.GITHUB_SHA,workflowRunId:process.env.GITHUB_RUN_ID,
            stats:results.stats
          },null,2)+'\n');
          JS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- full-final-product/runs full-final-product/validation
          if ! git diff --cached --quiet; then
            git commit -m 'docs(demo): retain generated Alpha 1 fixtures and actual Playwright receipt [skip ci]'
            # Non-force push refuses concurrent edits rather than replacing them.
            git push origin HEAD:refs/heads/demo/full-final-product
          fi
      - name: Upload console, screenshots and test results (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-final-product-playwright
          path: ${{ runner.temp }}/full-final-product/artifacts/
          if-no-files-found: warn
          retention-days: 14
