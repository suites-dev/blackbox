name: Serve a disposable package registry
description: >-
  Run Verdaccio over a storage directory, so a lane installs Blackbox the way a
  user would instead of reaching into the workspace. The build job populates
  that directory once by publishing into it; every other job mounts the copy it
  downloaded. This action never builds and never publishes.

inputs:
  storage:
    description: >-
      Host directory holding the registry's storage. An empty directory makes
      an empty registry, which is what the publishing job wants.
    required: true
  port:
    description: Host port the registry listens on.
    required: false
    default: '4874'
  container:
    description: Name of the registry container.
    required: false
    default: blackbox-test-registry
  image:
    description: Pinned Verdaccio image.
    required: false
    default: verdaccio/verdaccio:6.10.3

outputs:
  registry:
    description: URL of the running registry.
    value: ${{ steps.start.outputs.registry }}

runs:
  using: composite
  steps:
    - name: Start the registry
      id: start
      shell: bash
      env:
        STORAGE: ${{ inputs.storage }}
        PORT: ${{ inputs.port }}
        CONTAINER: ${{ inputs.container }}
        IMAGE: ${{ inputs.image }}
      run: |
        registry="http://127.0.0.1:${PORT}/"
        mkdir -p "$STORAGE"
        docker rm --force "$CONTAINER" >/dev/null 2>&1 || true
        # Run as the runner so the container can write the storage it was given,
        # including the htpasswd file Verdaccio creates on demand. Without this
        # the image's own uid owns nothing in a downloaded artifact.
        docker run --detach \
          --name "$CONTAINER" \
          --user "$(id -u):$(id -g)" \
          --publish "127.0.0.1:${PORT}:4873" \
          --volume "$GITHUB_WORKSPACE/.github/verdaccio/config.yaml:/verdaccio/conf/config.yaml:ro" \
          --volume "$STORAGE:/verdaccio/storage" \
          "$IMAGE"
        # --retry-all-errors covers the window where the port is bound but
        # Verdaccio answers with an empty reply; --retry-connrefused alone is
        # not enough and exits 52.
        if ! curl --retry 60 --retry-all-errors --retry-delay 1 --fail --silent "${registry}-/ping" >/dev/null; then
          docker logs "$CONTAINER"
          exit 1
        fi
        echo "registry=$registry" >>"$GITHUB_OUTPUT"
