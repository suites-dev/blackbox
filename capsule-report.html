function baselineBody(a){if(a.baseline==='not-configured')return `<div class="empty">${icon('file')}<h3>No effects baseline configured</h3><p>Explicit runtime checks still apply. An absent baseline is not a warning or a passing comparison.</p></div>`;if(a.baseline==='matched')return `<div class="subhead">${eyebrow('Recorded snapshot comparison')}${status('matched')}</div><p class="small muted">The accepted example shape matched within this attempt’s qualified scope and mapping policy.</p><div class="mini-note">A matched effects shape does not prove whole-system correctness or worker consumption. Baseline acceptance is not available from this read-only report.</div>${ref('attempt:'+a.id,'Inspect retained attempt')}`;return `<div class="subhead">${eyebrow('Recorded snapshot comparison')}${status('incomplete')}</div><h3>Multiplicity mismatch witnessed</h3><p class="small muted" style="margin-top:8px">Full equivalence remains indeterminate. The retained observations already exceed the accepted request count.</p><div class="baseline-table"><span class="head">Operation</span><span class="head">Accepted</span><span class="head">Observed</span><code>POST /orders</code><code>1</code><code class="red">at least 2</code></div><p class="small muted">Subject: system / full / subscriptions.<br>Mapping: <code>mapping-client-occurrences-example-v1</code>.</p>${ref('baseline:full','Inspect baseline identity and policy')}<div class="mini-warning">This report cannot accept a candidate or update the judge. A changed baseline requires a separate authorized action.</div>`}
function scenarioView(){const s=D.scenarios.find(x=>x.id===S.scenario)||D.scenarios[0];let a=D.attempts.find(x=>x.id===S.attempt&&x.scenarioId===s.id);if(!a&&s.attemptIds.length){a=D.attempts.find(x=>x.id===s.attemptIds[0]);S.attempt=a.id}
 let header=`<div class="panel-head"><div>${eyebrow(s.flow)}<h2>${E(s.title)}</h2><p>${E(s.file)}</p></div>${status(s.status)}</div>`;
 if(!a)return `<section class="panel">${header}<div class="panel-body"><div class="empty">${icon('minus')}<h3>Selected, but not executed</h3><p>${E(s.description)}</p></div>${ref('check:parallel-isolation','Inspect the unexecuted obligation')}<div class="mini-warning">This scenario remains in the selected denominator. No synthetic physical attempt or application verdict was created.</div></div></section>`;
 const tabs=['checks','effects','capture','baseline'];const names={checks:'Checks',effects:'Observed effects',capture:'Capture',baseline:'Effects baseline'};
 const body=S.tab==='checks'?checksBody(a):S.tab==='effects'?`<div class="subhead">${eyebrow('Distinct observed occurrences')}${badge(a.effects.length+' retained','dim')}</div>${effectTable(a.effects)}<div class="mini-note">${D.refs['capture:'+a.id].data.state==='complete'?'Complete only for the declared fixture boundary.':'This is not a complete execution history.'} Operation witnesses do not establish committed state. Select a row to inspect its mapping and source.</div>`:S.tab==='capture'?captureBody(a):baselineBody(a);
 return `<section class="panel">${header}<div style="padding:0 20px 17px"><div class="attempt-tabs">${s.attemptIds.map(id=>{const a=D.attempts.find(x=>x.id===id);return `<button class="attempt-tab ${S.attempt===id?'active':''}" data-attempt="${id}">${icon(sym(a.status),tone(a.status))}Attempt ${a.retry}${a.retry?' · retry':''}<span class="dim">${E(a.duration)}</span></button>`}).join('')}</div><div class="attempt-facts"><span><code>${E(a.id)}</code></span><span>Project: ${E(a.project)}</span><span>SUT: ${E(a.sut)}</span><span>Runner: ${E(a.status)}</span></div>${s.status==='flaky'?'<p class="footnote amber">The retry does not erase the failed first attempt or resolve its unknown check.</p>':''}</div><div class="tabbar" role="tablist" aria-label="Attempt details">${tabs.map(t=>`<button class="tab ${S.tab===t?'active':''}" role="tab" aria-selected="${S.tab===t}" data-tab="${t}">${names[t]}${t==='effects'?' · '+a.effects.length:''}</button>`).join('')}</div><div class="panel-body" role="tabpanel">${body}</div></section><div class="panel"><div class="panel-body"><div class="subhead">${eyebrow('Question & acceptance boundary')}${ref('context','Context','inline-button')}</div><p class="small muted">${E(s.description)}</p><p class="footnote">The canonical explanation names the actual check. Intent, commentary and a passing response cannot strengthen it.</p></div></div>`
}
function checkpointCard(c){return `<section class="checkpoint" id="${c.id}"><div class="byline">${icon('pen')}Grisha · authored interpretation <span class="dim">${E(c.time)}</span></div><h3>${E(c.title)}</h3><p>${E(c.summary)}</p><p class="next"><b>Next step</b> ${E(c.next)}</p><div class="refchips">${c.refs.map(r=>ref(r,(D.refs[r]?.title||r).slice(0,42),'refchip')).join('')}${ref('checkpoint:'+c.id,'Source checkpoint','refchip')}</div>${c.phase.includes('after')?'<p class="footnote">Appended after environment stop. Sealed observations remain unchanged.</p>':''}</section>`}
function activityCard(a){return `<details class="activity ${a.role==='stimulus'?'stimulus':''}" id="${a.id}" ${a.role==='stimulus'?'open':''}><summary class="activity-top"><span class="activity-num">0${a.order}</span><span class="activity-heading"><span class="role">${E(a.role)} · ${E(a.kind)}</span><strong>${E(a.title)}</strong><small>${E(a.participant)} · ${E(a.duration)}</small></span>${badge(a.outcome,'dim')}<span class="activity-time">${E(a.time)}</span>${icon('chevron','chevron')}</summary><div class="activity-note">${E(a.note)}</div><div class="activity-body"><div class="result-line">${eyebrow('Recorded invocation')}${ref('activity:'+a.id,'Activity source','inline-button')}</div><div class="command"><pre>${E(a.command)}</pre><button class="icon-button" data-copy-command="${a.id}" aria-label="Copy recorded command">${icon('copy')}</button></div><div class="result-line"><span>Delegated result</span>${badge(a.outcome,'dim')}</div><pre class="output">${E(a.stdout)}</pre>${a.effects.length?`<div class="subhead section-gap">${eyebrow('What was observed')}${badge('Partial capture','amber','question')}</div><div class="flow-line"><div class="flow-node">${icon('globe')}<div>public-api</div><small>POST /subscriptions</small></div>${icon('arrow')}<div class="flow-node emphasis"><div>order-service</div><small class="pink">2 request occurrences</small></div>${icon('arrow')}<div class="flow-node">${icon('queue')}<div>SQS</div><small>Publish observed</small></div></div>${effectTable(a.effects)}<p class="footnote">The trace links these selected observations. Retained counts are lower bounds under partial capture, not a complete business history.</p><div class="scope-bar"><span>Activity 02 only · ${E(a.id)}</span>${ref(a.captureRef,'Scope & capture','inline-button')}</div>`:`<div class="mini-warning">Runtime observation unavailable. ${E(a.note)}</div>`}</div></details>`}
function timeline(){const l=D.lifecycle;return `<div class="section-heading"><div><h2>Activity timeline</h2><p>Actions, observations, and authored interpretation.</p></div>${badge(`${D.activities.length} activities`,'dim')}</div><div class="lifecycle">${icon('box')}<span>${E(l.startedLabel)} · ${E(D.sut)}</span><span class="time">${E(l.startedAt)}</span></div>${D.activities.map(activityCard).join('')}${D.checkpoints.map(checkpointCard).join('')}<div class="lifecycle">${icon('stop')}<span>${E(l.stoppedLabel)} · ${E(l.cleanupLabel)}<br><span class="dim">${E(l.cleanupNote)}</span></span><span class="time">${E(l.stoppedAt)}</span></div><div class="panel"><div class="panel-body">${eyebrow('Deferred artifact placeholders')}<h3 style="margin:8px 0">Testing artifacts are not produced by Capsule</h3><p class="small muted">${D.placeholders.length} placeholder records remain visible in the Evidence pack. They are not claims about this execution.</p><button class="button" data-page="artifacts">${icon('file')}View placeholders</button></div></div>`}
function summaryView(){let scs=D.scenarios.filter(s=>S.filter==='all'||['failed','flaky','not-run'].includes(s.status));return `<div class="section-heading"><div><h2>Selected scenarios</h2><p>All ${D.scenarios.length} selected scenarios remain part of this report.</p></div>${badge('1 retry retained','dim','retry')}</div><div class="inventory-tools"><div class="filters">${['all','attention'].map(f=>`<button class="filter ${S.filter===f?'active':''}" data-scenario-filter="${f}">${f==='all'?'All scenarios':'Needs attention'}</button>`).join('')}</div><span class="small dim">Showing ${scs.length} of ${D.scenarios.length}</span></div><div class="panel">${scs.map(s=>`<button class="all-scenario" data-scenario="${s.id}">${icon(sym(s.status),tone(s.status))}<span><strong>${E(s.title)}</strong><small>${E(s.flow)} · ${s.attemptIds.length} ${s.attemptIds.length===1?'attempt':'attempts'}</small></span>${status(s.status)}${icon('chevron')}</button>`).join('')}</div><div class="panel"><div class="panel-body"><div class="subhead">${eyebrow('Recorded assurance · all physical attempts')}${ref('summary','Source summary','inline-button')}</div><div class="progress-mini" aria-label="5 satisfied, 1 violated, 2 unknown, 1 not evaluated"><span class="ok" style="width:55.555%"></span><span class="bad" style="width:11.111%"></span><span class="unk" style="width:22.222%"></span><span class="none" style="width:11.111%"></span></div><div class="legend"><span class="green"><i></i>5 satisfied</span><span class="red"><i></i>1 violated</span><span class="amber"><i></i>2 unknown</span><span class="dim"><i></i>1 not evaluated</span></div><p class="footnote">8 evaluated check records across physical attempts + 1 selected unexecuted obligation. This distribution is not a confidence or quality score.</p><div class="mini-note">Policy: required-checks-completeness-first-v1. A known violation remains visible beneath the indeterminate aggregate; the retry does not resolve a previous attempt’s unknown result.</div></div></div>`}
function artifactsView(){const files=Object.values(D.pack);const missing=D.requirements.filter(x=>x.state==='unavailable');const placeholders=D.placeholders;let rows=[...missing.map(x=>({id:x.id,path:'No artifact · '+x.role,role:x.reason,scope:x.scope,state:'unavailable'})),...placeholders.map(x=>({id:'placeholder:'+x.id,path:x.id,role:x.reason,scope:x.phase,state:'placeholder'})),...files.map(f=>({id:'file:'+f.path,path:f.path,role:f.role,scope:f.scope,state:'retained',bytes:f.bytes}))];if(S.inventoryFilter!=='all')rows=rows.filter(x=>x.state===S.inventoryFilter);return `<div class="section-heading"><div><h2>Evidence pack</h2><p>${files.length} retained files · ${missing.length} unavailable requirements · ${placeholders.length} placeholders.</p></div>${ref('manifest','Main manifest','button small')}</div><div class="mini-note" style="margin:0 0 15px">Inventory is not completeness. Placeholders identify artifacts deferred to Testing; they are never treated as retained evidence.</div><div class="inventory-tools"><div class="filters">${['all','retained','unavailable','placeholder'].map(f=>`<button class="filter ${S.inventoryFilter===f?'active':''}" data-inventory-filter="${f}">${title(f)}</button>`).join('')}</div><span class="small dim">${rows.length} entries shown</span></div><section class="panel">${rows.map(r=>`<button class="artifact-row" ${r.state==='placeholder'?'':`data-ref="${E(r.id)}"`}>${icon(r.state==='unavailable'?'question':r.state==='placeholder'?'minus':'file',tone(r.state))}<span style="min-width:0"><span class="file-name">${E(r.path)}</span><span class="sub" style="display:block">${E(r.scope)} · ${E(r.role)}</span></span><span class="state">${r.state==='placeholder'?badge('Placeholder','dim'):status(r.state)}</span></button>`).join('')}</section><p class="footnote">This prototype keeps the manifest, closure, selection and context surfaces visible while marking their current records as placeholders.</p>`}
function contextView(){const c=D.context;return `<section class="panel"><div class="panel-head"><div>${eyebrow('The exact question & execution')}<h2>Verification context</h2><p>Implementation, observation, and expectation identities stay separate.</p></div>${ref('context','Source','button small')}</div><div class="panel-body"><div class="ctx-grid"><div class="ctx-card">${icon('branch')}<h3>Implementation</h3><code>${E(c.implementation.identity)}</code><p>${E(c.implementation.source)} · no dirty changes in this example.<br>Not a production revision or a claim of an actual application defect.</p></div><div class="ctx-card">${icon('stack')}<h3>Catalog & acquisition</h3><code>blackbox.config.yaml</code><code>${E(c.catalog.identity)}</code><p>Full system and dependency-closed subsystem selections. Ordinary Compose inputs; no second topology authority.</p></div><div class="ctx-card">${icon('box')}<h3>Instrumentation Bundle</h3><code>${E(c.bundle.directory)}</code><p>Alex-owned SDK and dependencies. Prepared during Compose build; activated before imports. Application dependencies stay separate.</p></div><div class="ctx-card">${icon('code')}<h3>Effect mapping</h3><code>${E(c.mapping.identity)}</code><p>Count distinct outgoing request occurrences. Redelivery does not inflate counts; identical attributes do not collapse different occurrences.</p></div><div class="ctx-card">${icon('shield')}<h3>Accepted expectations</h3><code>${E(c.expectations.identity)}</code><p>${isTest?'The recorded test predicate defines the evaluated obligation.':'The Capsule intent is prose. No runtime checks were requested here.'} Baseline acceptance is a separate authorized action.</p></div><div class="ctx-card">${icon('eye')}<h3>Evaluation & projection</h3><code>${E(c.policy.evaluation)}</code><p>Pure report projection of retained results. No assurance evaluation is produced in Capsule reports. No automatic reanalysis occurs in the browser.</p></div></div><pre class="ctx-tree">Alex’s repository
├── package.json                  application dependencies
├── blackbox.config.yaml         tracked catalog
└── .blackbox/instrumentation/node/
    ├── package.json             instrumentation dependencies
    ├── pnpm-lock.yaml
    └── instrumentation.ts       Alex-owned factory</pre><div class="readonly-alert">Changing application code, repairing observation, and changing accepted behavior are different operations. These examples do not claim that a later successful attempt proves a code repair.</div><details class="supplement"><summary>Trust and compatibility limits</summary><p>${c.trust.map(E).join('<br>')}</p><p>Bundle dependency isolation is not trust isolation. Exact production mapping and closure schemas remain separate implementation contracts.</p></details></div></section>`}
function aboutView(){return `<section class="panel"><div class="panel-head"><div>${eyebrow('Design prototype · September 2026')}<h2>What this report demonstrates</h2><p>No application or Blackbox execution produced these records.</p></div>${badge('Synthetic','pink')}</div><div class="panel-body"><p class="muted small">This interactive example applies the Blackbox report contracts to two different report structures. It is a UI and artifact-linkage prototype, not an implementation of the producer, evaluator, public CLI, or its schemas.</p><div class="ctx-grid section-gap"><div class="ctx-card"><h3>Capsule: activity first</h3><p>Recorded setup, stimulus and diagnostic invocations. Supported observations stay distinct from command output and Grisha’s authored Checkpoints. Intent does not create a runtime check.</p></div><div class="ctx-card"><h3>Playwright: attempt first</h3><p>Scenarios retain all physical attempts, actual predicates, native assertions, qualification, effects, gaps, baseline comparisons and unexecuted obligations.</p></div><div class="ctx-card"><h3>Pure projection</h3><p>Every check result is authored fixture data. The browser navigates and counts retained records; it does not evaluate a claim, accept a baseline, rerun the SUT, or strengthen a result.</p></div><div class="ctx-card"><h3>Inspectable bytes</h3><p>Source JSON is embedded, with SHA-256 digests of the fixture bytes. These are not signatures or proof of exhaustive observation. All UI data uses the illustrative blackbox.report-design/1 schema.</p></div></div><div class="mini-warning">The duplicate-order and capture-failure examples are hypothetical. The borrowed subscription topology is a source-derived application reference, not a test result for the actual repository.</div><div class="subhead section-gap">${eyebrow('Keyboard & navigation')}</div><p class="small muted">Use Tab and Enter to navigate. Press / to search, Escape to close the inspector or mobile navigation. Select a check or observation to follow its witnesses into retained source JSON. Both HTML files work offline; exporting never modifies retained data.</p><div class="section-gap">${action('Export embedded pack','export','download')}${action('Inspect main manifest','manifest','file','button subtle','style="margin-left:8px"')}</div></div></section>`}
function searchView(){const q=S.search.toLowerCase();const hits=Object.values(D.refs).filter(r=>[r.title,r.kind,r.path,JSON.stringify(r.data)].join(' ').toLowerCase().includes(q));return `<div class="section-heading"><div><h2>Search retained records</h2><p>${hits.length} matches for “${E(S.search)}”.</p></div></div><div class="panel">${hits.slice(0,60).map(r=>`<button class="search-result" data-ref="${E(r.id)}">${icon(r.kind==='check'?'shield':r.kind==='effect'?'activity':'file')}<span>${eyebrow(r.kind)}${E(r.title)}<small>${E(r.path||'No retained artifact')}</small></span>${icon('chevron')}</button>`).join('')||'<div class="empty">No matching retained records.</div>'}</div>${hits.length>60?'<p class="footnote">First 60 matches shown. Refine the search to narrow the results.</p>':''}`}
function rawFor(r){return r.path&&D.pack[r.path]?D.pack[r.path].content:JSON.stringify(r.data,null,2)}
function syntax(t){const safe=E(t);return safe.replace(/(&quot;(?:[^&]|&(?!quot;))*?&quot;)(\s*:)?|\b(true|false|null)\b|\b(-?\d+(?:\.\d+)?)\b/g,(m,s,k,b,n)=>s?`<span class="${k?'key':'str'}">${s}</span>${k||''}`:b?`<span class="bool">${b}</span>`:`<span class="num">${n}</span>`)}
function sourceBox(r){if(!r.path||!D.pack[r.path])return `<div class="mini-warning">No artifact was retained for this requirement. The requirement and reason remain in the execution manifest.</div>`;const f=D.pack[r.path];return block('Retained source',`<div class="filebox">${icon('file')}<div><code>${E(r.path)}</code><p class="small dim" style="margin-top:4px;font-size:9px">${f.bytes.toLocaleString()} bytes · ${E(f.role)}</p></div></div><div class="hash" style="margin-top:8px">sha256:${E(f.sha256)}</div><p class="footnote" style="margin-top:5px">Digest identifies the fixture bytes, not source honesty.</p>`)}
function inspectDetails(r){const d=r.data;let out=eyebrow(r.kind==='checkpoint'?'GRISHA · AUTHORED INTERPRETATION':r.kind==='check'?'RECORDED EVALUATION':r.kind==='effect'?'OBSERVED OCCURRENCE':r.kind==='manifest'?'SEALED INPUT INDEX':r.kind.toUpperCase())+`<div class="inspector-title">${E(r.title)}</div>`;
 if(r.kind==='check'){
  if(d.evaluation==='not-evaluated'){out+=status(d.evaluation)+`<div class="mini-warning">${E(d.reason)}</div><p class="footnote">Selected before execution; no physical attempt is invented.</p>`}
  else{out+=`<div class="pillrow">${status(d.evaluation)}${badge('Evidence '+d.evidenceQuality,tone(d.evidenceQuality))}</div>`+block('Evaluated predicate',`<div class="predicate">${E(d.predicate)}</div>`)+block('Decision basis',`<p class="blurb">${E(d.reason)}</p>`);
  if(d.lowerBound!==null){out+=block('Count bounds',`<div class="bounds"><div>${d.lowerBound===d.upperBound?`N = ${d.lowerBound}`:`${d.lowerBound} ≤ N ≤ ${d.upperBound===null?'∞':d.upperBound}`}<small>${d.upperBound===null?'Observed lower bound; no established upper bound.':'Count within the declared qualified domain.'}</small></div></div>`)}
  out+=block('Separate result dimensions',kv('Logic',d.evaluation)+kv('Qualification',d.qualification)+kv('Evidence quality',d.evidenceQuality)+kv('Scope',d.scopeId));
  out+=block(d.witnessRefs.length?'Witnesses / counterexamples':'Supporting boundary',d.witnessRefs.length?d.witnessRefs.map(refid=>ref(refid,D.refs[refid].title,'refbutton',D.refs[refid].data.occurrenceId)).join(''):ref('capture:'+d.scopeId,d.authority==='state'?'Why state is not established':'Inspect scoped coverage and closure'));
  out+=`<div class="mini-note">${E(d.limitation)} ${d.authority==='state'?'An operation span cannot supply an authoritative state value.':''}</div>`+block('Policy identity',`<code class="break">${E(d.policy)}</code>`)
  }
 }else if(r.kind==='effect'){
  out+=badge('Observed · '+d.origin,'blue','eye')+block('Meaning',`<p class="blurb">${E(d.meaning)}</p>`)+block('Occurrence identity',kv('Producer',d.service)+kv('Boundary',d.boundary)+kv('Operation',d.operation+' '+d.target)+kv('Occurrence',d.occurrenceId)+kv('Scope',d.scopeId));
  out+=block('Mapping',`<code class="break">${E(d.mapping)}</code><p class="footnote">Delivery duplicates do not increase this count. Different occurrences remain distinct even with identical attributes.</p>`)+block('Supporting telemetry',ref(d.spanRef,'Inspect source span','refbutton',d.spanId))+`<div class="mini-note">${E(d.sourceAuthority)}</div>`;
 }else if(r.kind==='span'){
  out+=badge('Synthetic telemetry','blue')+block('Source fields',kv('Trace ID',d.traceId)+kv('Span ID',d.spanId)+kv('Parent span',d.parentSpanId||'Not recorded')+kv('Kind',d.kind)+kv('Service',d.serviceName)+kv('Status',d.status))+block('Attributes',`<pre class="json">${syntax(JSON.stringify(d.attributes,null,2))}</pre>`)+`<div class="mini-note">${E(d.note)}</div>`;
 }else if(r.kind==='capture'){
  out+=status(d.state)+block('Declared boundary',`<p class="blurb">${E(d.boundary)}</p><p class="footnote">${E(d.windowId)}</p>`)+block('Qualification inputs',d.dimensions.map(x=>`<div class="kv"><span class="key">${E(x.name)}</span>${status(x.state)}</div>`).join(''))+`<div class="mini-warning">${E(d.limitation)}</div>`+block('Limits of this example',`<p class="blurb">${d.assumptions.map(E).join('<br>')}</p><p class="footnote">${E(d.protocolStatus)}</p>`);
 }else if(r.kind==='activity'){
  out+=`<div class="pillrow">${badge(d.role,'pink')}${badge(d.outcome,'dim')}</div>`+block('Recorded invocation',`<pre class="json">${E(d.command)}</pre>`)+block('Command output',`<pre class="output">${E(d.stdout)}</pre>`)+block('Runtime observation',status(d.observation)+`<p class="blurb" style="margin-top:9px">${E(d.note)}</p>`);if(d.captureRef)out+=ref(d.captureRef,'Inspect capture qualification');
 }else if(r.kind==='checkpoint'){
  out+=badge('Interpretation · not a verdict','pink','pen')+block('Author & timing',kv('Author',d.author)+kv('Time',d.time)+kv('Phase',d.phase))+block('Explanation',`<p class="blurb">${E(d.summary)}</p>`)+block('Proposed next step',`<p class="blurb">${E(d.next)}</p>`)+block('Referenced evidence',d.refs.map(x=>ref(x)).join(''))+`<div class="mini-note">This commentary does not alter retained observations or machine results.</div>`;
 }else if(r.kind==='manifest'){
  const missing=d.artifactRequirements.filter(x=>x.state==='unavailable');out+=badge('Evidence index · not a verdict','blue','file')+block('Identity',kv('Execution',d.execution.id)+kv('Kind',d.execution.kind)+kv('Indexed input artifacts',d.artifactInventory.length)+kv('Unfulfilled requirements',missing.length))+block('Required, but unavailable',missing.map(x=>ref(x.id,x.role,'refbutton',x.scope)).join('')||'<p class="blurb">No unavailable requirements recorded.</p>')+block('Bound context',ref('context','Exact verification context'))+`<div class="mini-note">${E(d.inventoryMeaning)} Evaluations and commentary are downstream records, not additions to the sealed input manifest.</div>`;
 }else if(r.kind==='requirement'){
  out+=status(d.state)+block('Required artifact role',kv('Role',d.role)+kv('Scope',d.scope))+`<div class="mini-warning">${E(d.reason||'Retained under the referenced identity.')}</div>`+ref('manifest','Inspect original requirement in manifest');
 }else if(r.kind==='baseline'){
  out+=status(d.comparison)+block('Subject & acceptance',kv('Project',d.subject.project)+kv('Scenario',d.subject.scenario)+kv('SUT',d.subject.sut)+kv('Accepted identity',d.identity)+kv('Accepted by',d.acceptedBy))+block('Known mismatch',`<div class="predicate">POST /orders<br>Accepted: 1<br>Observed: at least 2</div>`)+`<div class="mini-warning">${E(d.reason)}</div>`+block('Authority',`<p class="blurb">${E(d.authority)}</p>`);
 }else if(r.kind==='summary'){
  out+=status(d.aggregate)+block('Recorded outcomes',kv('Satisfied checks',d.checks.satisfied)+kv('Violated checks',d.checks.violated)+kv('Unknown checks',d.checks.unknown)+kv('Not evaluated',d.checks.notEvaluated)+kv('Native runner',d.runner)+kv('Cleanup',d.cleanup))+block('Aggregation policy',`<code class="break">${E(d.aggregatePolicy)}</code><p class="blurb" style="margin-top:9px">${E(d.detail)}</p><p class="footnote">${E(d.evaluationScope)}</p>`);
 }else if(r.kind==='context'){
  out+=block('Separate fingerprints',kv('Implementation',d.implementation.identity)+kv('Bundle',d.bundle.identity)+kv('Mapping',d.mapping.identity)+kv('Expectations',d.expectations.identity)+kv('Catalog',d.catalog.identity))+block('Authority',`<p class="blurb">${d.trust.map(E).join('<br><br>')}</p>`)+action('Open context page','context','settings','button subtle');
 }else if(r.kind==='attempt'){
  out+=status(d.status)+block('Physical execution',kv('Attempt',d.id)+kv('Retry index',d.retry)+kv('SUT',d.sut)+kv('Project',d.project)+kv('Response',d.response))+block('Recorded checks',d.checkIds.map(x=>ref('check:'+x)).join(''))+ref('capture:'+d.id,'Capture for this attempt')+`<div class="mini-note">No other attempt can supply this attempt’s evidence.</div>`;
 }else if(r.kind==='scenario'){
  out+=status(d.status)+`<p class="blurb" style="margin-top:14px">${E(d.description)}</p>`+block('Selected attempts',d.attemptIds.length?d.attemptIds.map(x=>ref('attempt:'+x)).join(''):'<p class="blurb">None. This scenario was selected but did not execute.</p>');
 }else if(r.kind==='artifact'){
  const f=D.pack[d.path];out+=badge(f.sealedInput?'Input evidence':'Derived / commentary','blue')+block('Artifact identity',kv('Role',f.role)+kv('Scope',f.scope)+kv('Bytes',f.bytes.toLocaleString())+kv('Format','Illustrative design schema'))+`<div class="mini-note">Use Source JSON to inspect or export the exact retained fixture content.</div>`;
 }
 return out+sourceBox(r)
}
function renderInspector(){const el=$('#inspector');el.className='inspector'+(!S.explicitDrawer?' is-default':'');el.hidden=!S.drawer;if(!S.drawer)return;const r=D.refs[S.ref]||D.refs.manifest;S.ref=r.id;const raw=S.inspectorTab==='source';el.innerHTML=`<div class="inspector-head"><span>${icon('eye')}Evidence inspector</span><div class="tools"><button class="icon-button" data-action="back" aria-label="Previous evidence" ${past.length?'':'disabled'}>${icon('back')}</button><button class="icon-button" data-action="close-inspector" aria-label="Close evidence inspector">${icon('cross')}</button></div></div><div class="inspector-tabs"><button class="tab ${!raw?'active':''}" data-inspector-tab="details">Details</button><button class="tab ${raw?'active':''}" data-inspector-tab="source">${r.path?'Source JSON':'Recorded requirement'}</button></div><div class="inspector-body">${raw?`${eyebrow(r.path||'Requirement metadata')}<div class="source-actions">${action('Copy JSON','copy-source','copy','button small')}${action('Save JSON','download-source','download','button small')}</div><pre class="json" tabindex="0">${syntax(rawFor(r))}</pre>${sourceBox(r)}`:inspectDetails(r)}</div>`}
function renderReport(){rail();hero();$('#breadcrumb-kind').textContent=isTest?'Playwright report':'Capsule report';$('#canvas').innerHTML=S.page==='scenario'&&isTest?scenarioView():S.page==='timeline'&&!isTest?timeline():S.page==='summary'&&isTest?summaryView():S.page==='artifacts'?artifactsView():S.page==='context'?contextView():S.page==='search'?searchView():aboutView();$('#workspace').classList.toggle('drawer-hidden',!S.drawer);renderInspector();$('#footer').innerHTML=`<div class="banner-footer"><span>Synthetic design example · retained fixtures, not a real execution.<br>This report does not rerun verification, accept expectations, or modify evidence.</span><button class="inline-button" data-page="about">${icon('info')}About the data &amp; schema</button></div>`}
function groupSelection(ids,titleText){selectRef(ids[0]);const el=$('.inspector-body');if(ids.length>1){const current=el.innerHTML;el.innerHTML=`<div class="mini-note" style="margin:0 0 16px"><strong>${ids.length} distinct retained occurrences</strong><p class="small muted">${E(titleText)}. Under partial capture, this is a lower bound.</p>${ids.map(x=>ref(x,D.refs[x].data.occurrenceId)).join('')}</div>`+current}}

// Summary records never borrow another experiment's activity or evidence artifacts.
function experiments(){
 return [{...D.registry.primary,title:D.title,description:D.intent,system:D.sut,duration:D.duration,state:D.summary.environment,capture:D.summary.capture},...D.registry.examples];
}
function experimentUrl(id){return '#'+new URLSearchParams({experiment:id,page:'timeline'}).toString()}
function experimentTitle(row){return row.title||row.id}
function experimentDate(row){return new Intl.DateTimeFormat('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'UTC'}).format(new Date(row.startedAt))+' UTC'}
function environmentBadge(state){return badge(({running:'Running',stopped:'Stopped',failed:'Startup failed'})[state]||'Unknown',({running:'blue',stopped:'dim',failed:'red'})[state]||'dim',state==='running'?'activity':state==='failed'?'cross':'stop')}
function registryRail(){
 rail();
 $('#rail .rail-scroll').innerHTML=`<div class="rail-label">Workspace</div><a class="nav active" href="#page=registry" aria-current="page">${icon('grid')}<span>Experiments</span><span class="count">${experiments().length}</span></a><div class="rail-label">Capsule discovery</div><p style="padding:0 20px;color:var(--muted);font-size:15px;line-height:1.8">Retained sessions, activities, and observations.<br><br>Testing and assurance are placeholders.</p>`;
}
function experimentCard(row){
 return `<a class="experiment-card" href="${E(experimentUrl(row.id))}"><div class="experiment-symbol">${icon('box')}</div><div><h2>${E(experimentTitle(row))}</h2><div class="experiment-id">${row.title?E(row.id):'No title provided · session ID shown'}</div><p>${E(row.description)}</p><div class="experiment-meta"><span>${icon('stack')}${E(row.system)}</span><span>${icon('clock')}${E(experimentDate(row))}</span><span>${E(row.duration)}</span></div></div><div class="experiment-side">${environmentBadge(row.state)}<span class="experiment-open">${row.kind==='embedded-report'?'Open experiment':'View summary'}${icon('arrow')}</span></div></a>`;
}
function registryResults(){
 const query=registryState.search.toLowerCase().trim();
 const rows=experiments().filter(row=>(registryState.filter==='all'||row.state===registryState.filter)&&[row.id,row.title,row.description,row.system].filter(Boolean).join(' ').toLowerCase().includes(query));
 rows.sort((a,b)=>registryState.sort==='title'?experimentTitle(a).localeCompare(experimentTitle(b)):(registryState.sort==='oldest'?1:-1)*(Date.parse(a.startedAt)-Date.parse(b.startedAt)));
 $('#registry-count').textContent=`${rows.length} of ${experiments().length} experiments · synthetic example data`;
 $('#registry-results').innerHTML=rows.length?rows.map(experimentCard).join(''):`<div class="registry-empty"><h2>No matching experiments</h2><p>Try a different title, session ID, or system, or clear the filters.</p><button class="button" data-action="reset-registry">Clear search and filters</button></div>`;
}
function renderRegistry(){
 const rows=experiments();registryRail();
 $('#breadcrumb-kind').textContent='Registry';
 $('#hero').innerHTML=`<div class="registry-hero">${eyebrow('CAPSULE · EXPERIMENT REGISTRY')}<h1>Experiments</h1><p class="intent">${E(D.registry.description)}</p></div>`;
 $('#metrics').innerHTML=`<div class="registry-summary"><span><strong>${rows.length}</strong>experiments</span><span><strong>${rows.filter(r=>r.state==='running').length}</strong>running</span><span><strong>${rows.filter(r=>r.state==='stopped').length}</strong>stopped</span><span><strong>${rows.filter(r=>r.state==='failed').length}</strong>startup failed</span></div>`;
 $('#alert').innerHTML='';
 $('#canvas').innerHTML=`<div class="registry-note">${icon('info')} <strong>Design preview.</strong> Every session here is synthetic. “${E(D.title)}” includes the detailed report; the other sessions illustrate registry states with summary fixtures only.</div><div class="registry-controls"><div class="registry-filters" role="group" aria-label="Filter by environment state">${['all','running','stopped','failed'].map(value=>`<button class="registry-filter" aria-pressed="${registryState.filter===value}" data-registry-filter="${value}">${({all:'All experiments',running:'Running',stopped:'Stopped',failed:'Startup failed'})[value]}</button>`).join('')}</div><label class="registry-sort">Sort by <select id="registry-sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title</option></select></label></div><p id="registry-count" class="registry-count" role="status"></p><div id="registry-results" class="experiment-list"></div>`;
 $('#registry-sort').value=registryState.sort;registryResults();
}
function renderSummary(){
 registryRail();const row=experiments().find(r=>r.id===selectedExperiment);
 $('#breadcrumb-kind').textContent=row?'Experiment summary':'Unavailable experiment';
 $('#hero').innerHTML=`<a class="registry-back" href="#page=registry">${icon('back')}All experiments</a><div class="registry-hero">${eyebrow('CAPSULE · '+(row?'SUMMARY FIXTURE':'EXACT SESSION'))}<h1>${E(row?experimentTitle(row):'Experiment not found')}</h1><div class="experiment-id">${E(selectedExperiment)}</div>${row?`<p class="intent">${E(row.description)}</p>`:''}</div>`;
 $('#metrics').innerHTML='';$('#alert').innerHTML='';
 $('#canvas').innerHTML=row?`<div class="registry-summary"><span>${environmentBadge(row.state)}</span><span>${E(row.system)}</span><span>${E(experimentDate(row))}</span><span>${E(row.duration)}</span></div><div class="registry-note"><strong>Detailed report unavailable in this prototype.</strong><p>${E(row.note)}</p>Observation capture: ${E(row.capture)}. No activity count, cleanup result, or assurance verdict is inferred.</div>`:`<div class="registry-empty"><p>No fixture exists for this exact session ID. Return to the registry to select an available experiment.</p><a class="registry-back" href="#page=registry">${icon('back')}All experiments</a></div>`;
}
function render(){
 const detailed=selectedExperiment===D.id;
 document.body.classList.toggle('registry-page',!detailed);
 const search=$('#global-search');search.disabled=selectedExperiment!==null&&!detailed;
 search.placeholder=detailed?'Find in experiment…':'Search experiments…';
 search.setAttribute('aria-label',detailed?'Search retained report records':'Search experiments by title, session ID, or system');
 search.value=detailed?S.search:registryState.search;
 if(detailed){
  renderReport();
  $('#rail .rail-scroll').insertAdjacentHTML('afterbegin',`<a class="registry-rail-back" href="#page=registry">${icon('back')}All experiments</a>`);
 }else{
  if(selectedExperiment===null)renderRegistry();else renderSummary();
  $('#workspace').classList.add('drawer-hidden');$('#inspector').hidden=true;
  $('#footer').innerHTML=`<div class="banner-footer"><span>Blackbox · ${E(D.registry.project)}<br>Read-only design preview · synthetic sessions · no live Docker connection</span><span>Capsule observations<br>Testing &amp; assurance deferred</span></div>`;
 }
 document.title=selectedExperiment===null?'Blackbox · Experiments':`Blackbox · ${experiments().find(r=>r.id===selectedExperiment)?.title||selectedExperiment}`;
}

document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;if(b.dataset.registryFilter){registryState.filter=b.dataset.registryFilter;document.querySelectorAll('[data-registry-filter]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));registryResults();return}if(b.dataset.action==='reset-registry'){registryState.search='';registryState.filter='all';render();$('#global-search').focus();return}if(b.dataset.page){setPage(b.dataset.page);return}if(b.dataset.scenario){selectScenario(b.dataset.scenario);return}if(b.dataset.ref){selectRef(b.dataset.ref);return}if(b.dataset.group){groupSelection(b.dataset.group.split('|'),b.dataset.groupTitle);return}if(b.dataset.attempt){S.attempt=b.dataset.attempt;S.tab='checks';const a=D.attempts.find(x=>x.id===S.attempt);S.ref='check:'+a.checkIds[0];S.inspectorTab='details';S.explicitDrawer=false;render();saveHash();return}if(b.dataset.tab){S.tab=b.dataset.tab;$('#canvas').innerHTML=scenarioView();saveHash();return}if(b.dataset.inspectorTab){S.inspectorTab=b.dataset.inspectorTab;renderInspector();return}if(b.dataset.scenarioFilter){S.filter=b.dataset.scenarioFilter;$('#canvas').innerHTML=summaryView();return}if(b.dataset.inventoryFilter){S.inventoryFilter=b.dataset.inventoryFilter;$('#canvas').innerHTML=artifactsView();return}if(b.dataset.scrollActivity){S.page='timeline';render();const a=document.getElementById(b.dataset.scrollActivity);if(a){a.open=true;a.scrollIntoView({block:'center'})}closeMenu();return}if(b.dataset.checkpoint){S.page='timeline';render();document.getElementById(b.dataset.checkpoint)?.scrollIntoView({block:'center'});selectRef('checkpoint:'+b.dataset.checkpoint);closeMenu();return}if(b.dataset.copyCommand){copy(D.activities.find(x=>x.id===b.dataset.copyCommand).command);return}const a=b.dataset.action;if(!a)return;if(a==='export'){download(JSON.stringify({designSchema:D.designSchema,synthetic:true,executionId:D.id,manifestDigest:D.manifestDigest,files:D.pack},null,2)+'\n',D.id+'-evidence-pack.json');return}if(a==='copy-source')copy(rawFor(D.refs[S.ref]));if(a==='download-source'){const r=D.refs[S.ref];download(rawFor(r),(r.path||r.id).split('/').pop().replace(/[^\w.-]/g,'_')+(r.path?'':'.json'))}if(a==='close-inspector'){S.drawer=false;renderInspector();$('#workspace').classList.add('drawer-hidden')}if(a==='back'&&past.length){S.ref=past.pop();S.inspectorTab='details';renderInspector();highlight();saveHash()}if(a==='context')setPage('context');if(a==='manifest')selectRef('manifest');if(a==='menu'){$('#rail').classList.toggle('open');$('#rail-mask').classList.toggle('show')}});
$('#global-search').addEventListener('input',e=>{if(selectedExperiment===null){registryState.search=e.target.value;registryResults();return}S.search=e.target.value.trim();S.page=S.search?'search':isTest?'summary':'timeline';rail();$('#canvas').innerHTML=S.search?searchView():isTest?summaryView():timeline()});
document.addEventListener('change',e=>{if(e.target.id==='registry-sort'){registryState.sort=e.target.value;registryResults()}});
$('#rail-mask').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#global-search').focus()}if(e.key==='Escape'){if($('#rail').classList.contains('open'))closeMenu();else{S.drawer=false;renderInspector();$('#workspace').classList.add('drawer-hidden')}}});
window.addEventListener('hashchange',()=>{readHash();render();closeMenu();window.scrollTo({top:0,behavior:'instant'});const heading=$('#hero h1');if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true})}});
readHash();render();
window.__BLACKBOX_REPORT__={data:D,getState:()=>({...S,selectedExperiment,registry:{...registryState}}),getRecord:id=>D.refs[id]||null};
})();
</script></body></html>
